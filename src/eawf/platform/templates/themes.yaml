# Statusline themes for `eawf cc statusline`.
#
# Each theme overrides:
#   - separator: string joined between rendered segments (e.g. " | ").
#   - skip_failed: when true, modules that raised are dropped from output;
#     when false they render "<module>:n/a(render-failed)".
#   - colors: mapping from segment status to an ANSI escape sequence (or
#     null/empty to disable color for that status). The renderer prepends
#     the literal ESC byte () to every non-empty value at runtime so
#     YAML can keep the values printable.
#     `info` marks a value that claims no health either way and stays
#     uncoloured; `degraded` (red) is kept for a real fault.
#   - glyph: per-module prefix glyph (or null/"" for no glyph).
#
# When `COLUMNS` names a width, the renderer drops the segments least worth
# keeping that no longer fit; colour escapes never count against it.
#
# Themes referenced by `EAWF_STATUSLINE_THEME` env var or `--theme` flag.
# The orchestrator falls back to `default` if the requested theme is
# missing.

default:
  separator: " | "
  skip_failed: false
  colors:
    ok: "[32m"        # green
    info: ""          # uncoloured
    warn: "[33m"      # yellow
    missing: "[90m"   # bright black (grey)
    degraded: "[31m"  # red
    reset: "[0m"
  glyph:
    scope: ""
    git: ""
    model_session_cwd: ""
    context_tokens: ""
    cost: ""
    mcp_health: ""
    hooks_plugins: ""
    memory: ""
    token_saving: ""

powerline:
  separator: "  "
  skip_failed: false
  colors:
    ok: "[38;5;82m"
    info: ""
    warn: "[38;5;220m"
    missing: "[38;5;245m"
    degraded: "[38;5;196m"
    reset: "[0m"
  glyph:
    scope: "P"
    git: "G"
    model_session_cwd: "M"
    context_tokens: "C"
    cost: "U"
    mcp_health: "X"
    hooks_plugins: "H"
    memory: "R"
    token_saving: "$"

ascii-fallback:
  separator: " | "
  skip_failed: true
  colors:
    ok: ""
    info: ""
    warn: ""
    missing: ""
    degraded: ""
    reset: ""
  glyph:
    scope: ""
    git: ""
    model_session_cwd: ""
    context_tokens: ""
    cost: ""
    mcp_health: ""
    hooks_plugins: ""
    memory: ""
    token_saving: ""
