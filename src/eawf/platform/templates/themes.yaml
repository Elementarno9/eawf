# Statusline palettes for `eawf cc statusline`.
#
# Exactly two palettes, `light` and `dark`, each a closed set of 24-bit
# `#rrggbb` colours (see `Palette` in src/eawf/surfaces/render/statusline.py
# for what each role paints). The palette is picked per redraw from
# `--theme`, `EAWF_STATUSLINE_THEME`, Claude Code's `theme` setting or
# `COLORFGBG`, in that order, and defaults to dark.
#
# Every foreground drawn on a background here must keep a WCAG contrast of
# at least 4.5:1: `ink` on each segment fill, each fill on `base` (the
# powerline arrow), and `text`, `muted`, `track`, the bar levels and the
# trend colours on `base`. A test computes the ratio for every pair.
#
# The hues follow Catppuccin: Mocha accents on a Mocha base for dark, and
# Latte accents darkened until they hold 4.5:1 on a Latte base for light.

dark:
  base: "#1e1e2e"
  ink: "#11111b"
  text: "#cdd6f4"
  muted: "#a6adc8"
  track: "#9399b2"
  label: "#bac2de"
  model: "#cba6f7"
  project: "#89b4fa"
  active_time: "#94e2d5"
  cost: "#a6e3a1"
  mcp: "#89dceb"
  scope: "#b4befe"
  budget: "#f9e2af"
  warn: "#fab387"
  alert: "#f38ba8"
  low: "#a6e3a1"
  mid: "#f9e2af"
  high: "#f38ba8"
  rising: "#fab387"
  falling: "#a6e3a1"

light:
  base: "#eff1f5"
  ink: "#eff1f5"
  text: "#4c4f69"
  muted: "#5c5f77"
  track: "#5c5f77"
  label: "#4c4f69"
  model: "#7a2fd6"
  project: "#1a56d6"
  active_time: "#0e6f74"
  cost: "#2d7a1e"
  mcp: "#036d99"
  scope: "#4b5fd6"
  budget: "#8a5a0a"
  warn: "#b0450a"
  alert: "#b80d32"
  low: "#2d7a1e"
  mid: "#8a5a0a"
  high: "#b80d32"
  rising: "#b0450a"
  falling: "#2d7a1e"
