# Statusline themes for `eawf cc statusline`.
#
# Each theme names one colour per role (see `Theme` in
# src/eawf/surfaces/render/statusline.py for what each role paints). A fill is
# an SGR background code (40-47, 100-107) or a 24-bit `#rrggbb`; `ink`, the
# text on a segment fill, is an SGR foreground code, a `#rrggbb` or `auto`,
# white or black per fill, whichever stands out. Gaps, meter-row text and the
# cell after the last separator are never painted: they stay on the
# terminal's own background (SGR 49) in every theme. The pace marker is no
# role: it is drawn white or black, whichever stands out on its cell.
#
# `ansi` is the default: the terminal's own 16 colours, so the line follows
# whatever palette the terminal is set to. Its ink is replaced by the
# `statusline.ink` config leaf. The four Catppuccin flavours take their hex
# from the upstream palette.json and reuse the same roles: mauve, blue, teal,
# green for model, project, session, cost; sky, lavender, yellow for MCP,
# scope, budget; peach and red for warn and alert; surface2 for the bar
# track; teal, yellow, red for the bar fills; green for a limit bar under
# pace; ink crust (Latte: base).

ansi:
  ink: "auto"
  model: "45"
  project: "44"
  active_time: "46"
  cost: "42"
  mcp: "47"
  scope: "105"
  budget: "106"
  warn: "43"
  alert: "41"
  track: "100"
  calm: "46"
  caution: "43"
  danger: "41"
  under: "42"

