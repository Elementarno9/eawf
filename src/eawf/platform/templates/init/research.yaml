# Research bootstrap template (C08 D7 — 3 v0.3 templates).
#
# Consumed by ``eawf init --template research``. Merged with operator
# answers (project_code, project_title) to produce ``.ea/config.yaml``.
#
# dispatch.session_policy_default is ``fresh``: session resume
# (``continue`` / ``hybrid``) is not implemented by any runtime adapter
# yet, so every wave dispatch starts from a clean session. Real resume
# is deferred to P31.
schema_version: "1.0"
profiles:
  enabled: [core, research]
runtime:
  preference: [claude, codex]
dispatch:
  session_policy_default: fresh
planning:
  approval: ask
  max_parallel_waves: 2
audit:
  default_checks: [state, evidence_chain]
ship:
  require_audit_pass: true
  require_memory_review: true
project:
  goals: []
  success_metrics: {}
