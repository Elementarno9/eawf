schema_version: 1
module_id: eawf.core.vcs
version: 2
kind: core
topic: vcs
title: Branches, worktrees and commits
when_to_use: creating a branch or worktree, committing, cherry-picking, opening a pull request or preparing a push
rules:
  - rule_id: eawf.core.vcs.worktree-discipline
    obligation_id: vcs.worktree-discipline
    revision: 4
    title: Branch worktrees from the feature branch and cherry-pick back
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Branch each Task's worktree from the Milestone branch HEAD, never from main; bring its commits back by in-order cherry-pick, never by merge, and remove the worktree only after they land. Run side by side only the Tasks the Batch's dependency graph and write claims leave independent.
    rationale: >-
      A worktree cut from main misses the Milestone's earlier Tasks, and a merge buries per-Task commits under a merge node that bisect and the Task trailers cannot follow.
    verification:
      method: review
  - rule_id: eawf.core.vcs.branch-currency
    obligation_id: vcs.branch-currency
    revision: 2
    title: Confirm the branch is current before opening or resuming scope
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Before opening or resuming a Milestone, Batch or Task, fetch and confirm the branch is based on its intended source; after preserving any dirty work, rebase or fast-forward a stale branch, or record why it stays behind.
    rationale: >-
      Work started on a stale base collides with changes already landed and turns into conflict repair at cherry-pick or merge time.
    verification:
      method: review
  - rule_id: eawf.core.vcs.pre-commit
    obligation_id: vcs.pre-commit
    revision: 1
    title: Run the pre-commit hooks before every commit
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Run the pre-commit hooks over the change before every commit and root-cause each failure; never skip them with --no-verify.
    rationale: >-
      A skipped hook moves the failure to CI or to the next person, where it costs more to diagnose than it did to fix locally.
    verification:
      method: review
  - rule_id: eawf.core.vcs.commit-scope-carrier
    obligation_id: vcs.commit-scope-carrier
    revision: 5
    title: Name the Batch and its Tasks in every commit
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Write a Batch commit as "<type>: <summary>" with one `Batch: BAT-<NNNN>` trailer and a `Task: <KEY>` trailer per Task it delivers, each of that Batch; a single-Task commit may carry its `Task:` trailer alone; write the trailing state commit as "state: <summary>" touching only committed state paths.
    rationale: >-
      The trailers tie every commit to the Batch and Tasks it delivers, so the pre-push commit lint, the release check and the rebind after a squash find the work without reading prose.
    verification:
      method: review
    procedure_ref: docs/rules/commit-prefix.md
  - rule_id: eawf.core.vcs.branch-naming
    obligation_id: vcs.branch-naming
    revision: 2
    title: Name Milestone and Task branches by the release symbol
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Name the long-running Milestone branch feature/<symbol>-v<X.Y> and each Task worktree branch feature/<symbol>-v<X.Y>-<task-key> with the Task key in lower case, and delete a Task branch once its commits are cherry-picked.
    rationale: >-
      A predictable name lets tooling and reviewers map a branch to its release and Task without opening state.
    verification:
      method: review
  - rule_id: eawf.core.vcs.commit-granularity
    obligation_id: vcs.commit-granularity
    revision: 7
    title: Land one commit per Batch and one state commit per push
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Before review opens, squash the branch to one buildable commit per Batch, or a few for a large Batch, code with its tests; after review opens, only append fix Batches; end each push with one `state:` commit; rebind each binding a squash replaced with `eawf batch rebind`, never by editing a row.
    rationale: >-
      A deliverable split across commits cannot be reviewed or reverted as a unit and bisect lands on trees that never worked; a Batch binds the Milestone branch head when it lands, so the squash leaves that binding naming a commit no branch reaches until a superseding row rebinds it.
    verification:
      method: review
    procedure_ref: docs/rules/commit-granularity.md
  - rule_id: eawf.core.vcs.pr-body
    obligation_id: vcs.pr-body
    revision: 2
    title: Shape every pull request body the same way
    zone: steering
    force: should
    effectiveness: behavioral
    instruction: >-
      Write a pull request body with a Summary of three to six bullets and a Test plan checklist; a Milestone pull request adds a Milestone deliverables section linking the Milestone's applied PlanRevision.
    verification:
      method: review
