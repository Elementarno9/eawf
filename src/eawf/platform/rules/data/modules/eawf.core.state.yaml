schema_version: 1
module_id: eawf.core.state
version: 1
kind: core
topic: state
title: Lifecycle state authority
when_to_use: reading or changing phase, iter, wave or decision records, or any file under the .ea directory
rules:
  - rule_id: eawf.core.state.ea-directory-committed
    obligation_id: state.ea-directory-commit-policy
    revision: 3
    title: Commit the project state and profile files
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Commit .ea/state.json, .ea/profile.yaml and each generation's state.json, ledgers and Task definitions with the release, delivery or decision behind them; keep in-flight Task status and Run rows (each generation's local/), .ea/locks/ and .ea/local/ out of git.
    rationale: >-
      The committed files are the source of truth for what was released, delivered and decided, so a clone without them has no history; in-flight Task status and Run rows are a local projection rebuilt from the ledger, and committing them, like locks and local drafts, would only add a commit per status change.
    verification:
      method: review
  - rule_id: eawf.core.state.daemon-mutator
    obligation_id: state.canonical-mutator
    revision: 2
    title: Mutate project state only through the daemon
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Change state.json, the layered config, registry, event and audit stores and telemetry database only through the daemon, reached by the eawf entity verbs; a locked direct write is only for when no daemon runs. Reading needs no daemon.
    rationale: >-
      One writer serialises every mutation, so two sessions cannot interleave partial writes or silently drop each other's changes.
    verification:
      method: review
  - rule_id: eawf.core.state.state-over-specs
    obligation_id: state.state-vs-specs
    revision: 1
    title: Treat state as reality and specs as intent
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      When a spec and state.json disagree, drive the state mutation through its command and let the spec follow; never hand-edit state.json to match a spec.
    rationale: >-
      Specs describe what was intended while state records what happened; editing state to agree with a spec erases the evidence that the two diverged.
    verification:
      method: review
  - rule_id: eawf.core.state.scope-revisability
    obligation_id: state.scope-revisability
    revision: 1
    title: Change scope only as far as its status allows
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Edit PLANNED scope freely; under an ACTIVE phase only append waves or edit PENDING ones; change CLOSED scope only after reopening it.
    rationale: >-
      Work already claimed or closed carries evidence and commits, so rewriting it would detach that evidence from the plan it answered.
    verification:
      method: review
    procedure_ref: docs/rules/planned-scope-revisability.md
  - rule_id: eawf.core.state.memory-hygiene
    obligation_id: state.memory-hygiene
    revision: 1
    title: Remember durable facts and query status
    zone: steering
    force: should
    effectiveness: behavioral
    instruction: >-
      Store in memory only facts that stay true across sessions, and query current status with eawf status or eawf memory digest instead of memorising it.
    rationale: >-
      Status changes every time a wave closes, so a remembered copy is stale the moment the real state moves.
    verification:
      method: review
    procedure_ref: docs/rules/memory-hygiene.md
