schema_version: 1
module_id: eawf.craft.python
version: 1
kind: catalog
topic: python
title: Python source style
when_to_use: writing or reviewing Python source, including tests and tooling scripts
rules:
  - rule_id: eawf.craft.python.f-strings
    obligation_id: craft.python.string-interpolation
    revision: 1
    title: Interpolate strings with f-strings only
    zone: steering
    force: must
    effectiveness: behavioral
    instruction: Build every interpolated string, log messages included, with an f-string; never with %-style formatting or str.format.
    rationale: One interpolation style keeps logging and message code uniform and removes a whole class of argument-order mistakes.
    scope:
      activities: [implement, review]
    verification:
      method: review
  - rule_id: eawf.craft.python.future-annotations
    obligation_id: craft.python.future-annotations
    revision: 1
    title: Open every module with postponed annotations
    zone: steering
    force: must
    effectiveness: behavioral
    instruction: Start every Python module with "from __future__ import annotations" and give every function full type hints.
    rationale: Postponed evaluation keeps forward references and import cycles out of annotations, and full hints let the type checker see every call.
    scope:
      activities: [implement, review]
    verification:
      method: review
  - rule_id: eawf.craft.python.module-logger
    obligation_id: craft.python.module-logger
    revision: 1
    title: Acquire one logger per library module
    zone: retrievable
    force: should
    effectiveness: behavioral
    instruction: In a library module, acquire the logger once at module scope as logger = logging.getLogger(__name__) and log through it.
    rationale: A module-named logger lets an operator filter and tune output per package without touching code.
    scope:
      activities: [implement, review]
    verification:
      method: review
  - rule_id: eawf.craft.python.project-runner
    obligation_id: craft.python.project-runner
    revision: 1
    title: Invoke Python through the project runner
    zone: steering
    force: must
    effectiveness: behavioral
    instruction: Invoke every Python command through "uv run", never through a bare interpreter or a path into the virtual environment.
    rationale: The project runner pins the interpreter and the locked dependency set, so every machine runs the same code.
    scope:
      activities: [implement, review, test]
    verification:
      method: review
  - rule_id: eawf.craft.python.dependency-check
    obligation_id: craft.python.dependency-addition
    revision: 1
    title: Check the dependency tree before adding a runtime dependency
    zone: steering
    force: must
    effectiveness: behavioral
    instruction: Before adding a runtime dependency, confirm it is not already pulled in transitively and name the reason it is needed.
    rationale: Every runtime dependency widens the install surface and the supply chain for every user.
    scope:
      activities: [implement, review]
    verification:
      method: review
