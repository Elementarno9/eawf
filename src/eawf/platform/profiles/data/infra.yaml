name: infra
version: "1.0"
description: "Infrastructure / platform profile: declarative, reviewable changes."

state_extensions:
  fields_required: []

instrument_requirements: []

render_blocks:
  - id: infra-change-discipline
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ## Infrastructure engineering (infra profile)

      - Infrastructure is declarative and committed: changes land as
        version-controlled config, never as an out-of-band console edit, so the
        live state is reconstructible from the repo.
      - Every change is previewed (plan / diff) and reviewed before apply; the
        plan output is attached to the change so a reviewer sees what will
        mutate.
      - Secrets stay out of version control — config references a secret store
        or environment, never an inline credential.

skills_referenced: []
hooks_referenced: []

# Per-kind Track defaults: the infra profile's sole declared kind is its
# default, so a ``track add`` under an infra project picks ``service`` when the
# operator names no explicit kind.
track:
  kinds:
    service:
      noun: service
      status_lifecycle:
        - design
        - provisioned
        - live
        - retired
      outcome_template: ""
      overview_view: leaderboard

verify:
  argv_allowlist:
    - git
  floor_checks:
    - name: diff-check
      cmd: ["git", "diff", "--check"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
      timeout_class: quick
  waiver_mode: B
