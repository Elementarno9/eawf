name: python
version: "1.0"
description: "Python codebase profile: type hints, ruff, mypy, uv."

state_extensions:
  fields_required: []

instrument_requirements:
  - name: python
    kind: hard
    probe: version
    version_args: ["--version"]
    version_regex: "^Python\\s+\\d"
  - name: uv
    kind: hard
    probe: version
    version_args: ["--version"]
    version_regex: "^uv\\s+\\d"
  - name: ruff
    kind: soft
    probe: version
    version_args: ["--version"]
    version_regex: "^ruff\\s+\\d"
  - name: mypy
    kind: soft
    probe: version
    version_args: ["--version"]
    version_regex: "^mypy\\s+\\d"

render_blocks:
  - id: python-style
    target: AGENTS.md
    version: "1.1"
    body_template: |
      ## Python style (python profile)

      - f-strings only; no ``%``-style or ``.format()``.
      - Full type hints; ``from __future__ import annotations`` at the top of every module.
      - Library modules use ``logger = logging.getLogger(__name__)``.
      - ``uv run`` for all Python invocations — never ``.venv/bin/python`` or bare ``python``.
      - Pre-commit before commit (``uv run pre-commit run --all-files``).
      - Before adding a runtime dependency, verify it's not already pulled in transitively.

  - id: test-discipline
    target: AGENTS.md
    version: "1.1"
    body_template: |
      ## Test discipline (python profile)

      - ``pytest.approx`` for any float comparison.
      - ``numpy.testing.assert_allclose`` for arrays (when numpy is in use).
      - Public functions MUST have boundary-case AND error-path tests. Boundary: empty, single, off-by-one, max-length. Error: invalid type (``TypeError``), out-of-range (``ValueError``), missing key (``KeyError``), schema mismatch (``ValidationError``).
      - Test names: ``test_<func>_<scenario>`` — no ``test_compute_iv_solver_1``.
      - ``pytest.raises`` for error paths; assert message substring when the message is part of the API contract.
      - Full-suite runs go through ``just test`` (parallel, mirrors CI); targeted runs use ``uv run pytest <path>::<test>`` (single-process, fastest for one test).

skills_referenced: []
hooks_referenced: []

# Verify spine floor pack. Each check runs through the W15-hardened gate
# runner via :func:`eawf.workflow.verify.compile.compile_floor_pack`; argv
# heads resolve against the kernel-spec default allowlist + this profile's
# ``argv_allowlist``.
#
# ``scope: touched`` is honored at close time: the readiness compute narrows
# each floor invocation to the closing wave's ``file_scopes`` (pytest -> test
# targets, pre-commit -> ``--files``, mypy -> scoped module list), so a
# module-scoped close never runs the whole tree. ``policy: warn`` keeps these
# non-blocking -- a floor row gates the close only when ``policy: block``
# (flip the single ``policy`` lever to gate). The whole-tree gauntlet lives at
# iter close, not per wave.
verify:
  argv_allowlist:
    - uv
    - run
    - pre-commit
    - mypy
    - pytest
  floor_checks:
    - name: pre-commit
      cmd: ["uv", "run", "pre-commit", "run", "--all-files"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
    - name: mypy
      cmd: ["uv", "run", "mypy", "src/"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
    - name: pytest
      cmd: ["uv", "run", "pytest", "-q"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
  waiver_mode: B
