name: core
version: "1.0"
description: "Core eawf workflow profile (always enabled)."

state_extensions:
  fields_required: []

instrument_requirements:
  - name: git
    kind: hard
    probe: version
    version_args: ["--version"]
    version_regex: "^git version"
  - name: uv
    kind: hard
    probe: version
    version_args: ["--version"]
    version_regex: "^uv\\s+\\d"

render_blocks:
  - id: project-orientation
    target: AGENTS.md
    tier: tier0
    version: "1.1"
    body_template: |
      ## What this repo runs on

      This repo is managed by eawf, an agent-driven workflow. Work nests as **Track** (a standing line of work) > **Milestone** (one delivery, one pull request, one release) > **Delivery Batch** (Tasks that land and are verified together) > **Task** (one agent's unit of work), and each Task executes in one **Run** (one lease, one workspace). A plan changes only through a **PlanRevision** that is submitted, approved and applied.

      Reality lives in ``.ea/state.json``, not here: this file carries the rules, ``eawf status`` carries the current position.

  - id: non-negotiable-rules
    target: AGENTS.md
    tier: tier0
    version: "1.14"
    body_template: |
      ## Non-negotiable rules (core)

      The rules below apply to every eawf-managed project. Each rule with a non-trivial body has an expansion block immediately following.

      1. **CLI is dispatch; library implements.** See ``architecture-cli-dispatch``.
      2. **Strict config validation.** Every YAML/JSON ingestion path uses Pydantic v2 ``BaseModel`` with ``ConfigDict(extra="forbid")``. Validation lives in the loader; downstream functions accept already-validated typed objects only.
      3. **`.ea/` is committed.** See ``ea-directory-commit-policy``.
      4. **Daemon is the sole canonical mutator** for ``state.json``, layered config YAML, registry JSON, event/audit stores, and telemetry DB (Decision D-SUP-01; per-file authority map at ``.ea/artifacts/research/long-term/2026-05-18-authority-map.md``). Reads are free. The eawf entity verbs (``eawf task ...``, ``eawf batch ...``) are the operator-facing surface: they send mutations to the daemon over JSON-RPC, with a fallback to direct ``portalocker`` writes only when the daemon is unavailable (CI, one-shot, recovery shell).
      5. **Symbol conventions.** See ``symbol-conventions``.
      6. **Deletion rule.** See ``deletion-rule``.
      7. **State is in `state.json`, not in specs.** See ``state-vs-specs``.
      8. **Verify before claiming.** See ``verify-before-claim``.
      9. **f-strings only.** No ``%``-style or ``.format()``. See the python profile for the library-module logging form.
      10. **`uv run` for all Python invocations.** See the python profile for details.
      11. **Worktree discipline.** See ``worktree-discipline``.
      12. **Branch currency.** See ``branch-currency``.
      13. **Pre-commit before commit.** ``uv run pre-commit run --all-files`` before every ``git commit``. Hook failures are root-caused, never ``--no-verify``'d.
      14. **Commit prefix.** See ``commit-prefix``.
      15. **Branch naming.** See ``branch-naming``.
      16. **Secrets and PII hygiene.** See ``secrets-hygiene``.
      17. **Naming conventions for fields/params/log keys.** See ``naming-conventions``.
      18. **Artifact chassis and citations.** See ``artifact-chassis``.
      19. **Typed agent reports.** See ``agent-report-contract``.
      20. **Planned-scope revisability.** See ``planned-scope-revisability``.
      21. **Plan revision procedure.** See ``roadmap-procedure``.
      22. **Spike workflow.** See ``spike-workflow``.
      23. **Engineering principles (DRY/KISS/YAGNI).** See ``engineering-principles``.
      24. **Other engineering practice.** See ``engineering-practice``.
      25. **Source code stays clean of design-decision references.** No inline ``# per Q<N>``, ``# per audit XB##``, ``# per Codex``, or roundtable / operator-decision-id comments in committed source files. Decision provenance lives in the commit body and the typed Decision URN in ``state.json``; source comments are reserved for WHY-the-code-does-X explanations that aid future readers irrespective of provenance. Enforced by the ``eawf012`` lint.
      26. **Plan approval always renders the plan in plan mode.** See ``prep-plan-mode``.
      27. **Milestone acceptance timing.** See ``milestone-close-timing``.
      28. **Rendered markdown is not manually line-wrapped.** See ``markdown-no-manual-wrap``.
      29. **Release process.** See ``release-process``.
      30. **Ship process.** See ``ship-process``.
      31. **Comment economy.** See ``comment-economy``.
      32. **Decisions are surfaced, not assumed.** See ``orchestrator-decision-surface``.
      33. **A new gate proves itself and sunsets.** See ``gate-fire-proof-sunset``.
      34. **One commit per Batch and one state commit per push.** See ``commit-granularity``.

  - id: architecture-cli-dispatch
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### Architecture: CLI is dispatch; library implements

      The CLI layer parses arguments and formats output. All domain logic lives in the library. CLI handlers must accept typed config / state objects, never raw ``dict``.

  - id: ea-directory-commit-policy
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### `.ea/` directory: commit policy

      ``.ea/state.json``, ``.ea/profile.yaml`` and each generation's ``state.json`` and ledgers are committed to version control — they are the source of truth for what was released, delivered and decided. Task definitions are committed too. In-flight Task status and Run rows (each generation's ``local/`` projection), ``.ea/locks/`` and ``.ea/local/`` are gitignored.

  - id: symbol-conventions
    target: AGENTS.md
    version: "1.2"
    body_template: |
      ### Symbol conventions

      Project codes follow ``^[A-Z][A-Z0-9_-]{1,15}$``. Task keys: ``<PROJECT>-<NNNN>`` (e.g., ``EAWF-0042``). Milestone, Batch and PlanRevision keys: ``MLS-<NNNN>``, ``BAT-<NNNN>`` and ``PRV-<NNNN>``; Run keys: ``RUN-`` and eight digits; Track keys: ``TRK-<SYMBOL>``. Hypothesis IDs: ``H<NN>-<NN>`` (e.g., ``H03-12``). The zero-padded width is part of each key's grammar, so ``RUN-0001`` is refused.

  - id: naming-conventions
    target: AGENTS.md
    version: "1.7"
    placement: reference
    summary: "Every cross-cutting concept has exactly one canonical name; rename an outlier to match the dominant form before merging instead of adding an adapter shim."
    body_template: |
      ### Naming conventions

      To prevent drift across state models, envelopes, parameters, and log keys, every cross-cutting concept has exactly one canonical name. Outliers MUST be renamed to match the dominant form before merging, not papered over with adapter shims.

      **Agent role identifier** — ``agent_role`` (never ``role`` alone on a run-contract field). Applies to the compiled run contract and its capsule (:mod:`eawf.kernel.runtime.compiled`, :mod:`eawf.kernel.runtime.capsule`), ``RoleSpec.role`` (the inner enum keeps the bare name because ``RoleSpec`` already namespaces it), and dispatch envelopes. The bare ``role`` remains valid inside ``RoleSpec`` because the surrounding type disambiguates.

      **Effort bucket parameter** — ``effort_bucket`` (never ``size`` or ``effort_size``). Applies to planner output, telemetry rollups, and EU-projection tables. Allowed values are the closed StrEnum ``XS|S|M|L|XL``.

      **Evidence kind identifier** — ``evidence_kind`` (never ``kind`` alone on an EvidenceRecord field, and never ``evidence_type``). Applies to :attr:`~eawf.kernel.store.kinds.evidence.EvidenceRecord.evidence_kind`, JSON keys, CLI flags (``--evidence-kind``), and gate-pack lookups. Bare ``kind`` remains valid on store envelopes where ``StoreKind`` already disambiguates.

      **State scope identifier** — ``scope_id`` (never bare ``scope``). Applies to Pydantic field names on ``State`` models (e.g. ``PluginInstall``), :class:`~eawf.surfaces.render.envelope.EnvelopeHeader`, function kwargs (e.g. ``add_artifact(scope_id=...)``, ``artifact_urn(scope_id, ...)``), JSON keys on the wire, and ``state.json`` field names. Bare ``scope`` is reserved for CLI argument names (``--scope``) and skill-context attributes (``SkillContext.scope``) where the caller maps onto the URN.

      **Output directory parameter** — ``output_dir`` (never ``out_dir`` or ``target_dir``). Applies to schema dumpers, plugin installers, and any helper that takes a write destination directory.

      **Task / Batch / Milestone keys in logs and dict payloads** — ``task=<key>``, ``batch=<key>``, ``milestone=<key>``. Bare keys only, never ``task_id=<key>`` in log lines (the trailing ``_id`` is reserved for typed-model field names where the type system benefits from explicit suffix). Inside structured envelopes (``EventPayload``, ``state.json``) keep the ``_id`` suffix so the schema is unambiguous.

      **Log format inside library modules** — ``<funcname> key=value key=value`` form, space-separated, no leading ``:`` after the function name. f-strings only (project-wide rule 9). Example: ``logger.info(f"close_landed_batch closed batch={batch.key} head={head}")``.

      **Error message phrasing** — lowercase leading word, no trailing period, no class-name prefix. Use ``!r`` when interpolating user input so quoting is visible. Example: ``raise ValueError(f"unknown task: {task_key!r}")``.

      **Docstring ``Raises:`` block** — Google-style ``Raises:`` block with one ``ExceptionType: explanation`` line per case. Do NOT use inline prose like ``Raises ValueError if ...`` in the summary; reserve the ``Raises:`` block for that.

      **Mutator-path precision in Task success criteria** — when a Task's success criterion text references a "save through" or "persist via" path, name the **canonical writer** (the daemon, per rule 4) rather than the generic phrase ``state-CLI``. The authority map ``.ea/artifacts/research/long-term/2026-05-18-authority-map.md`` names the canonical writer per file. Conflating the operator-facing surface (the eawf entity verbs) with the daemon-internal subsystem in criterion prose makes audits flag false positives.

  - id: entity-title-naming
    target: AGENTS.md
    version: "1.2"
    placement: reference
    summary: "Write every entity title as an imperative noun-phrase of at most 72 characters with no trailing period, and put the long-form purpose in the description."
    rationale: |
      **Entity-title naming.** Every lifecycle and research entity (``Track`` / ``Milestone`` / ``Batch`` / ``Task`` / ``Decision`` / ``Hypothesis`` / ``Incident``) carries a bounded ``title`` and an optional long-form ``description``. The bound exists so titles stay scannable in dense renders — the roadmap tree, plan-view table, and dispatch header all lay titles out in a single fixed-width row, and an unbounded sentence either truncates with an ellipsis (losing the tail) or wraps and breaks the column. A trailing period reads as the end of a sentence, but a title is a label, not prose; the period is visual noise that the description, which IS prose, should carry instead.
    mechanism: |
      Write ``title`` as an imperative noun-phrase of at most 72 characters with no trailing period — e.g. ``Add bounded title to entities`` or ``Enforce sandbox deny-list at dispatch``, never ``Adds a bounded title to every entity.`` (over-cap once the clause grows, and the period is sentence noise). Put the why / the long-form purpose in ``description`` (bounded at 500 characters); the renderers surface it as a detail block under the bounded title, so the two fields split the label from the explanation rather than competing for one line.
    verification: |
      The model enforces the hard bound: ``title`` is ``Annotated[str, Field(min_length=1, max_length=72)]`` on every entity, so an over-72 title fails :class:`pydantic.ValidationError` at the ingestion boundary. The style backstop is :func:`eawf.surfaces.render.agents_md.lint_entity_title`, which a reviewer (or a future authoring command) runs over a candidate title to flag an over-cap or a trailing-period title before it reaches the model — the same two failure modes the bound and this rule describe.

  - id: deletion-rule
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### Deletion rule

      Agents MAY delete code, configs, or docs IF AND ONLY IF:

      (a) the content has been committed at least once on the current branch's ancestry (recoverable via ``git log -- <path>``); AND

      (b) the deletion is motivated by an explicit verdict (rejected hypothesis, superseded design, deprecated module) recorded in ``state.json``; AND

      (c) the deletion is enumerated in the commit body or PR description (``Removed: <path1> (reason); ...``) so the reviewer can object before merge.

      Agents MUST NOT delete: schema files, golden fixtures, MIT ``LICENSE``, ``CHANGELOG.md``, or any uncommitted file. When in doubt, propose the list and wait for explicit confirmation.

  - id: state-vs-specs
    target: AGENTS.md
    tier: tier0
    version: "1.2"
    body_template: |
      ### State vs specs

      Specs describe intent; state reflects reality. The canonical writer of ``state.json`` is the daemon — see rule 4 for the full mutator-authority statement (operator-facing state CLI, JSON-RPC proxy, portalocker fallback). Do not hand-edit ``state.json`` to make it agree with a spec; drive the state mutation and let the spec follow.

  - id: verify-before-claim
    target: AGENTS.md
    version: "1.4"
    body_template: |
      ### Verify before claiming

      Quantitative or behavioural claims about command I/O, schema fields, exit codes, or rendering output MUST be verified against the actual code path before assertion. The verification ladder, in order:

      (a) Resolve the symbol with the symbol tools (``mcp__serena__find_symbol``, ``mcp__serena__find_referencing_symbols``, ``mcp__serena__get_symbols_overview``) — they resolve bindings, so they answer "where is X defined" and "who calls X" without the false hits and missed aliases text search returns.
      (b) Read the source file.
      (c) ``grep`` for actual call sites in the active branch — the fallback when the target is a string, a config value, or a name you do not yet know.
      (d) Inspect golden fixtures or snapshot tests.
      (e) Only then quote the behaviour.

      Design-intent docs (command matrix, schema inventory, ADRs) are the *design intent*; the source tree is the *implementation* — when they drift, quote the implementation. Treat doc/memory citations as a hypothesis to verify, not as ground truth.

      Task commit SHA: a Task's work is the commit carrying its ``Task: <KEY>`` trailer, found with ``git log --grep 'Task: <KEY>'`` so a cherry-picked or squashed commit still resolves, and a landed Batch pins the branch head its Tasks completed on. Quote those, not a remembered SHA.

  - id: worktree-discipline
    target: AGENTS.md
    tier: tier0
    version: "1.3"
    body_template: |
      ### Worktree discipline

      Task worktrees MUST branch from the current Milestone branch HEAD, not ``main``. Their commits are **cherry-picked** into the Milestone branch — never ``git merge``.

      Cherry-pick procedure: ``git -C <main-worktree> cherry-pick <worktree-sha>`` per commit, in order. Resolve conflicts in the parent worktree. Worktree teardown only after cherry-pick lands.

      Concurrency: which Tasks run side by side is derived from the Batch's Task dependency graph and write claims, never typed at dispatch. A Task is dispatched only once each Task it depends on carries the proof it requires, and two Tasks whose write claims overlap never run at once. One Task, one Run, one lease, one workspace.

  - id: branch-currency
    target: AGENTS.md
    version: "1.1"
    body_template: |
      ### Branch currency

      Before opening or resuming a Milestone, Batch, or Task, verify the current branch is based on the intended source branch (normally the repo default branch or the configured Milestone base). Fetch first, inspect divergence, and rebase or fast-forward the long-running feature branch when it is stale.

      If the working tree is dirty, preserve the dirty/untracked work before rebasing. If the branch intentionally remains behind or forked, record the reason in the plan or handoff before dispatching worktrees or starting new commits.

  - id: commit-prefix
    target: AGENTS.md
    version: "2.4"
    placement: reference
    summary: "A Batch commit is ``<type>: <summary>`` with one ``Batch:`` trailer and a ``Task:`` trailer per Task it delivers; each push ends with one ``state:`` commit."
    body_template: |
      ### Commit prefix

      A commit names the Batch and the Tasks it delivers in body trailers, under decision D87, which superseded D85. Conventional-commit types, in every form below: ``feat``, ``fix``, ``chore``, ``docs``, ``refactor``, ``test``, ``build``, ``perf``, ``ci``, ``revert``, ``state``.

      - **Batch commit** — ``<type>: <summary>`` with no bracket prefix, exactly one ``Batch: BAT-<NNNN>`` trailer and one ``Task: <KEY>`` trailer for every Task it delivers, each a Task of that Batch. A commit delivering a single Task may carry its ``Task:`` trailer alone. The pre-push ``commit-prefix-lint`` hook refuses a pushed commit naming no Task, several Tasks without a ``Batch`` trailer, a Task twice, two ``Batch`` trailers, or a Task of another Batch.
      - **Trailing state commit** — ``state: <summary>``, one per push, touching only committed state paths.

      **Legacy carriers.** History written before the Batch trailer names its scope through an older body trailer or a bracketed subject prefix; the ``vcs.conventions.subject_style`` config leaf selects which one ``tools/commit_prefix_lint.py`` expects, and it defaults to ``trailer``. The lint still reads those forms so old history keeps passing, warns on the deprecated bracket prefix, and rejects the retired ``-CORE`` suffix. Write neither in a new commit: every new commit carries the native trailers above.

      Body: a few lines on why. Trailers: the ``Task`` trailer, an optional ``Batch`` trailer, and a recognized Claude or Codex ``Co-Authored-By`` trailer.

  - id: branch-naming
    target: AGENTS.md
    version: "1.1"
    body_template: |
      ### Branch naming

      Long-running Milestone branch: ``feature/<symbol>-v<X.Y>``. Per-Task worktree branches: ``feature/<symbol>-v<X.Y>-<task-key>``, the Task key in lower case — cherry-picked back into the long-running branch then deleted.

      PRs: one per Milestone (typical) — a Milestone always ends with a PR.

  - id: secrets-hygiene
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### Secrets and PII hygiene

      Never commit local paths, machine-specific identifiers, or sensitive info. Do **not** stage commits, code, docs, or config containing: machine-specific paths (``/Users/<name>/...``, ``~/Workspace/...``, ``C:\Users\...``), hostnames, IPs, employer / customer names, credentials, API keys, tokens, SSH keys, ``.env`` contents, internal URLs, real email addresses other than a canonical author block, or PII.

      Companion-doc references in rendered docs / commit messages / PR bodies / docstrings MUST stay repo-relative or generic ("external companion docs", ``docs/...``).

      Forward-fix only — once a leak lands in a published commit, history rewrite is the *last* resort because the blast radius (force-push, SHA churn, broken PR refs) is much larger than the prevention cost. Scrub locally before ``git add``; let ``pre-commit`` (``detect-secrets`` + custom path checks) catch the rest.

  - id: artifact-chassis
    target: AGENTS.md
    version: "1.4"
    placement: reference
    summary: "Markdown promoted out of ``.ea/local/`` uses the renderer-owned Summary / References / Provenance / Scrub chassis, with typed citations and no absolute paths."
    body_template: |
      ### Artifact chassis and citations

      Artifacts stay in ``.ea/local/`` unless promoted, and a local artifact is cited from state by its sha256 digest. The chassis applies only to promoted artifacts: research, plan, audit, decision, hypothesis, and incident markdown promoted to ``.ea/artifacts/`` uses renderer-owned chassis sections: ``Summary``, ``References``, ``Provenance``, and ``Scrub``. Local drafts under ``.ea/local/`` carry an ``eawf-template`` sentinel; promoted artifacts do not.

      Citations use dense ``[N]`` markers backed by typed ``Citation`` rows. References stay repo-relative, external URL, or Eawf URN. Absolute local paths, host-local URLs, and PII must fail validation before promotion or PR text ships.

      **IntentBrief.** ``/research`` outputs a typed :class:`~eawf.kernel.spec.intent.IntentBrief` whose claims carry ``evidence_refs``; a brief is promotable iff every claim has at least one resolving + entailing reference (the ``evidence_refs`` invariant).

  - id: planned-scope-revisability
    target: AGENTS.md
    version: "1.3"
    placement: reference
    summary: "Scope mutability is status-tiered: a PLANNED Milestone is freely re-planned, an ACTIVE Milestone only takes appended Batches and Tasks, and started or completed work is never rewritten."
    body_template: |
      ### Planned-scope revisability

      Milestones, Delivery Batches and Tasks are first-class state records; a Milestone moves through ``PLANNED -> ACTIVE -> ACCEPTANCE_REVIEW -> COMPLETED`` (or ``CANCELLED``). A plan changes only through a PlanRevision that is submitted, approved and applied, and mutability is status-tiered:

      - **PLANNED** scope is freely mutable. A child of an applied PlanRevision re-plans the PLANNED Milestone its parent created, rewriting only Batches and Tasks that are still PLANNED; what the child drops is cancelled, not deleted, so the history of the dropped work survives.
      - **ACTIVE** scope is append-only. A re-plan of an ACTIVE Milestone may add new Batches and Tasks, and Batch refs after the required ones, but leaves every existing row exactly as it is, because work on it may be underway; the plan apply refuses any other change.
      - **Started and completed** work is never rewritten by a plan: a correction to it is delivered as new scope.

      A rejected PlanRevision is repaired by a child revision carrying a disposition for each finding, never by editing the rejected one.

  - id: roadmap-procedure
    target: AGENTS.md
    version: "2.0"
    body_template: |
      ### Plan revision procedure

      The canonical flow for changing a Milestone's plan (one PlanRevision at a time):

      ::

        1. /research <topic>                    # one-page brief under .ea/local/
        2. /plan propose <milestone-ref>        # eawf plan submit: VALIDATED,
                                                # or rejected with findings
        3. /plan propose <milestone-ref> --feedback <ref>
                                                # child revision until the
                                                # Batch and Task graph fits
        4. /plan approve <revision-ref>         # operator only
        5. /plan apply <revision-ref>           # operator only: materialise
                                                # Batches and Tasks
        6. eawf milestone activate <urn>        # PLANNED -> ACTIVE
        7. /dispatch <batch-ref>                # each ready Task in its own Run

      Approval and apply are separate operator acts. An agent that reaches one files it with ``eawf question open-decision`` and stops; it never chooses the recommended option itself.

  - id: spike-workflow
    target: AGENTS.md
    version: "1.6"
    placement: reference
    summary: "A spike is a time-boxed read-only investigation; its text brief stays local under ``.ea/local/research/``, cited by sha256 digest, and heavy artefacts go under ``local.scratch_root``."
    body_template: |
      ### Spike workflow

      A *spike* is a short, time-boxed, read-only investigation run before a Task is planned — used when the next move is unclear and the operator needs a brief or experimental verdict to write the Task's success criteria. ``/research`` answers one question with a one-page brief, and ``/spike`` builds and independently verifies a local proof of concept; both follow the brief-naming conventions below.

      **When to spike.** Reach for a spike when (a) a Task's success criteria cannot yet be written without first reading code or running a probe, (b) two or more design alternatives need a verdict before ``/plan propose`` can commit to a Batch and Task graph, or (c) an audit hypothesis needs an evidence sweep before ``set-verdict``. Skip the spike when the next move is obvious — go straight to ``/plan propose`` or ``/dispatch``.

      **Where the output lives.** A brief is ``.ea/local/research/<YYYY-MM-DD>-<slug>.md``, so it sorts by date and slug-matches the Task or Milestone it informs. ``.ea/local/research/`` holds only text evidence: briefs, notes, logs and small outputs. Heavy artefacts (virtual environments, models, installs, archives) go outside the repository under the scratch root the ``local.scratch_root`` config leaf names, each in its own directory with a ``.retention`` file holding its expiry date as ``YYYY-MM-DD``. A directory under ``.ea/local/`` may carry a ``.retention`` too: ``eawf local gc`` removes each one whose date has passed (``--dry-run`` lists them first), and ``eawf doctor`` warns once ``.ea/local/`` grows past ``local.size_warn_mb``.

      **How the verdict feeds the workflow.** The spike's verdict is the input to the next ``/plan propose``. Reference the brief by repo-relative path in the PlanRevision, the Task's contract, or the dispatch prompt, so the subagent reads it before starting work.

      **No promotion by default.** Briefs stay local (``.ea/local/`` is gitignored), and a Decision they inform cites them by sha256 digest. Promotion to ``.ea/artifacts/research/`` is an explicit operator request, and it runs the artifact-chassis validator and scrub gate.

  - id: engineering-principles
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Reach for the simplest design that solves the immediate need: no helper, parameter, or config knob without a present-day caller, and no handling for states that cannot happen."
    rationale: |
      **Engineering principles (DRY/KISS/YAGNI).** Speculative flexibility is the dominant source of accidental complexity: an abstraction added for a caller that never arrives costs reading effort on every later edit while paying back nothing. DRY (don't repeat yourself) keeps one canonical home per behaviour; KISS (keep it simple, stupid) keeps the design no larger than the immediate need; YAGNI (you aren't gonna need it) defers anything the current change does not require.
    mechanism: |
      Reach for the simplest design that solves the immediate need. Three similar lines are better than a half-fitted helper — do not extract until a third caller actually appears. Do not add error handling, fallbacks, or validation for scenarios that cannot happen on the real call paths.
    verification: |
      A reviewer checks that each new helper, parameter, or config knob has a present-day caller; a helper introduced for one or two call sites, or for a use site that does not yet exist, is rejected. Defensive branches for impossible states are removed before merge.

  - id: engineering-practice
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Default to fail-fast at the boundary, one reason to change per unit, parsing separate from validation separate from execution, and explicit over implicit."
    rationale: |
      **Other engineering practice.** Code that fails far from its cause, mixes concerns, or signals success with ``None`` is expensive to debug and easy to break: the stack trace points at a symptom, a change to one concern risks the others, and the happy path reads ambiguously. Failing fast, separating concerns, and being explicit keep behaviour where the name and the call site say it is.
    mechanism: |
      Default to: fail-fast (raise at the boundary, not deep in a call stack); single-responsibility (each function or class has one reason to change); principle of least surprise (behaviour matches the name); separation of concerns (parsing ≠ validation ≠ execution); pure functions where viable (no hidden state); and explicit-over-implicit (named arguments over positional when arity ≥ 3, explicit returns over ``None``-as-success).
    verification: |
      A reviewer reads each public function's first statements (validation precedes side effects) and each call site of arity ≥ 3 (arguments passed by keyword). A function whose name implies a value but returns ``None`` on the happy path is reworked; ``uv run mypy src/`` backs the explicit-return contract via full type hints.

  - id: prep-plan-mode
    target: AGENTS.md
    tier: tier0
    version: "2.0"
    body_template: |
      ### Plan approval always renders the plan in plan mode

      Before a PlanRevision is approved, the agent MUST enter Claude Code plan mode (``EnterPlanMode``) with the rendered Batch and Task graph of that revision — its Batches, Tasks, dependencies and criteria, read with ``eawf plan show`` — before surfacing the approve / revise / cancel choice. File that choice with ``eawf question open-decision`` so it is a pending action with typed options, then show the bound question the answer carries: ``AskUserQuestion`` in Claude Code, the answer's numbered prompt printed verbatim in Codex. The operator answers by option, in the session or in the console, and the first answer wins; a free-text approval is not consent.

      - **approve** — the operator seals the approval with ``eawf plan approve``, then ``eawf plan apply`` materialises its Batches and Tasks into the Milestone.
      - **revise** — the planner proposes a child revision (``/plan propose --feedback``), and its rendered graph is shown again before the next approval.
      - **cancel** — nothing is approved or applied.

      The plan-mode-first invariant applies to every revision, an append to an ACTIVE Milestone included: the operator-facing surface is always the rendered graph, not raw mutator commands.

  - id: milestone-close-timing
    target: AGENTS.md
    tier: tier0
    version: "2.0"
    body_template: |
      ### Milestone acceptance timing

      Milestone acceptance is gated on **verification + ship CI + PR review pass**. Do not open a Milestone's acceptance the moment its Batches land — run ``/verify`` in audit and review modes first, then pass the Milestone pull request's CI and review, addressing feedback by appending Batches or Tasks to the same Milestone, then accept it with ``/accept``.

      **Append, don't open a second Milestone.** When verification or review surfaces follow-up work that fits the same delivery, append it to the active Milestone through a PlanRevision: an ACTIVE Milestone takes appended Batches and Tasks and stays ACTIVE. Opening another Milestone is reserved for true scope expansions, not for routine follow-ups.

      **Acceptance goes in the latest state commit before merge.** Do not accept the Milestone until ship CI is green AND the review-passed branch is on the remote. The acceptance rides the push's single trailing ``state:`` commit; merging that commit ends the Milestone, and a pre-merge acceptance keeps state in sync with what reviewers approved.

  - id: markdown-no-manual-wrap
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### Rendered markdown is not manually line-wrapped

      Rendered and authored markdown — PR bodies, issue/review comments, audit / research / decision artifacts, READMEs, mkdocs pages, and skill output envelopes — is written one line per paragraph. Do NOT hard-wrap prose at ~72 (or any) columns; let the renderer / viewer soft-wrap. Manual wrapping fights diffs (a one-word edit reflows a whole block), breaks tables and list continuations, and corrupts copy-paste.

      The ~72-column wrap convention is reserved for **commit messages** (subject + body), where tooling and ``git log`` assume it. Fenced code blocks keep their own formatting. Skill output contracts inherit this rule: a skill that emits markdown emits unwrapped paragraphs.

  - id: release-process
    target: AGENTS.md
    version: "2.1"
    placement: reference
    summary: "A release-train repo tags a merged Milestone only after ``eawf release preflight`` passes, via ``eawf release pipeline --milestone``; other repos keep their own tag flow."
    body_template: |
      ### Release process

      Releases run through the explicit release verbs: no Milestone acceptance waits on a release, and no config leaf selects a release cadence.

      In a repo that releases through an eawf release train, ``eawf release preflight <version>`` sweeps every readiness signal over the checkout and reports all of them on every run, so one pass shows the whole repair list. Among them:

      - ``CHANGELOG.md`` has a new section for the release version with at least one bullet.
      - The package version module (``src/<pkg>/_version.py``) advanced from the prior release.
      - A migration note exists when the state ``schema_version`` changed since the last release.
      - The ``provider`` signal finds a passing live dispatch smoke for every claimed os_class. Before cutting a release candidate, run the live dispatch smoke on Linux (bwrap) and on macOS (seatbelt) with ``EAWF_SMOKE_PROVIDER=claude EAWF_SMOKE_EVIDENCE_DIR=<canary evidence directory> uv run pytest -m e2e tests/e2e/test_smoke_milestone.py`` and commit its ``dispatch-smoke-receipts.json``.

      A repo that releases through an eawf release train cuts each release from a merged Milestone with ``eawf release pipeline <version> --milestone <MLS-NNNN> --publish``, run from a clean checkout of the merge commit, which walks the checkpoint from tag to BAKED. It runs the readiness sweep before it tags, its push starts the publish workflows, which mark every dev and release-candidate tag as a prerelease, and it then advances the train and checks that ``main`` carries exactly the commits of each completed Batch of the Milestone, found by their ``Task:`` and ``Batch:`` trailers.

      Every other repo keeps its own tag flow: the tagging it already runs after a merge stays its tagging path.

  - id: ship-process
    target: AGENTS.md
    version: "1.9"
    placement: reference
    summary: "Ship a Milestone through one PR: pass CI, address review by appending Batches, then merge so each Batch commit survives; main and tags are never rewritten."
    body_template: |
      ### Ship process

      Ship is the Milestone's terminal pass, under decision D87, which superseded D85. The ordered steps from landed Batches to a merged, tagged Milestone:

      1. **Open the Milestone PR.** One PR per Milestone, body per the ``pr-template``. The PR head is the long-running feature branch, squashed before each push to one commit per Batch (a few for a large Batch) carrying its ``Batch:`` and ``Task:`` trailers, plus one trailing ``state:`` commit per push. Each Batch already closed when it landed: the daemon bound the Milestone branch head and walked the Batch and its Tasks to COMPLETED.
      2. **Pass CI gates.** Beyond the per-commit lint + test gauntlet, two gates fire only on the Milestone PR and so are easy to miss locally: the per-package **coverage gate** (CI parses ``coverage.xml`` against the ``[tool.eawf.coverage]`` thresholds) and the **snapshot-pairing gate** (``tools/snapshot_pairing_gate.py`` over the PR base..head range, which rejects a managed golden-surface mutation whose commit names no Batch or Task of the generation). Run both locally before pushing the PR so they do not surface late.
      3. **Pass the review.** ``/verify --mode review`` runs the review pass over each Batch. Address feedback by appending Batches to the Milestone, not by opening a second PR.
      4. **Rewrite only under lease.** ``eawf batch squash`` writes the per-Batch history on a new branch and proves its tree equals the source tip's; once the branch points at it, ``eawf batch rebind`` appends a superseding row for every binding that named a source commit. A pushed branch is rewritten only with ``--force-with-lease``, after writing an archive ref of the old head. Ledgers stay append-only: a correction is an appended superseding row.
      5. **Merge.** Once CI is green on the pushed head and review passes, merge so each Batch commit survives: fast-forward ``main`` to the reviewed head, never folding Batches together. main and tags are never rewritten, and old history is not rewritten.
      6. **Release at merge.** The Milestone is release-ready at merge: the release verbs check it before anything is tagged (see ``release-process``), and nothing after the merge is Milestone work. A repo that releases through an eawf release train then runs ``eawf release pipeline <version> --milestone <MLS-NNNN> --publish`` from a clean checkout of the merge commit: one journaled, resumable walk that tags and pushes only with ``--publish``, waits for the publish runs, pins, proves, approves and observes the checkpoint to BAKED, advances the train, checks each completed Batch's commits on ``main`` by their ``Task:`` and ``Batch:`` trailers, and stages the evidence for one ``state:`` commit. A refused step names its reason and a rerun resumes there, so the next Milestone carries no release Tasks; every other repo keeps its own tag flow. Nothing publishes until the tag is pushed.

  - id: agent-report-contract
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### Agent report contract

      Every agent session that reaches a terminal handoff MUST emit a typed ``agent_end`` report body accepted by ``AgentReportBody``. Runtime hooks own ``AgentReportHeader`` fields (session, role, scope, runtime, attempt); agents provide the role-specific body only.

      Reports are append-only. Never overwrite or "fix" an earlier report attempt; retry by appending the next attempt for the same ``(role, base_id)`` pair.

      Verdicts MUST use ``AgentReportVerdict`` exactly: ``pass``, ``pass-with-followups``, ``fail``, or ``blocked``. Report store URNs use the role-specific ``StoreKind`` such as ``executor_report`` or ``reviewer_report``.

  - id: workflow-lifecycle
    target: AGENTS.md
    version: "1.2"
    placement: reference
    summary: "The lifecycle runs research, plan, dispatch Tasks, cherry-pick, ship the Milestone, with a branch-currency check before opening or resuming any scope."
    body_template: |
      ## Workflow lifecycle

      Agent-driven lifecycle:

      ```
      research → plan → dispatch Tasks → cherry-pick → ship Milestone
      ```

      - **Research** is unstructured exploration of the proposal/plan.
      - **Branch currency gate** = fetch and compare the current branch to the intended source branch before opening or resuming a Milestone, Batch, or Task; rebase or fast-forward first when stale.
      - **Plan** = propose a PlanRevision for the Milestone: its Delivery Batches, their Tasks, dependencies and per-Task success criteria; the operator approves and applies it.
      - **Dispatch** = run each ready Task of a Batch in its own Run, one lease and one workspace per Task. Tasks the dependency graph and write claims leave independent run side by side; a dependent Task waits for the proof it needs.
      - **Cherry-pick** = bring worktree commits into the long-running Milestone branch. Never merge.
      - **Ship** = open the Milestone PR, run CI, address review by appending Batches, merge.

  - id: pr-template
    target: AGENTS.md
    version: "1.1"
    body_template: |
      ### PR template

      ``## Summary`` (3-6 bullets) + ``## Test plan`` (markdown checklist). Milestone PRs include a ``## Milestone deliverables`` section linking back to the Milestone's applied PlanRevision.

  - id: clarity-contract
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Every newcomer-facing artifact must be understandable without opening ``state.json``: right audience, jargon glossed on first use, motivation stated, scannable, references tabulated."
    body_template: |
      ### Doc-clarity contract (the newcomer test)

      Every newcomer-facing artifact — commit subject + body, PR body, research / audit / decision brief, and every entity ``title`` / ``description`` — must pass one gate: *would someone who joined today understand this without opening ``state.json``?* The five checks behind that gate:

      - **Audience-fit** — write for a newcomer, not an insider.
      - **Jargon defined on first use** — internal codes are glossed the first time they appear in prose: lifecycle ids (``P<NN>`` / ``I<NN>`` / ``W<NN>``), cluster / decision codes (``C0<N>`` / ``D<NN>`` / ``D-SUP-<NN>``), hypothesis ids (``H<NN>-<NN>``), and screaming-snake flags (``SWITCH_*`` / ``EAWF_*``). Commit-subject type prefixes are EXEMPT — the commit-prefix rule requires them.
      - **Why-present** — say the motivation, not only the what; a ``description`` that merely restates its ``title`` fails.
      - **Scannable** — short paragraphs, headings, lists; no wall of text.
      - **Reference-hygiene** — dense ``[N]`` markers backed by a ``## References`` table; no inline ``path:line`` soup or bare URLs mid-prose.

      The approved-term glossary, the internal-code blocklist, and the six scored dimensions are the typed source the prose lints read: :mod:`eawf.platform.profiles.clarity`.

  - id: agent-tool-discipline
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ### Agent tool discipline

      - Subagents do **not** see the parent conversation. Dispatch prompts must be self-contained — paths, line numbers, success criteria. "Based on your findings, fix the bug" pushes synthesis onto the agent; that work belongs in the parent.
      - Do not use ``Read`` to verify a file you just wrote with ``Write``/``Edit``: the edit tool errors on conflict, the harness tracks file state, and re-reads waste tokens.
      - Prefer dedicated tools over ``Bash`` when one fits (``Read``, ``Edit``, ``Write``); reserve ``Bash`` for shell-only operations.

  - id: memory-hygiene
    target: AGENTS.md
    version: "1.2"
    placement: reference
    summary: "Remember only facts that stay true across sessions; status is derivable, so query it with ``eawf status`` or ``eawf memory digest`` instead of memorizing it."
    body_template: |
      ### Memory hygiene: remember durable facts, query status

      Curated memory holds **durable facts** — decisions that outlive a session, operator preferences, hard-won gotchas, conventions. It is the wrong place for **status**, which changes every time a Task completes: the active Milestone and Batch, what just landed, the latest verdicts, the open backlog. Memorizing status guarantees drift, because the remembered copy goes stale the moment the real state moves.

      The rule: a fact is worth remembering only when it stays true across sessions. Status is **derivable** from state, so it is queried on demand, never memorized. Run ``eawf status`` for the current pointers, recent decisions, and open backlog, and ``eawf memory digest`` for a glance-clear standup of what is in flight, what just closed, and what was recently decided. Both read straight from state, so the answer is always current and costs nothing to keep so.

      Before writing a memory entry, ask whether a query already answers it. If ``eawf status`` or ``eawf memory digest`` surfaces the fact, do not duplicate it into memory — link to the query instead.

  - id: comment-economy
    target: AGENTS.md
    version: "1.2"
    placement: reference
    summary: "Comments carry why, not what: document every parameter, return and raise, but no restated signatures, change-log narration, or lifecycle ids."
    rationale: |
      A comment that restates the code is not neutral: it is a second copy that drifts, and every reader pays to reconcile the two. Narration of how the code came to be ("after W12 the default flipped", "the pre-fix value was...") ages into a change log nobody trusts, while the one thing a reader cannot recover from the source — why this shape was chosen over the obvious alternative — is what usually goes unwritten. A docstring is different in kind from a comment: it is the reference a caller reads instead of the body, so pruning its entries to save bytes costs the reader the API itself.
    mechanism: |
      Write the why, not the what — in prose. A docstring opens with one or two sentences: what the callable is for, and the non-obvious constraint or choice behind it. If the description runs past a short paragraph, cut it.

      Keep the API surface documented. A caller reads the docstring instead of the body, so it carries a Google-style ``Args:`` entry for every parameter, a ``Returns:`` stating what the value means, and a ``Raises:`` block. Each entry earns its place by adding what the type alone cannot carry — unit, range, ownership, failure mode, or what a flag actually switches. Restating the type in words is the failure mode to avoid, not the presence of the entry itself.

      Inline comments are the scarce resource: one per non-obvious decision, none for what the line already says, and a named constant instead of a comment explaining a literal.

      Do not narrate history: no Task, Batch or Milestone keys, no "previously this did X", no audit or decision references (rule 25 already bars provenance from source; this extends it to bare lifecycle ids).
    verification: |
      Read the docstring as a caller who cannot see the body: every parameter, the return value, and each raised exception is accounted for, and each entry adds a unit, range, or meaning the signature does not already carry. Cut any prose sentence that merely restates the signature, and any inline comment narrating the line below it. Grep the diff for lifecycle ids (``P<NN>`` / ``I<NN>`` / ``W<NN>``) inside comments and docstrings; a hit is reworked into a plain statement of the constraint, or dropped.

  - id: orchestrator-decision-surface
    target: AGENTS.md
    version: "1.2"
    placement: reference
    summary: "Surface every consequential choice as an explicit question with visual option previews, never a silent default."
    rationale: |
      An orchestrating agent that picks silently spends the operator's budget on a decision the operator never saw, and a choice offered as prose alone is answered on vibes. The cost of a wrong pick is a Task of rework; the cost of asking is one round trip. Options compared side by side, with the trade-off drawn rather than described, are the difference between an informed answer and an agreeable one.
    mechanism: |
      When two paths would produce materially different work, stop and ask. File the choice with ``eawf question open-decision`` so it is a pending action with typed options, one per path, each carrying its consequence, its cost and a preview: an ASCII sketch of the before / after, the measured cost, and what is given up. Show the bound question the answer carries and stop: ``AskUserQuestion`` in Claude Code, the answer's numbered prompt printed verbatim in Codex, with the reply relayed through ``eawf question answer``. The operator may answer in the session or in the console, and the first answer wins. Expand every abbreviation, mark the option that is best for the long term as recommended, and state the cost of each option rather than only its benefit. Do not ask a question whose answer changes nothing — make the call, state the assumption, and continue. Free-text approval is not a decision record: the choice must be one of the offered options.
    verification: |
      A dispatched decision shows an option set with previews, not a paragraph of prose. Every abbreviation in the question is expanded on first use, one option is marked recommended, and each option names what it costs. A choice made silently that later needed rework is a rule violation, not bad luck.

  - id: gate-fire-proof-sunset
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "A new gate ships with a test proving it reds on a real defect, and sunsets at Milestone acceptance if it never fired."
    rationale: |
      Gates accumulate: each is justified on its own and none is ever removed, so the surface grows while the failures it was built for keep landing. The pathological case is a gate that has never once fired — it reads as protection, costs time on every run, and proves nothing. Bounding growth by evidence rather than by quota keeps the ones that earn their place.
    mechanism: |
      A new lint, doctor check, or CI gate ships with a test that reds on a **real** defect from this repo, not a synthetic fixture written to satisfy the test. Record what it caught. At Milestone acceptance, review the gates added during the Milestone: one that never fired on real work is retired, not kept "just in case". Where the defect population is too large to fix at once, pin it as a ratchet — an exact set or a ceiling that can only shrink — rather than an allowlist that can quietly absorb new entries.
    verification: |
      Each gate added in a Milestone names the real defect it reds on. The acceptance review lists gates added, whether each fired, and the disposition of those that did not. A ratchet is exact-set or ceiling based, so repairing an entry forces its removal and a new offender fails even while the list is non-empty.

  - id: commit-granularity
    target: AGENTS.md
    version: "1.7"
    placement: reference
    summary: "One commit per Batch, or a few for a large Batch, squashed before the push; each push ends with one ``state:`` commit, and the bindings a squash replaced are rebound by superseding rows."
    rationale: |
      Commit count is not progress. A deliverable split across a dozen commits — code here, its test there, the golden it invalidated three commits later — cannot be reviewed as a unit or reverted as one, and ``git bisect`` lands mid-change on a tree that never worked. The opposite failure, one commit for an entire Milestone, is equally unreadable. The unit that builds, passes its tests and is reviewed is the Batch. One past delivery made the cost concrete: 1,036 commits for 525 units of work, 385 of them state-only bookkeeping — a reviewer opening the PR read twice as much bookkeeping as delivery.
    mechanism: |
      Decision D87 sets the regime, superseding D85. Scratch and per-Task commits are free while a Batch is in flight; before the push, ``eawf batch squash`` writes the branch again as one commit per Batch holding its code and tests, ordered by each Batch's last commit, carrying one ``Batch:`` trailer and a ``Task:`` trailer per Task, and checks every rewritten commit builds. A large Batch may land as a few buildable commits; two Batches whose work cannot be separated share one commit, and the squash says so.

      **One state commit per push.** State changes made while the Tasks ran ride a single trailing ``state:`` commit at the end of the push, touching only committed state paths. Never interleave state commits between Batch commits.

      **A Batch binds when it lands.** A Batch closes as soon as every Task in it is ready and its commits are on the Milestone branch: the daemon binds the Milestone branch head and walks the Batch and its Tasks to COMPLETED. The squash replaces the commits those bindings name, so once the branch points at the squashed tip, ``eawf batch rebind`` appends a superseding row for every ledger line naming a replaced commit, bound to the commit now carrying its Batch; no row is edited. A branch the remote already has is rewritten only with ``--force-with-lease``, after an archive ref.

      The one exception is a golden-only ``test:`` commit: every path it stages is a non-``.py`` file under a **managed golden surface** (the ``eawf snapshot list`` inventory). The snapshot-pairing gate requires those bytes to land under a ``test:`` subject, so a golden refresh rides its own paired ``test:`` commit immediately after the change that caused it — named for that cause, never as a bare "refresh goldens".
    verification: |
      Read the commit list for a push: each Batch appears as one commit, or a few, containing its tests and carrying its ``Batch:`` and ``Task:`` trailers, followed by one ``state:`` commit. A ``test:`` golden refresh names the change it follows. Every commit in the range builds, so ``git bisect`` never lands on a broken intermediate, and every head a landed Batch bound is an ancestor of the pushed head.

  - id: anti-patterns
    target: AGENTS.md
    version: "1.3"
    body_template: |
      ## Anti-patterns

      - Mutating ``state.json`` outside the daemon (or its entity-verb proxy / portalocker direct-write fallback) — see rule 4.
      - Skipping ``extra="forbid"`` on a Pydantic model "just for now".
      - Merging worktree branches instead of cherry-picking.
      - ``--no-verify`` on a failing pre-commit hook.
      - Quoting design-intent docs as authoritative for current behaviour (verify against the source tree).
      - Starting a Milestone, Batch, or Task from a stale feature branch.
      - Adding a runtime dep without checking it's not already pulled in transitively.
      - Using ``Read`` to verify a file you just wrote with ``Write``/``Edit``.
      - Carrying audit citations or decision-round IDs into source comments (rule 25 violation; provenance lives in commit body
        + ``state.json`` Decision URN).

