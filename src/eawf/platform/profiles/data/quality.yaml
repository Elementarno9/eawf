name: quality
version: "1.0"
description: "Opt-in code-craft profile: structured rules with a verification line each."

# This profile is opt-in: it is NOT in the built-in default enabled list
# (which ships just ``core``). Enable it with ``eawf config profile enable
# quality`` when a repo wants the code-craft rules rendered into AGENTS.md.
#
# Every render block uses the structured RenderBlock triad
# (rationale / mechanism / verification — the P27-I03-W01 schema). The triad
# guarantees each code-craft rule carries an explicit *verification* line so a
# reviewer can check the rule was followed, not just asserted. The renderer
# emits a fixed ``Rationale`` / ``Mechanism`` / ``Verification`` sub-heading
# layout from each triad (see src/eawf/platform/templates/AGENTS.md.j2).

state_extensions:
  fields_required: []

instrument_requirements: []

render_blocks:
  - id: code-craft-dry
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Extract shared logic into one named home only once a third use site appears; until then tolerate the duplication."
    rationale: |
      Repeated logic drifts: a fix lands in one copy and the others rot. DRY (don't repeat yourself) keeps one canonical home per behaviour so a change has one place to land. The balance is KISS — three similar lines are cheaper to read than a half-fitted helper, so do not abstract until a third caller actually appears.
    mechanism: |
      When a third use site of the same logic appears, extract it into one named function or constant and route every caller through it. Until then, tolerate the duplication. Never introduce a parameterised helper for two call sites or for a use site that does not yet exist (YAGNI).
    verification: |
      grep for the literal or near-literal logic across the changed module; a reviewer confirms either a single shared definition or fewer than three copies. A new helper with only one caller is a YAGNI violation and the reviewer rejects it.
  - id: code-craft-fail-fast
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Validate inputs at the boundary and raise there, so downstream functions accept already-validated typed objects and never re-check."
    rationale: |
      An error raised deep in a call stack surfaces far from its cause, so the stack trace points at the symptom rather than the bad input. Fail-fast raises at the boundary where invalid data enters, keeping the trace short and the blame obvious.
    mechanism: |
      Validate inputs at the boundary (loader, CLI parse, public function entry) and raise immediately on bad data. Downstream functions accept already-validated typed objects and never re-check. Error messages start lowercase, carry no trailing period, and interpolate user input with ``!r`` so the offending value is quoted.
    verification: |
      Read the function's first statements: argument validation precedes any side effect. Each public function has an error-path test asserting the exception type (``TypeError`` / ``ValueError`` / ``KeyError`` / ``ValidationError``) and, when the message is part of the contract, the message substring via ``pytest.raises``.
  - id: code-craft-single-responsibility
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Give each function and class exactly one reason to change, keeping parsing, validation, and execution in separate units."
    rationale: |
      A unit with one reason to change is testable in isolation and safe to edit. When parsing, validation, computation, and rendering share a function, a change to one concern risks the others and tests need elaborate setup.
    mechanism: |
      Give each function and class exactly one reason to change. Keep parsing separate from validation separate from execution. When one class accretes distinct concerns and outgrows roughly 300 lines or seven public methods, apply the ``refactor-god-class`` playbook: extract the lowest-coupling seam first, one concern per commit.
    verification: |
      Name each public method's single concern; methods that span two concerns flag the unit for extraction. The cognitive-complexity gate (EAWF011 + ruff C901) backstops this — a function over the threshold fails ``uv run pre-commit run --all-files`` before review.
  - id: code-craft-explicit-over-implicit
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Pass arguments by keyword at arity three or more, return explicit values rather than ``None``-as-success, and keep behaviour matching the name."
    rationale: |
      Implicit behaviour surprises the next reader: positional arguments at high arity transpose silently, and ``None``-as-success hides the real outcome. Explicit code matches the principle of least surprise — the behaviour reads off the call site without chasing the definition.
    mechanism: |
      Use named arguments over positional when a function takes three or more parameters. Return explicit values rather than ``None``-as-success. Prefer pure functions with no hidden state. Keep behaviour matching the name so a reader trusts the signature.
    verification: |
      Read each call site of a function with arity of three or more: arguments are passed by keyword. A function whose name implies a value but returns ``None`` on the happy path is reworked. mypy (``uv run mypy src/``) backs the explicit-return contract via full type hints.

# Band-scoped verify enforcement. ``enforce`` + ``cross_vendor_jury`` declare
# the QC intent at the fleet level, but the wave-aware resolver
# (``resolve_wave_verify_block``) narrows them to the banded set: a wave whose
# file_scopes touch ``surfaces/tui/`` or ``surfaces/render/`` (or whose id /
# title matches a ``uiux_bands`` token) closes through the spec-jury gate,
# while every non-band wave keeps the advisory close path. This is a per-wave
# gate, NOT a fleet-wide flip.
#
# The band is broadened beyond the two UI-surface tokens (``tui`` / ``render``)
# to the judgment-heavy subsystems whose intent resists a deterministic
# falsifier: ``verify`` / ``eval`` / ``jury`` / ``spec`` waves carry the same
# lossy-intent risk the 2026-06-02 TUI incident diagnosed, so a wave named for
# the trust / verification / jury / spec machinery also closes through the
# cross-vendor jury rather than the advisory path. The ``jury_calibrated``
# close gate then refuses that jury blocking authority unless its I09
# calibration metrics clear, so a banded wave is never blocked by an
# un-validated jury.
#
# ``jury_vendors`` records the disjoint cross-vendor panel for the band spec
# jury (all three spawn runtimes are live). The LIVE multi-vendor invocation
# stays IDLE in v0.5: the daemon's per-item ballot fn returns None so no juror
# is spawned from this list -- wiring the live panel is a deferred calibration
# note, and the deterministic canned-ballot gate is what proves discrimination.
verify:
  enforce: true
  cross_vendor_jury: true
  uiux_bands:
    - tui
    - render
    - verify
    - eval
    - jury
    - spec
  jury_vendors:
    - claude
    - codex
    - opencode
  argv_allowlist:
    - uv
    - run
    - pre-commit
  floor_checks:
    - name: code-craft-lint
      cmd: ["uv", "run", "pre-commit", "run", "--all-files"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
  waiver_mode: B
