name: apps
version: "1.0"
description: "Application / product engineering profile: user-facing change discipline."

state_extensions:
  fields_required: []

instrument_requirements: []

render_blocks:
  - id: apps-product-discipline
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ## Application engineering (apps profile)

      - User-facing behaviour change ships with a test that exercises the new
        behaviour through the same entry point a user hits, not just an internal
        helper.
      - Keep the seam between UI / transport, application logic, and persistence
        explicit — rendering and request parsing never reach past the
        application layer into storage directly.
      - Feature work is gated behind config or a flag until its tests pass, so
        an incomplete change never becomes the default path.

skills_referenced: []
hooks_referenced: []

# P28-I01-W10 — verify spine floor pack. Adds a docs build step to the
# python floor so apps profiles also gate on rendered docs surviving a
# Sphinx build. Cadence steps up to ``every-iter`` because docs builds
# are slow enough that running per-wave doubles the local-gauntlet
# time for no benefit on a single-file change.
verify:
  argv_allowlist:
    - uv
    - run
    - pre-commit
    - mypy
    - pytest
    - sphinx-build
  floor_checks:
    - name: pre-commit
      cmd: ["uv", "run", "pre-commit", "run", "--all-files"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
    - name: mypy
      cmd: ["uv", "run", "mypy", "src/"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
    - name: pytest
      cmd: ["uv", "run", "pytest", "-q"]
      scope: touched
      cadence: every-wave
      policy: warn
      required: true
    - name: docs-build
      cmd: ["uv", "run", "sphinx-build", "docs/", "build/docs"]
      scope: all
      cadence: every-iter
      policy: warn
      required: true
      timeout_class: slow
  waiver_mode: B
