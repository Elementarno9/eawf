name: agent_driven
version: "1.1"
description: "Opt-in agent-driven profile: phase=release + large phase-PR divergence rules + lean wave verification."

# This profile is opt-in: it is NOT in the built-in default enabled list
# (which ships just ``core``). Enable it with ``eawf config profile enable
# agent_driven`` for single-operator, agent-driven repos (eawf itself enables
# it). It encodes two deliberate *divergences* from the small-CL / trunk-based
# defaults that the bundled ``core`` profile renders, plus a pointer to the
# decisions that ratified them.
#
# The defaults stay small-CL: ``core`` keeps "PRs: one per phase (typical)"
# framed for human-team review cadence, and managed repos that do NOT enable
# this profile inherit the small-CL / trunk-based norm. This profile flips
# that calculus only where it holds — agent-driven throughput, per-wave
# bisectable commits, and a per-wave review + behavioural smoke gate as the
# compensating control.
#
# Every render block uses the structured RenderBlock triad
# (rationale / mechanism / verification — the P27-I03-W01 schema) so each
# divergence rule carries an explicit *verification* line a reviewer can
# check. The renderer emits a fixed ``Rationale`` / ``Mechanism`` /
# ``Verification`` sub-heading layout per triad (see
# src/eawf/platform/templates/AGENTS.md.j2).

state_extensions:
  fields_required: []

instrument_requirements: []

render_blocks:
  - id: agent-driven-phase-equals-release
    target: AGENTS.md
    version: "1.1"
    placement: reference
    summary: "Every closed phase ships as at least a minor release: the phase-close commit bumps the package version module and the PR merge tags that release."
    rationale: |
      In a single-operator, agent-driven repo a phase is the unit of shipped value, not an internal checkpoint — agent throughput collapses many human-weeks of work into one reviewable delivery. Treating each phase as at least a minor release keeps the published version honest about what landed and gives every phase a tag to bisect releases against. Drip- releasing per wave would churn tags faster than the value is observable.
    mechanism: |
      Every closed phase ships as at least a minor release. The phase-close commit bumps the package version in ``src/eawf/_version.py`` (e.g. ``0.3.0`` -> ``0.3.1``, or ``-> 0.4.0`` / ``-> 1.0.0`` when the phase warrants it) and the phase PR merge tags that release. ``pyproject.toml`` declares the version dynamically; it has no static ``project.version`` field to edit. The version bump and tag ride the same ``[P<NN>] state: close iter + phase`` commit that ends the phase, so the release marker and the closed state land together. Do not close a phase without bumping the version.
    verification: |
      Read the phase-close commit: it advances ``src/eawf/_version.py`` while ``pyproject.toml`` remains dynamically versioned, and the merge creates a release tag matching the new version. ``git tag --points-at <phase-close-sha>`` lists the release tag; a phase that closed without a version bump or a tag is reworked before the PR merges.
  - id: agent-driven-large-phase-pr
    target: AGENTS.md
    version: "1.5"
    placement: reference
    summary: "Ship one PR per Milestone however large it grows, keep each Batch commit individually bisectable, and merge so each Batch commit survives."
    rationale: |
      The small-CL / trunk-based default exists to bound human-reviewer attention per change. Agent-driven throughput dwarfs that concern: the bottleneck is operator review of *coherent deliveries*, not line count, and a Milestone reviewed as one unit reads as one story. The granularity the small-CL rule buys is already present *inside* the PR — per-Batch bisectable commits give per-change history without fragmenting the review surface into dozens of context-free PRs.
    mechanism: |
      Ship one PR per Milestone. A Milestone PR carrying roughly +10k lines across many files is expected and acceptable, not a smell to split. Do not break a Milestone into many small PRs to chase a line-count target. The compensating controls are real per-Batch review and a behavioural smoke gate in CI; keep each Batch commit individually buildable (one commit per Batch, or a few for a large Batch) so ``git bisect`` stays sharp inside the large PR. Merge so each Batch commit survives on the trunk; main and tags are never rewritten.
    verification: |
      Confirm the Milestone produced exactly one PR and that its commits are per-Batch, each carrying one ``Batch:`` trailer and a ``Task:`` trailer per Task, and individually buildable. A reviewer who proposes splitting the Milestone into multiple PRs is overruled by this rule; a reviewer who finds two Batches folded into one commit without the squash naming why flags it for rework. The target branch shows each Batch commit of the merged PR.
  - id: agent-driven-cadence-adr-pointer
    target: AGENTS.md
    version: "1.4"
    placement: reference
    summary: "The one-PR-per-Milestone cadence and the commit-history regime are ratified by a typed decision; cite its id in review and reverse the cadence only by superseding it."
    rationale: |
      The large-PR cadence contradicts the industry small-CL / trunk-based consensus on purpose, so a reader who hits the large-PR rule needs the evidence chain that ratified it — otherwise the rule reads as an oversight and gets "fixed" back to small-CL. Naming the decision keeps the divergence auditable and reversible from the decision ledger alone.
    mechanism: |
      The one-PR-per-Milestone cadence and the commit-history regime are ratified by Decision D87, which superseded D85, itself the replacement for D-GIT-HISTORY (D76) and the earlier one-PR-per-phase and rebase-merge decisions: each Batch closes and binds the phase-branch head when it lands, each push is squashed to one commit per Batch (a few for a large Batch) carrying its ``Batch:`` and ``Task:`` trailers plus one trailing ``state:`` commit, the bindings the squash replaced are rebound by appended superseding rows, and main and tags are never rewritten. The canonical workflow reference is ``docs/architecture/workflow.md`` (VCS, commit, PR, and merge policy). Cite the Decision id, not this rule's prose, when a review or roadmap discussion questions the cadence; reverse it only by superseding D87 with a new Decision row.
    verification: |
      The decision exists in the decision ledger and surfaces in ``eawf status`` recent decisions. ``docs/architecture/workflow.md`` resolves as a repo-relative path. A claim that small-CL should replace this rule is checked against the decision's status — only a superseding Decision discharges the divergence.
  - id: lean-wave-verification
    target: AGENTS.md
    version: "1.3"
    placement: reference
    summary: "Wave success criteria name targeted tests that finish inside 60s; the full suite and one fresh-context audit run once per iter at iter close, not once per wave."
    rationale: |
      Running the full test suite plus a fresh-context audit on every wave costs 10-30 minutes per wave and serializes iter execution. The live close gate reserves blocking auditor spawn for the high-risk band (L/XL effort, judgment roles, and security scope). Its deterministic 1-in-4 classification for mechanical waves is advisory today: sampled mechanical waves do not trigger a blocking live auditor spawn. Iter-close audit-link integrity is the patch-release guard; proof that the audit evaluated the exact closing HEAD remains deferred to the provenance model in v0.7.
    mechanism: |
      Wave success criteria name targeted tests only (``uv run pytest <touched paths>``) — never the full suite — and that selection must finish within **60 seconds**. A targeted run slower than that is over-scoped: narrow it to the touched paths, or the feedback loop stops being usable and the agent starts skipping it. Iter-scoped and full-suite runs carry no such bound. A mechanical wave (S/M effort, executor role, non-security) closes on criteria + evidence alone; do not describe the 1-in-4 sampler as a blocking spawn control. The full suite (the repo's acceptance ``tests`` command) and one fresh-context audit run once per iter, at iter close, in this order: polish -> full suite -> audit over the iter diff -> close. Strict close validates that the named audit exists, belongs to the iter, is complete and accepted, and carries real evidence; it does not validate evaluated HEAD. Nonblocking audit findings become backlog items (``eawf task create``). One repair wave and one re-audit is operator procedure, not a production limit: reserved ``flow.max_repair_cycles`` does not enforce it. Exceptions that keep the wave-level full-tree gauntlet: persisted-schema / migration waves and security-scoped waves.
    verification: |
      A closed mechanical wave shows no full-suite run and no blocking sampler-spawn claim. The iter close names a real accepted audit linked to that iter; do not infer an audited HEAD SHA from the link. Audit findings resolve through operator triage, and no check claims ``flow.max_repair_cycles`` enforces a one-repair-wave ceiling.

# Risk-weighted close-verdict enforcement. ``enforce: true`` turns the
# close-time verdict gate ON, but the daemon close path
# (:func:`eawf.runtime.daemon.methods.state._enforce_wave_close_gate`)
# narrows the hard gate to the HIGH-RISK band -- the subset where
# :func:`eawf.workflow.dispatch.verdict.verdict_requirement` returns
# ``"always"`` (security / sandbox / spawn / L-XL / judgment waves). A
# high-risk wave cannot close without a fresh-context auditor verdict: the
# close path spawns one auditor (single-auditor gate) and reads the
# persisted verdict. A mechanical (sampled / skip) wave is left advisory --
# no auditor is spawned and the close is byte-unchanged from the pre-enforce
# behavior. ``cross_vendor_jury`` stays ``false`` so the high-risk gate is a
# single fresh-context auditor, not the three-vendor jury; the jury is a
# deferred calibration opt-in. No ``uiux_bands`` here -- this is a
# whole-fleet enforce profile whose effective scope is the high-risk band,
# not a UI/UX-token band.
verify:
  enforce: true
  cross_vendor_jury: false

skills_referenced: []
hooks_referenced: []
