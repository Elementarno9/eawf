name: agent_driven
version: "1.2"
description: "Opt-in agent-driven profile: Milestone=release + large Milestone-PR divergence rules + lean Task verification."

# This profile is opt-in: it is NOT in the built-in default enabled list
# (which ships just ``core``). Enable it with ``eawf config profile enable
# agent_driven`` for single-operator, agent-driven repos (eawf itself enables
# it). It encodes two deliberate *divergences* from the small-CL / trunk-based
# defaults that the bundled ``core`` profile renders, plus a pointer to the
# decisions that ratified them.
#
# The defaults stay small-CL: ``core`` keeps "PRs: one per Milestone
# (typical)" framed for human-team review cadence, and managed repos that do
# NOT enable this profile inherit the small-CL / trunk-based norm. This
# profile flips that calculus only where it holds — agent-driven throughput,
# per-Batch bisectable commits, and a per-Batch review + behavioural smoke
# gate as the compensating control.
#
# Every render block uses the structured RenderBlock triad
# (rationale / mechanism / verification) so each divergence rule carries an
# explicit *verification* line a reviewer can check. The renderer emits a
# fixed ``Rationale`` / ``Mechanism`` / ``Verification`` sub-heading layout
# per triad (see src/eawf/platform/templates/AGENTS.md.j2).

state_extensions:
  fields_required: []

instrument_requirements: []

render_blocks:
  - id: agent-driven-milestone-equals-release
    target: AGENTS.md
    version: "1.2"
    placement: reference
    summary: "Every accepted Milestone ships as at least a minor release: its acceptance commit bumps the package version module and the release cut from its merged PR tags it."
    rationale: |
      In a single-operator, agent-driven repo a Milestone is the unit of shipped value, not an internal checkpoint — agent throughput collapses many human-weeks of work into one reviewable delivery. Treating each Milestone as at least a minor release keeps the published version honest about what landed and gives every Milestone a tag to bisect releases against. Drip-releasing per Task would churn tags faster than the value is observable.
    mechanism: |
      Every accepted Milestone ships as at least a minor release. The commit that records the Milestone's acceptance bumps the package version in ``src/eawf/_version.py`` (e.g. ``0.3.0`` -> ``0.3.1``, or ``-> 0.4.0`` / ``-> 1.0.0`` when the Milestone warrants it), and the release cut from the merged Milestone PR tags it. ``pyproject.toml`` declares the version dynamically; it has no static ``project.version`` field to edit. The version bump rides the same trailing ``state:`` commit that records the acceptance, so the release marker and the accepted state land together. Do not accept a Milestone without bumping the version.
    verification: |
      Read the Milestone's acceptance commit: it advances ``src/eawf/_version.py`` while ``pyproject.toml`` remains dynamically versioned, and the release tag matching the new version points at the merge. ``git tag --points-at <merge-sha>`` lists the release tag; a Milestone accepted without a version bump is reworked before the PR merges.
  - id: agent-driven-large-milestone-pr
    target: AGENTS.md
    version: "1.7"
    placement: reference
    summary: "Ship one PR per Milestone however large it grows, keep each Batch commit individually bisectable, and fast-forward main so each Batch commit survives."
    rationale: |
      The small-CL / trunk-based default exists to bound human-reviewer attention per change. Agent-driven throughput dwarfs that concern: the bottleneck is operator review of *coherent deliveries*, not line count, and a Milestone reviewed as one unit reads as one story. The granularity the small-CL rule buys is already present *inside* the PR — per-Batch bisectable commits give per-change history without fragmenting the review surface into dozens of context-free PRs.
    mechanism: |
      Ship one PR per Milestone. A Milestone PR carrying roughly +10k lines across many files is expected and acceptable, not a smell to split. Do not break a Milestone into many small PRs to chase a line-count target. The compensating controls are real per-Batch review and a behavioural smoke gate in CI; keep each Batch commit individually buildable (one commit per Batch, or a few for a large Batch) so ``git bisect`` stays sharp inside the large PR. Fast-forward ``main`` to the reviewed head so each Batch commit survives on the trunk with its reviewed SHA; main and tags are never rewritten.
    verification: |
      Confirm the Milestone produced exactly one PR and that its commits are per-Batch, each carrying one ``Batch:`` trailer and a ``Task:`` trailer per Task, and individually buildable. A reviewer who proposes splitting the Milestone into multiple PRs is overruled by this rule; a reviewer who finds two Batches folded into one commit without the squash naming why flags it for rework. ``main`` carries each reviewed commit of the merged PR with the same SHA.
  - id: agent-driven-cadence-adr-pointer
    target: AGENTS.md
    version: "1.6"
    placement: reference
    summary: "The one-PR-per-Milestone cadence and the commit-history regime are ratified by a typed decision; cite its id in review and reverse the cadence only by superseding it."
    rationale: |
      The large-PR cadence contradicts the industry small-CL / trunk-based consensus on purpose, so a reader who hits the large-PR rule needs the evidence chain that ratified it — otherwise the rule reads as an oversight and gets "fixed" back to small-CL. Naming the decision keeps the divergence auditable and reversible from the decision ledger alone.
    mechanism: |
      The one-PR-per-Milestone cadence and the commit-history regime are set by Decision D92, which superseded D87; D87 itself replaced D85, D-GIT-HISTORY (D76) and the earlier one-PR-per-delivery and rebase-merge decisions: each Batch closes and binds the Milestone branch head when it lands, the branch is squashed to one commit per Batch (a few for a large Batch) carrying its ``Batch:`` and ``Task:`` trailers plus one trailing ``state:`` commit only before review opens, the bindings the squash replaced are rebound by appended superseding rows, review findings are fixed by appended Batches, the Milestone is accepted last, ``main`` fast-forwards to the reviewed commit, and main and tags are never rewritten. The canonical workflow reference is ``docs/architecture/workflow.md`` (VCS, commit, PR, and merge policy). Cite the Decision id, not this rule's prose, when a review or planning discussion questions the cadence; reverse it only by superseding D92 with a new Decision row.
    verification: |
      The decision exists in the decision ledger and surfaces in ``eawf status`` recent decisions. ``docs/architecture/workflow.md`` resolves as a repo-relative path. A claim that small-CL should replace this rule is checked against the decision's status — only a superseding Decision discharges the divergence.
  - id: lean-task-verification
    target: AGENTS.md
    version: "2.0"
    placement: reference
    summary: "Task success criteria name targeted tests that finish inside 60s; the full suite and one fresh-context audit run once per Batch, before it lands, not once per Task."
    rationale: |
      Running the full test suite plus a fresh-context audit on every Task costs 10-30 minutes per Task and serializes the Batch. The Batch is the unit that lands and is verified as one change — ``/verify`` binds one Batch at one exact revision — so it is where the whole change is judged once, and every Task criterion is proved again at the Batch head before the Batch closes.
    mechanism: |
      Task success criteria name targeted tests only (``uv run pytest <touched paths>``) — never the full suite — and that selection must finish within **60 seconds**. A targeted run slower than that is over-scoped: narrow it to the touched paths, or the feedback loop stops being usable and the agent starts skipping it. Batch-scoped and full-suite runs carry no such bound. The full suite (the repo's acceptance ``tests`` command) and one fresh-context audit (``/verify --mode audit``) run once per Batch, before it lands, in this order: polish -> full suite -> audit over the Batch diff -> land. Nonblocking audit findings become backlog Tasks (``eawf task create``). One repair Task and one re-audit is operator procedure, not a production limit. Exceptions that keep the Task-level full-tree gauntlet: persisted-schema / migration Tasks and security-scoped Tasks.
    verification: |
      A Task whose criteria name only targeted tests shows no full-suite run of its own. The Batch's verification names a real accepted audit bound to that Batch at its exact revision. Audit findings resolve through operator triage, and no check claims a production limit on repair Tasks.

# Close-readiness enforcement. ``enforce: true`` makes close readiness a hard
# gate instead of an advisory one (see :mod:`eawf.workflow.verify.readiness`).
# ``cross_vendor_jury`` stays ``false`` so a high-risk verdict needs a single
# fresh-context auditor, not the three-vendor jury; the jury is a deferred
# calibration opt-in.
verify:
  enforce: true
  cross_vendor_jury: false

skills_referenced: []
hooks_referenced: []
