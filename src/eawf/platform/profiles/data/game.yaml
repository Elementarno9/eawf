name: game
version: "1.0"
description: "Game development profile (stub for v0.1.1)."

# Per-kind Track defaults: the game profile's sole declared kind is its default,
# so a ``track add`` under a game project picks ``feature`` when the operator
# names no explicit kind.
track:
  kinds:
    feature:
      noun: feature
      status_lifecycle:
        - backlog
        - prototype
        - playtest
        - polish
        - shipped
        - cut
      outcome_template: ""
      overview_view: leaderboard
