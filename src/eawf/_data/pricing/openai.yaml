# OpenAI list prices, USD per million tokens. Write classes are 30m and 12h.
# A null class rate is not stated by the vendor: tokens of that class stay
# unpriced. A tier applies when input + cache read + cache write exceeds its
# threshold; the vendor page says "input tokens" and does not state whether
# cached tokens count, so the shared rule is kept.
vendor: openai
aliases: []
models:
  - id: gpt-6.1-sol
    match: [gpt-6.1-sol]
    effective_from: null
    effective_to: null
    source_url: https://developers.openai.com/api/docs/pricing
    verified_on: 2026-11-10
    verified_by: fetch
    rates: {input: 2, output: 10, cache_read: 0.10, cache_write: {"30m": 2.50, "12h": 5}}
    tiers:
      - above_prompt_tokens: 272000
        rates: {input: 4, output: 15, cache_read: 0.20, cache_write: {"30m": 5, "12h": 10}}
    modifiers: {fast: null, geo_us: null}
    note: Rates agree between the OpenAI pricing page and the LiteLLM price file.
