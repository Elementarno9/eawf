name: core
version: "1.0"
description: "Core eawf workflow profile (always enabled)."

state_extensions:
  fields_required: []

instrument_requirements:
  - name: git
    kind: hard
    probe: version
    version_args: ["--version"]
    version_regex: "^git version"
  - name: uv
    kind: hard
    probe: version
    version_args: ["--version"]
    version_regex: "^uv\\s+\\d"

render_blocks:
  - id: non-negotiable-rules
    target: AGENTS.md
    version: "1.0"
    body_template: |
      ## Non-negotiable rules (core)

      1. CLI is dispatch; library implements.
      2. Strict config validation: every YAML/JSON path uses Pydantic v2 with
         ``ConfigDict(extra="forbid")``.
      3. State CLI is the only mutator of ``state.json``.
      4. f-strings only; full type hints; ``uv run`` for all Python invocations.
      5. Pre-commit before every commit; hook failures are root-caused, never
         ``--no-verify``'d.

skills_referenced: []
hooks_referenced: []
