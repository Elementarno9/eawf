# One valid record per (entity, status) of the epoch-2 transition
# registry, loaded through the strict models themselves.
#
# The reducers are pure, so what drives them at this checkpoint is a
# fixture rather than canonical state: every seed below is a complete
# record that the model accepts, which is what lets the guard sweep start
# a legal edge from each source status and the terminal sweep prove a
# finished record refuses to move at all.
#
# Anchors carry the fields that never vary; each status entry overrides
# only what its own status makes a fact.
