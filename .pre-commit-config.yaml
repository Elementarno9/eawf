repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/Yelp/detect-secrets
    # Baseline-hash: f57e84134affb315 (.secrets.baseline; recompute and bump
    # this comment when the baseline is edited so the change is re-acknowledged).
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Exclude state-bookkeeping files: state.json + store/*.jsonl carry
        # canonical 40-char hex wave-commit SHAs + URNs that trigger the
        # Hex-High-Entropy plugin as false positives, and their line offsets
        # shift on every state mutation — refreshing the baseline per commit
        # became loop noise. AGENTS rule 4 guarantees these files do not
        # carry user secrets by design; the daemon (sole canonical mutator)
        # owns their content.
        exclude: 'uv\.lock|\.gitignore|^\.ea/state\.json$|^\.ea/store/.*\.jsonl$'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        stages: [manual]
        additional_dependencies:
          - pydantic>=2.13
          - typer>=0.25

  - repo: local
    hooks:
      - id: insert-coauthor
        name: insert-coauthor
        entry: python3 tools/insert_coauthor.py
        language: system
        stages: [prepare-commit-msg]
      - id: normalize-coauthor
        name: normalize-coauthor
        entry: python3 tools/normalize_coauthor.py
        language: system
        stages: [commit-msg]
      - id: commit-prefix-lint
        name: commit-prefix-lint
        entry: python3 tools/commit_prefix_lint.py
        language: system
        stages: [commit-msg]
      - id: mypy-pre-push
        name: mypy-pre-push
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: eawf-doc-verify-strict
        name: eawf-doc-verify-strict
        entry: uv run eawf doc verify --strict
        language: system
        pass_filenames: false
        stages: [manual]
      - id: spec-paths
        name: spec-paths
        entry: python3 tools/pre_commit_spec_paths.py
        language: system
        files: '^\.ea/specs/.*\.md$'
        stages: [pre-commit]
      - id: path-leak-lint
        name: path-leak-lint
        entry: uv run eawf hook path-leak-lint
        language: system
        # Diff-scoped to the staged delta (git diff --cached): a real
        # commit scans only its staged files; `--all-files` (nothing
        # staged) is a clean no-op, so the gate never flags the tree's
        # documented example paths / golden fixtures / scrubber source.
        pass_filenames: false
        stages: [pre-commit]
      - id: email-leak-lint
        name: email-leak-lint
        entry: uv run eawf hook email-leak-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: log-format-lint
        name: log-format-lint
        entry: uv run eawf hook log-format-lint
        language: system
        # EAWF001 over the staged src/eawf/**/*.py delta only (git diff
        # --cached), not the whole tree — pre-existing log lines are not
        # retroactively rejected.
        pass_filenames: false
        stages: [pre-commit]
      - id: agents-md-budget
        name: agents-md-budget
        entry: uv run python -m eawf.platform.lint.tools.agents_md_budget
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf002-log-key
        name: eawf002-log-key
        entry: uv run eawf hook eawf002-log-key
        language: system
        # EAWF002 over the staged src/eawf/**/*.py delta only (git diff
        # --cached) — bare wave/iter/phase log keys, no `_id` suffix.
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf003-logger-acquire
        name: eawf003-logger-acquire
        entry: uv run eawf hook eawf003-logger-acquire
        language: system
        # EAWF003 over the staged src/eawf/**/*.py delta only — library
        # loggers acquired via logging.getLogger(__name__).
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf010-module-length
        name: eawf010-module-length
        entry: uv run eawf hook eawf010-module-length
        language: system
        # EAWF010 over the staged src/eawf/**/*.py delta only — module
        # physical-line cap with the pyproject grandfather exclude list.
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf011-cognitive-complexity
        name: eawf011-cognitive-complexity
        entry: uv run eawf hook eawf011-cognitive-complexity
        language: system
        # EAWF011 over the staged src/eawf/**/*.py delta only — per-
        # function cognitive-complexity gate (no-regression budget).
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf012-design-provenance
        name: eawf012-design-provenance
        entry: uv run eawf hook eawf012-design-provenance
        language: system
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf013-bracket-position
        name: eawf013-bracket-position
        entry: uv run eawf hook eawf013-bracket-position
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf014-no-manual-wrap
        name: eawf014-no-manual-wrap
        entry: uv run eawf hook eawf014-no-manual-wrap
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf015-ears-advisory
        name: eawf015-ears-advisory
        entry: uv run eawf hook eawf015-ears-advisory
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: eawf018-structure-smell
        name: eawf018-structure-smell
        entry: uv run eawf hook eawf018-structure-smell
        language: system
        # EAWF018 block-bloat advisory over .md (over-long prose block, run-on
        # bullet list, over-long single bullet) and .py docstrings (over-long
        # leading paragraph, wrapped lines joined). Non-blocking (advisory-first
        # per the doc-clarity rollout): a finding warns and exits 0. Catches
        # Vale's block-structure blind spot; thresholds are tighten-only under
        # [tool.eawf.lint.eawf018].
        files: '\.(md|py)$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: eawf016-title-clarity
        name: eawf016-title-clarity
        entry: uv run eawf hook eawf016-title-clarity
        language: system
        # EAWF016 over the staged .ea/state.json delta only (git diff
        # --cached): scans just the *added* "title": lines so a new unclear
        # entity title (commit-type prefix, +-join cluster soup, bare id,
        # over-cap, trailing period) is rejected while the hundreds of
        # unchanged legacy titles are grandfathered. The mutation-boundary
        # gate in the lifecycle transitions is the primary enforcement; this
        # is the backstop for anything that bypasses it.
        files: '^\.ea/state\.json$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf017-inline-refs
        name: eawf017-inline-refs
        entry: uv run eawf hook eawf017-inline-refs
        language: system
        # EAWF017 over the staged .md delta only: flags inline bare URLs and
        # more than two inline path:line refs per prose block (they must move
        # into a numbered ## References table). Composes with EAWF013 (marker
        # position) and the citation-resolution validator (marker resolution).
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf019-math-facets
        name: eawf019-math-facets
        entry: uv run eawf hook eawf019-math-facets
        language: system
        # EAWF019 over staged .json math-explainer docs: validates each as a
        # typed MathExplainer (non-matching JSON is skipped) and flags a claim
        # missing the runnable-example facet, a citation that resolves to no
        # row, a pytest example gate the runner would not collect (the kappa
        # silent-skip regression), or a malformed formula. The gate-runner owns
        # correctness; this is the structure/binding layer.
        files: '\.json$'
        pass_filenames: false
        stages: [pre-commit]
      - id: vale-prose
        name: vale-prose
        entry: uv run eawf hook vale-prose
        language: system
        # Vale prose linter (Google package + custom eawf style) over the
        # staged .md delta. Non-blocking (advisory-first per the doc-clarity
        # rollout) and fails open when the `vale` binary is absent, so a
        # machine without Vale installed still commits. CI installs vale +
        # runs `vale sync` to fetch the Google package; locally it is a skip.
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: validate-prose
        name: validate-prose
        entry: uv run eawf hook validate-prose
        language: system
        # The Layer-2 prose chokepoint: composes EAWF013 (bracket position),
        # EAWF014 (no-manual-wrap), EAWF017 (inline-reference tabulation), and
        # the Vale wrapper over the staged .md delta. Fail-OPEN locally (no
        # --strict): findings are advisory and the gate exits 0, so the operator
        # is never blocked at commit time. The strict, blocking pass is the CI
        # `validate-prose (strict)` job, which passes --strict. The Vale leg
        # fails open when the binary is absent; the deterministic legs run
        # regardless.
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: idle-contract-gate
        name: idle-contract-gate
        entry: uv run python tools/idle_contract_gate.py
        language: system
        # Guards the B091 idle-verifier regression: fails when the spec-jury
        # producer (produce_spec_jury_verdict) is wired but no shipped profile
        # enables it via a non-empty uiux_bands + enforce (idle-forever), OR
        # when the band profile would enforce fleet-wide for a non-UI wave
        # instead of band-scoped (global flip). Also proves the W08 runtime
        # zero-EU close gate remains bound to this always-run hook. Reads the
        # shipped profile set + the real resolver, builds two pure probe waves
        # in-process, and mutates nothing — so always-run with no file filter.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: skill-prose-symbol-gate
        name: skill-prose-symbol-gate
        entry: uv run python tools/skill_prose_symbol_gate.py
        language: system
        # Prose-vs-symbol drift oracle for the frozen skill registry: parses
        # every per-skill body string in
        # src/eawf/surfaces/render/skills/registry.py and asserts each dotted
        # module.attr / slash-form module reference it names imports
        # (importlib) and each src/eawf path it names exists. A drifted
        # reference (a renamed/moved symbol the prose still cites, a deleted
        # path) fails the commit naming the offending token + the carrying
        # skill. The matcher is conservative: bare prose nouns, --flags, and
        # slash-joined option phrases are skipped (no false positive). Reads
        # the live registry in-process and mutates nothing — so always-run
        # with no file filter. BLOCKS: a drifted reference fails the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: jury-discrimination-gate
        name: jury-discrimination-gate
        entry: uv run python tools/jury_discrimination_gate.py
        language: system
        # Proves the cross-vendor jury DISCRIMINATES without a jury certifying
        # a jury (no meta-circularity): feeds the pure per-item reducer
        # (reduce_per_item_ballots) three canned ballot frames in-process and
        # asserts a faithful frame -> PASS, a planted-violation frame -> FAIL
        # citing the violated item + refutation, and a hard near-miss frame
        # (mostly passing, one credible veto) -> FAIL citing its item. A future
        # regression that makes the reducer rubber-stamp is caught here. Pure +
        # deterministic (no live model, mutates nothing) — always-run, no filter.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: sigil-totality
        name: sigil-totality
        entry: uv run eawf hook sigil-totality
        language: system
        # Proves the reskin's two-axis visual vocabulary is TOTAL: every status
        # enum value the TUI renders (plus the lifecycle FSM terminals) resolves
        # through the single resolver (status_sigil) to a real ratified glyph --
        # never a bare .value word, never a '?' fallthrough. Sweeps a fixed enum
        # surface in-process, builds no widget, and mutates nothing -- so
        # always-run with no file filter. BLOCKS: a dropped resolver row fails
        # the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: plugin-doctor-drift
        name: plugin-doctor-drift
        entry: uv run eawf hook plugin-doctor-drift
        language: system
        # Conditional skip on the branch diff (git diff origin/main...HEAD):
        # bails fast unless it touches AGENTS.md, a skill, a runtime, or
        # build/ (drops ~5s → ~50ms on no-op pushes).
        pass_filenames: false
        stages: [pre-push]
