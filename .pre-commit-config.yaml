repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/Yelp/detect-secrets
    # Baseline-hash: a4bda3b35cc4a766 (.secrets.baseline; recompute and bump
    # this comment when the baseline is edited so the change is re-acknowledged).
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: 'uv\.lock|\.gitignore'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        stages: [manual]
        additional_dependencies:
          - pydantic>=2.13
          - typer>=0.25

  - repo: local
    hooks:
      - id: insert-coauthor
        name: insert-coauthor
        entry: python3 tools/insert_coauthor.py
        language: system
        stages: [prepare-commit-msg]
      - id: normalize-coauthor
        name: normalize-coauthor
        entry: python3 tools/normalize_coauthor.py
        language: system
        stages: [commit-msg]
      - id: commit-prefix-lint
        name: commit-prefix-lint
        entry: python3 tools/commit_prefix_lint.py
        language: system
        stages: [commit-msg]
      - id: mypy-pre-push
        name: mypy-pre-push
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: eawf-doc-verify-strict
        name: eawf-doc-verify-strict
        entry: uv run eawf doc verify --strict
        language: system
        pass_filenames: false
        stages: [manual]
