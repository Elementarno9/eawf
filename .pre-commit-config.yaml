repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
        # An epoch-2 generation's ledgers are the project state itself and
        # grow with it, the way the epoch-1 state.json did. The duration
        # baseline keeps one row per test so the CI shards can balance.
        exclude: ^(\.ea/generations/gen-[0-9a-f]{16}/ledger/|tests/duration-baseline\.json$)
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Pattern detectors only; entropy hits here were git SHAs and digests.
        # Not caught: a base64 blob or a 40-hex value under a key with no
        # secret keyword, a private-key body without its BEGIN line, and a
        # SERVICE_TOKEN=<value> line in an env file. Only the hosting
        # platform's secret scanning and push protection cover them, when the
        # repository owner enables those; no local hook does.
        # Baseline entries, one line each: <path>:<line> <detector> <reason>
        args: [--baseline, .secrets.baseline, --disable-plugin, HexHighEntropyString, --disable-plugin, Base64HighEntropyString]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        stages: [manual]
        additional_dependencies:
          - pydantic>=2.13
          - typer>=0.25

  - repo: local
    hooks:
      - id: insert-coauthor
        name: insert-coauthor
        entry: python3 tools/insert_coauthor.py
        language: system
        stages: [prepare-commit-msg]
      - id: normalize-coauthor
        name: normalize-coauthor
        entry: python3 tools/normalize_coauthor.py
        language: system
        stages: [commit-msg]
      - id: commit-prefix-lint
        name: commit-prefix-lint
        entry: python3 tools/commit_prefix_lint.py --pre-push-lint
        stages: [pre-push]
        language: system
        pass_filenames: false
        always_run: true
      - id: branch-name-lint
        name: branch-name-lint
        entry: uv run python tools/branch_name_lint.py
        # Task worktree branches are never pushed, so the commit stage is
        # their only check; the push stage checks the pushed ref names.
        stages: [pre-commit, pre-push]
        language: system
        pass_filenames: false
        always_run: true
      - id: ledger-history
        name: ledger-history
        entry: uv run eawf hook ledger-history --range origin/main..HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mypy-pre-push
        name: mypy-pre-push
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: repo-state-tests
        name: repo-state-tests
        # CI deselects the tests that read this repository's committed .ea,
        # so a state-only change cannot red the product suite; they run here.
        entry: uv run pytest -m repo_state -n 2 -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: eawf-doc-verify-strict
        name: eawf-doc-verify-strict
        entry: uv run eawf doc verify --strict
        language: system
        pass_filenames: false
        stages: [manual]
      - id: path-leak-lint
        name: path-leak-lint
        entry: uv run eawf hook path-leak-lint
        language: system
        # Diff-scoped to the staged delta (git diff --cached): a real
        # commit scans only its staged files; `--all-files` (nothing
        # staged) is a clean no-op, so the gate never flags the tree's
        # documented example paths / golden fixtures / scrubber source.
        pass_filenames: false
        stages: [pre-commit]
      - id: email-leak-lint
        name: email-leak-lint
        entry: uv run eawf hook email-leak-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: log-format-lint
        name: log-format-lint
        entry: uv run eawf hook log-format-lint
        language: system
        # EAWF001 over the staged src/eawf/**/*.py delta only (git diff
        # --cached), not the whole tree — pre-existing log lines are not
        # retroactively rejected.
        pass_filenames: false
        stages: [pre-commit]
      - id: agents-md-budget
        name: agents-md-budget
        entry: uv run python -m eawf.platform.lint.tools.agents_md_budget
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf002-log-key
        name: eawf002-log-key
        entry: uv run eawf hook eawf002-log-key
        language: system
        # EAWF002 over the staged src/eawf/**/*.py delta only (git diff
        # --cached) — bare wave/iter/phase log keys, no `_id` suffix.
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf003-logger-acquire
        name: eawf003-logger-acquire
        entry: uv run eawf hook eawf003-logger-acquire
        language: system
        # EAWF003 over the staged src/eawf/**/*.py delta only — library
        # loggers acquired via logging.getLogger(__name__).
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf010-module-length
        name: eawf010-module-length
        entry: uv run eawf hook eawf010-module-length
        language: system
        # EAWF010 over the staged src/eawf/**/*.py delta only — module
        # physical-line cap with the pyproject grandfather exclude list.
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf011-cognitive-complexity
        name: eawf011-cognitive-complexity
        entry: uv run eawf hook eawf011-cognitive-complexity
        language: system
        # EAWF011 over the staged src/eawf/**/*.py delta only — per-
        # function cognitive-complexity gate (no-regression budget).
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf012-design-provenance
        name: eawf012-design-provenance
        entry: uv run eawf hook eawf012-design-provenance
        language: system
        files: '^src/eawf/.*\.py$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf013-bracket-position
        name: eawf013-bracket-position
        entry: uv run eawf hook eawf013-bracket-position
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf014-no-manual-wrap
        name: eawf014-no-manual-wrap
        entry: uv run eawf hook eawf014-no-manual-wrap
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf015-ears-advisory
        name: eawf015-ears-advisory
        entry: uv run eawf hook eawf015-ears-advisory
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: eawf018-structure-smell
        name: eawf018-structure-smell
        entry: uv run eawf hook eawf018-structure-smell
        language: system
        # EAWF018 block-bloat advisory over .md (over-long prose block, run-on
        # bullet list, over-long single bullet) and .py docstrings (over-long
        # leading paragraph, wrapped lines joined). Non-blocking (advisory-first
        # per the doc-clarity rollout): a finding warns and exits 0. Catches
        # block-structure smells; thresholds are tighten-only under
        # [tool.eawf.lint.eawf018].
        files: '\.(md|py)$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: eawf017-inline-refs
        name: eawf017-inline-refs
        entry: uv run eawf hook eawf017-inline-refs
        language: system
        # EAWF017 over the staged .md delta only: flags inline bare URLs and
        # more than two inline path:line refs per prose block (they must move
        # into a numbered ## References table). Composes with EAWF013 (marker
        # position) and the citation-resolution validator (marker resolution).
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf019-math-facets
        name: eawf019-math-facets
        entry: uv run eawf hook eawf019-math-facets
        language: system
        # EAWF019 over staged .json math-explainer docs: validates each as a
        # typed MathExplainer (non-matching JSON is skipped) and flags a claim
        # missing the runnable-example facet, a citation that resolves to no
        # row, a pytest example gate the runner would not collect (the kappa
        # silent-skip regression), or a malformed formula. The gate-runner owns
        # correctness; this is the structure/binding layer.
        files: '\.json$'
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-prose
        name: validate-prose
        entry: uv run eawf hook validate-prose
        language: system
        # The Layer-2 prose chokepoint: composes EAWF013 (bracket position),
        # EAWF014 (no-manual-wrap) and EAWF017 (inline-reference tabulation)
        # over the staged .md delta. Fail-OPEN locally (no --strict): findings
        # are advisory and the gate exits 0, so the operator is never blocked
        # at commit time. tests/lint/test_prose_gate_clean.py runs the strict
        # pass over the branch delta.
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: ste-prose
        name: ste-prose
        entry: uv run python -m eawf.platform.lint.ste_prose
        language: system
        # Advisory Simplified Technical English lint over the rule modules,
        # the profiles and the skill bodies: sentence length and semicolons.
        # It always exits 0, so verbose output is how its findings surface.
        files: '^src/eawf/(platform/(rules/data/modules|profiles/data)/.*\.yaml|surfaces/render/skills/registry\.py)$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: idle-contract-gate
        name: idle-contract-gate
        entry: uv run python tools/idle_contract_gate.py --cached
        language: system
        # Guards the B091 idle-verifier regression: fails when a verifier
        # ships with no live caller. Also proves the runtime close gate
        # remains bound to this always-run hook. Mutates nothing -- so
        # always-run with no file filter.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: skill-prose-symbol-gate
        name: skill-prose-symbol-gate
        entry: uv run python tools/skill_prose_symbol_gate.py
        language: system
        # Prose-vs-symbol drift oracle for the frozen skill registry: parses
        # every per-skill body string in
        # src/eawf/surfaces/render/skills/registry.py and asserts each dotted
        # module.attr / slash-form module reference it names imports
        # (importlib) and each src/eawf path it names exists. A drifted
        # reference (a renamed/moved symbol the prose still cites, a deleted
        # path) fails the commit naming the offending token + the carrying
        # skill. The matcher is conservative: bare prose nouns, --flags, and
        # slash-joined option phrases are skipped (no false positive). Reads
        # the live registry in-process and mutates nothing — so always-run
        # with no file filter. BLOCKS: a drifted reference fails the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: sigil-totality
        name: sigil-totality
        entry: uv run eawf hook sigil-totality
        language: system
        # Proves the reskin's two-axis visual vocabulary is TOTAL: every status
        # enum value the TUI renders (plus the lifecycle FSM terminals) resolves
        # through the single resolver (status_sigil) to a real ratified glyph --
        # never a bare .value word, never a '?' fallthrough. Sweeps a fixed enum
        # surface in-process, builds no widget, and mutates nothing -- so
        # always-run with no file filter. BLOCKS: a dropped resolver row fails
        # the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: eawf023-artifact-placement
        name: eawf023-artifact-placement
        entry: uv run eawf hook eawf023-artifact-placement
        language: system
        # EAWF023 over the whole git-tracked .ea/artifacts/**/*.md tree:
        # every durable artifact must live under its canonical kind
        # sub-directory (audits/, research/, incidents/, ...) and lead with
        # a YYYY-MM-DD- date stem. A pre-convention legacy baseline is
        # grandfathered so the clean tree passes; a NEW misplaced or
        # date-stem-less artifact reds the commit. Scans the full tracked
        # tree (not a staged delta) so a misfiled artifact is caught
        # regardless of which files the commit touched -- so always-run with
        # no file filter. BLOCKS: a violation fails the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: eawf026-settings-categories
        name: eawf026-settings-categories
        entry: uv run eawf hook eawf026-settings-categories
        language: system
        # EAWF026: every configuration catalog section is filed under exactly
        # one of the six settings categories, so none is unreachable from the
        # Settings rail. Runs when the catalog or the category table changes.
        files: ^src/eawf/kernel/(config/registry/|projection/settings\.py)
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf027-citation-scope
        name: eawf027-citation-scope
        entry: uv run eawf hook eawf027-citation-scope
        language: system
        # EAWF027: no committed artifact, rendered document or rule projection
        # (and not the local proposal packet, where present) quotes a
        # reflection row marked non-quotable or unmarked, or a scrubbed_extract
        # session title. Scans the whole scope, so it runs on any text change.
        files: \.(md|txt|json|ya?ml)$
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf028-brief-immutable
        name: eawf028-brief-immutable
        entry: uv run eawf hook eawf028-brief-immutable
        language: system
        # EAWF028: a staged edit to a committed research brief may repair its
        # format (rewrap, whitespace, line endings, fence tags, table pipes)
        # but not its wording; a wording change is refused as brief_immutable
        # with the superseding-brief remediation. Reads the index against
        # HEAD, so it runs only when a brief is staged. BLOCKS.
        files: ^\.ea/artifacts/research/.*\.md$
        pass_filenames: false
        stages: [pre-commit]
      - id: emitted-page-execution
        name: emitted-page-execution
        entry: uv run pytest -q -p no:randomly tests/integration/observability/reflect/test_emitted_page_execution.py
        language: system
        # A change to the exported reflection page runs its scripts against
        # real exported data in a minimal DOM (Node, no browser) and fails on
        # a thrown, rejected or logged error or on a page that draws nothing.
        files: ^(src/eawf/observability/reflect/|tests/integration/observability/reflect/)
        pass_filenames: false
        stages: [pre-commit]
      - id: eawf024-test-tier-contract
        name: eawf024-test-tier-contract
        entry: uv run eawf hook eawf024-test-tier-contract
        language: system
        # EAWF024 over the whole git-tracked tests/unit/**/*.py tree: a
        # unit-tier test must not import subprocess, textual, or CliRunner
        # (each marks a slower integration/TUI test mislabeled into the unit
        # tier). A deliberate fixture may carry a line-level '# noqa: EAWF024'
        # waiver. Scans the full tracked unit tree (not a staged delta) so a
        # mislabeled test is caught regardless of which files the commit
        # touched -- so always-run with no file filter. BLOCKS: a violation
        # fails the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: eawf025-test-placement
        name: eawf025-test-placement
        entry: uv run eawf hook eawf025-test-placement
        language: system
        # EAWF025 over the tests/ paths THIS commit adds (git diff --cached
        # --diff-filter=A): a new test lands under
        # tests/<kind>/<source-package-path>/ with a declared TestKind as its
        # first segment and a real src/eawf package as its mirror chain, and
        # no subject is filed under two kinds at once. Diff-scoped so the
        # per-commit cost stays proportional to the delta; the whole-tree
        # sweep now runs as a test (tests/platform/lint, -k
        # placement_whole_tree) since the subsystem shadow trees were
        # collapsed into the taxonomy. Reads the staged index itself, so no
        # file filter -- always-run with pass_filenames off. BLOCKS: a
        # violation fails the commit.
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: plugin-doctor-drift
        name: plugin-doctor-drift
        entry: uv run eawf hook plugin-doctor-drift
        language: system
        # Conditional skip on the branch diff (git diff origin/main...HEAD):
        # bails fast unless it touches AGENTS.md, a skill, a runtime, or
        # build/ (drops ~5s → ~50ms on no-op pushes).
        pass_filenames: false
        stages: [pre-push]
