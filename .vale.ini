# Vale config for the eawf doc-clarity prose linter (EAWF Layer 2).
#
# Vale lints prose the way ruff lints Python. ``eawf hook vale-prose``
# subprocesses ``vale --output=JSON <file>`` and emits the findings through
# the same static-lint envelope as the EAWF Python lints, so Vale inherits
# eawf's path-scoping and output format. The ``vale`` binary plus a one-time
# ``vale sync`` (to fetch the Google package into ``StylesPath``) are the
# prerequisite; when the binary is absent the wrapper fails open.
#
# StylesPath holds downloaded packages (Google) plus the local custom ``eawf``
# style checked into ``.vale/styles/eawf/``. The Google package is fetched by
# ``vale sync`` and is gitignored; the ``eawf`` style is committed.
StylesPath = .vale/styles
# Only errors are emitted. The chokepoint's strict mode is fail-closed on ANY
# finding, so a level below `error` is not advice — it is a merge blocker
# wearing an advisory label. Vale's warning and suggestion tiers stay
# authorable-but-unenforced: run `vale --minAlertLevel=suggestion <path>` by
# hand to read them.
MinAlertLevel = error
Vocab = eawf
Packages = Google

[*.md]
BasedOnStyles = Vale, Google, eawf

# Never lint code spans, dense ``[N]`` citation markers, eawf URNs, or bare
# snake_case identifiers as prose. A ``[N]`` marker, an inline ``path:line`` in
# backticks, a ``urn:eawf:...`` reference, and a field name like ``scope_id``
# are structural, not English — and a field name is not made English by an
# author forgetting the backticks around it.
TokenIgnores = (`[^`]+`), (\[\d[^\]]*\]), (urn:eawf:[^\s)]+), ([A-Za-z][A-Za-z0-9]*(?:_+[A-Za-z0-9]+)+_*)

# Skip the whole ``## References`` block — those rows are intentionally
# path / URL dense and are owned by EAWF013 + the citation-resolution
# validator, not by the prose rules.
BlockIgnores = (?sm)^## References$.*?(?=^## |\z)

# Google-package rules switched off for this corpus. Every one below was
# judged against its actual findings on this repo's Markdown, not switched off
# to make a number go down; the rest of the package stays on. The corpus is
# research briefs, release history, agent system prompts, and machine-rendered
# reference pages — not end-user product documentation, which is what the
# Google developer-documentation style guide is written for.

# The spaced em dash is this repo's house punctuation: AGENTS.md, every
# docs/rules page, and every changelog entry use it. The rule fired 307 times,
# every one of them on the house style applied correctly.
Google.EmDash = NO

# ``e.g.`` and ``i.e.`` are the register the committed rule text is written in,
# so the rule reds bytes the profile renderer emits by design.
Google.Latin = NO

# US typographic quoting drags the comma inside the quotation marks. This repo
# quotes literal tokens, where a swallowed comma reads as part of the token.
Google.Quotes = NO

# Wants a nonbreaking space inside a duration like ``272s``. In prose read in a
# terminal and in ``git log`` that is worse than the closed form, and it puts a
# U+00A0 into files the ASCII lints reject.
Google.Units = NO

# Cannot tell an ``-ly`` adverb from a noun that ends in ``ly``: it reports
# ``supply-chain`` for the same reason it reports ``previously-``. The real
# instances it caught are fixed at their sources in this change.
Google.LyHyphens = NO

# Reads a dotted symbol path (``common.QualityDimension``) as a sentence
# boundary missing its space.
Google.Spacing = NO
