name: Console replay

# The console golden contract -- 261 frames and 25 journeys -- is evidence that
# decays the moment nothing replays it. Every pull request replays it, whatever
# paths it touches, so a change that moves the chassis, the fixture or the
# normalisation map learns it broke the contract before it lands. A push runs
# nothing here: the pull request that carried the change already replayed it,
# and the nightly twice-green run replays the whole TUI snapshot tier.
on:
  pull_request:

concurrency:
  group: console-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-replay:
    name: Console golden contract replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Pytest (console golden frames and journeys)
        # Single-process on purpose: the contract's ordering rule is that the 25
        # journeys replay before the 261 frames in ONE app instance, so the frames
        # prove the reset as well as the render. Sharding the parametrised cases
        # across xdist workers would give each worker its own app and quietly
        # weaken that to a per-worker reset.
        run: >
          uv run pytest -p no:xdist
          tests/snapshots/tui/console/test_golden_frames.py
          tests/snapshots/tui/console/test_golden_journeys.py
          tests/snapshots/tui/console/test_normalisation_map.py
