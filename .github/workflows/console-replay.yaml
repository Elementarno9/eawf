name: Console replay

# The console golden contract -- 261 frames and 25 journeys -- is evidence that
# decays the moment nothing replays it. ci.yaml calls this workflow on every
# pull request ready for review, so the replay reports under the ci-ok verdict
# and the CI concurrency group instead of as a separate pull request workflow.
on:
  workflow_call:

jobs:
  console-replay:
    name: Console golden contract replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Pytest (console golden frames and journeys)
        # Single-process on purpose: the contract's ordering rule is that the 25
        # journeys replay before the 261 frames in ONE app instance, so the frames
        # prove the reset as well as the render. Sharding the parametrised cases
        # across xdist workers would give each worker its own app and quietly
        # weaken that to a per-worker reset. ci.yaml calls this workflow only
        # for a pull request ready for review, the full configuration, whose
        # marker expression is "not eval"; none of these modules wears either
        # marker, so it deselects nothing here.
        run: >
          uv run pytest -m "not eval" -p no:xdist
          tests/snapshots/tui/console/test_golden_frames.py
          tests/snapshots/tui/console/test_golden_journeys.py
          tests/snapshots/tui/console/test_normalisation_map.py
