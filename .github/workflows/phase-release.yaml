name: Phase Release

# phase-release.yaml ships: post-merge per-phase release check. Reads a
# phase-close commit subject annotation like ``(release=v0.4.0)``, verifies the
# source version matches, and prints the ``eawf release tag --push`` command.
# It pushes no tag: a tag pushed with this job's token starts no workflow run,
# so release.yaml and plugin-release.yaml would never publish it.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: phase-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  phase-release:
    name: Check phase release annotation
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Extract release annotation
        id: annotation
        # The annotation grammar carries PEP 440 dev segments as well as
        # the a / b / rc prereleases: the v0.7 train ships ``0.7.0.dev1``
        # through ``0.7.0.dev4`` before its first release candidate, and
        # a regex that stopped at ``rcN`` would read every dev-checkpoint
        # merge as "no release annotation" and silently skip the tag.
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s "$MERGE_SHA")"
          python - "$subject" <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys

          subject = sys.argv[1]
          match = re.search(
              r"\(release=(v\d+\.\d+\.\d+(?:a\d+|b\d+|rc\d+)?(?:\.dev\d+)?)\)", subject
          )
          if match is None:
              print("release_required=false")
              raise SystemExit(0)
          print("release_required=true")
          print(f"tag={match.group(1)}")
          print(f"version={match.group(1)[1:]}")
          PY

      - name: Stop when PR has no release annotation
        if: steps.annotation.outputs.release_required != 'true'
        run: echo "no (release=vX.Y.Z) annotation; skipping phase release"

      - name: Verify version source matches annotation
        if: steps.annotation.outputs.release_required == 'true'
        # Compares the NORMALISED forms rather than the raw strings. PEP
        # 440 spells one version several ways -- ``0.7.0-dev1``,
        # ``0.7.0_DEV1`` and ``0.7.0.dev1`` are the same release, and
        # ``0.7.0.dev01`` is the same as ``0.7.0.dev1`` -- so a literal
        # comparison can red a tag whose source module agrees with it.
        # Normalising both sides is the only comparison that answers the
        # question actually being asked: do these name one version?
        env:
          EXPECTED_VERSION: ${{ steps.annotation.outputs.version }}
        run: |
          set -euo pipefail
          python - "$EXPECTED_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path


          def normalise(version: str) -> str:
              """Return the canonical PEP 440 spelling of *version*."""
              text = version.strip().lower().removeprefix("v")
              text = re.sub(r"[-_.]+", ".", text)
              text = re.sub(r"\.(a|b|rc|dev)", r"\1", text)
              text = re.sub(r"(a|b|rc|dev)\.?0*(\d+)", r"\1\2", text)
              return text.replace("dev", ".dev")


          expected = sys.argv[1]
          text = Path("src/eawf/_version.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, flags=re.MULTILINE)
          if match is None:
              raise SystemExit("no __version__ assignment in src/eawf/_version.py")
          actual = match.group(1)
          if normalise(actual) != normalise(expected):
              raise SystemExit(
                  f"version mismatch: annotation={expected} ({normalise(expected)}) "
                  f"source={actual} ({normalise(actual)})"
              )
          print(f"version source agrees with the annotation: {normalise(actual)}")
          PY

      - name: Print the release tag command
        if: steps.annotation.outputs.release_required == 'true'
        # The operator tags from a clean checkout of the merge commit: the
        # verb sweeps readiness before it tags, and a push made with the
        # operator's own credentials is what starts the publish workflows.
        # No release object is made here either. plugin-release.yaml creates
        # or edits it with the prerelease flag, where one made here would
        # advertise a dev tag as the latest release. The notice lands on the
        # run page because nothing publishes until the tag is pushed.
        env:
          VERSION: ${{ steps.annotation.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          command="eawf release tag ${VERSION} --push"
          echo "::notice title=Tag the phase release::Nothing is published yet. From a clean checkout of ${MERGE_SHA}, run: ${command}"
          {
            echo "## Tag the phase release"
            echo
            echo "Nothing is published yet. From a clean checkout of the merge commit \`${MERGE_SHA}\`, run:"
            echo
            echo '```'
            echo "${command}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
