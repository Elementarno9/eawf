name: Release

# Release pipeline. The build + wheel-size gate + ``twine check`` run on
# tag push and manual dispatch (dry-run); the PyPI publish job is live,
# gated behind an explicit tag-push condition so ``workflow_dispatch``
# dry-runs never publish. Publishing uses the ``pypi-publish``
# trusted-publisher environment (OIDC, no API token) — the environment
# and its PyPI trusted-publisher binding must exist in the repo settings
# for the publish job to authenticate.

on:
  push:
    # ``v*``, matching plugin-release.yaml. The narrower ``v0.*`` this
    # replaces silently skipped every tag outside the 0.x line: a
    # ``v1.0.0`` tag fired the plugin publish and not this one, shipping
    # the plugin to npm while the Python package was never built.
    tags:
      - "v*" # v0.3.0a1, v0.3.0rc1, v0.3.0, v1.0.0
  workflow_dispatch:
    inputs:
      channel:
        description: "alpha | beta | rc | stable"
        required: true
        default: alpha

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel + sdist (dry-run)
    # Needs the receipt job because the digests this job uploads must be
    # the ones the reproducible-build receipt attests: a dry-run receipt
    # only lets a manifest be frozen before the tag if the tag build
    # reproduces it byte for byte.
    needs: [inventory-and-reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Pin SOURCE_DATE_EPOCH to the tagged commit
        # The archive members' mtimes are the wall clock unless this is
        # set, so an unpinned build never matches the receipt. The value
        # is read the way the receipt producer reads it -- the commit's
        # own committer time -- and exported for every later step.
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "${SHA}")"
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${epoch} (${SHA:0:10})"

      - name: Build wheel + sdist
        run: uv build --out-dir dist

      - name: Wheel-size gate (templates bundled + size ceiling)
        # Asserts (a) the per-OS service templates land inside the wheel
        # under ``eawf/_data/service_templates/`` and (b) the wheel stays
        # under the ``[tool.eawf.bundle] wheel_max_bytes`` ceiling. Same
        # assertions as ``tests/integration/test_packaging.py`` but run against
        # the release build so a packaging regression reds the pipeline.
        run: uv run pytest -q tests/integration/test_packaging.py

      - name: Validate dist (twine check)
        # Gate the artifacts on ``twine check`` before they can be
        # published: catches malformed METADATA / unrenderable long
        # descriptions that PyPI would otherwise reject at upload. Runs
        # in build-wheel, which is a ``needs:`` of publish-pypi, so it
        # always runs before publish.
        run: uvx twine check dist/*

      - name: Fresh-install smoke (runtime deps only)
        # Install the freshly built wheel with RUNTIME deps only (no dev
        # group, mirroring a published `uv tool install eawf`) and run the
        # CLI. A runtime module importing a dev-only dependency — the bug that
        # broke v0.5.2's `uv tool install` with a `hypothesis` import — reds
        # the build here, before publish-pypi (which `needs: build-wheel`)
        # can ship the broken artifact.
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --version
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --help >/dev/null
          uv run --no-project --with "${wheel}" --python 3.14 -- python -c \
            "import eawf.surfaces.cli, eawf.workflow.audit_dsl.registry; print('runtime import closure OK')"

      - name: Download the reproducible-build receipt
        # Into the runner's temp dir, never the workspace: the sdist
        # archives every unignored file in the tree, and ``dist/`` is
        # what twine checks and the publish job uploads.
        uses: actions/download-artifact@v4
        with:
          name: reproducible-build-receipt
          path: ${{ runner.temp }}/build-receipt

      - name: Assert the build reproduces the receipt digests
        # Last step before the upload, so the digests compared are the
        # bytes that leave this job. A wheel or sdist that differs from
        # the receipt reds the build here, before publish-pypi can ship
        # an artifact no frozen manifest describes.
        env:
          RECEIPT: ${{ runner.temp }}/build-receipt/reproducible-build-receipt.json
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import sys
          from pathlib import Path

          from eawf.workflow.release.reproducibility import (
              ReproducibleBuildReceipt,
              digest_build_output,
          )

          receipt = ReproducibleBuildReceipt.model_validate_json(
              Path(os.environ["RECEIPT"]).read_text(encoding="utf-8")
          )
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          built = digest_build_output(Path("dist"), attempt=1, source_date_epoch=epoch)
          problems = []
          if receipt.source_sha != os.environ["SHA"]:
              problems.append(f"receipt is for {receipt.source_sha}, not {os.environ['SHA']}")
          if receipt.source_date_epoch != epoch:
              problems.append(f"receipt pins epoch {receipt.source_date_epoch}, build used {epoch}")
          if not receipt.reproduced:
              problems.append(f"receipt did not reproduce: {list(receipt.divergent_artifacts)}")
          expected = {a.filename: a.sha256 for a in receipt.attempts[-1].artifacts}
          actual = {a.filename: a.sha256 for a in built.artifacts}
          for name in sorted(set(expected) | set(actual)):
              if expected.get(name) != actual.get(name):
                  problems.append(f"{name}: receipt {expected.get(name)} != built {actual.get(name)}")
          if problems:
              print("build does not reproduce the receipt:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          for name, digest in sorted(actual.items()):
              print(f"{digest}  {name}")
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  require-green-ci:
    name: Require green CI on the tagged commit
    # Closes the gap that let v0.5.2 publish while its CI run was red: the
    # publish job below `needs:` this gate, which refuses to proceed unless
    # a push-event ci.yaml run from this repository concluded `success` on
    # this exact commit, or on another commit with the same tree whose run
    # recorded that tree as green (ci.yaml's green-tree job). The release
    # commit lands on `main` (where ci.yaml runs) before the tag is pushed,
    # so a CI run for the SHA already exists or is in flight.
    #
    # Reading only the newest run for the SHA let a cancelled run hide a
    # green one and never counted a green run on an identical tree, which
    # cost a full CI rerun per release. The tree relaxation is sound only
    # for push runs: a pull request run tests a merge of the head into the
    # base, not the tree the tag names, so the checker never accepts one.
    # The checker is tools/ci_green_tree.py, shared by both release
    # workflows; it waits while a push run on the SHA is in flight or not
    # yet created, and refuses once they all finished without success. A
    # `workflow_dispatch` dry-run skips this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Above the checker's 30-min wait for an in-flight CI run, so the job's
    # own timeout never fires before its internal deadline.
    timeout-minutes: 35
    permissions:
      actions: read # list the CI workflow's green runs and their tree records
      contents: read # check out the checker and the tagged tree
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert ci.yaml went green on ${{ github.sha }} or its tree
        # The runner's system Python: the checker is stdlib-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_green_tree.py gate

  release-preflight:
    name: Release preflight (tag chokepoint)
    # Closes the bypass the tag itself opens: `eawf release tag --push`
    # runs the readiness sweep before it pushes, but a tag pushed by hand
    # reaches the publish job below by the same route with nothing
    # checked. This job runs the SAME sweep — version consistency, the
    # changelog section, the migration outcome, ancestry against the
    # remote branch, tree cleanliness — against the tagged commit, and
    # `publish-pypi` needs it, so a red sweep exits non-zero and nothing
    # is published. Scoped to the tag push because the tag is what it
    # sweeps; a `workflow_dispatch` dry-run skips it and cannot publish
    # either.
    #
    # `needs:` the receipt producer and downloads its three artifacts:
    # the `artifacts` and `dependencies` rows are read back off
    # `dist/release-receipts/`, so without them the sweep reports both
    # `unavailable` and — since only `pass` clears a required row —
    # could never green, which made `publish-pypi` unreachable.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [inventory-and-reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + all remote-tracking branches: the ancestry
          # signal proves the tagged commit is reachable from
          # `origin/<source_branch>`, which a shallow checkout cannot show.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Download the release receipts
        # Into the path the sweep reads: `RECEIPT_DIRNAME` is
        # `dist/release-receipts`, and each artifact carries one file.
        uses: actions/download-artifact@v4
        with:
          pattern: "{dependency-manifest,vulnerability-report,reproducible-build-receipt}"
          path: dist/release-receipts
          merge-multiple: true

      - name: eawf release preflight for the pushed tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run eawf release preflight "${TAG#v}" --source "${SHA}"

  install-smoke:
    name: Install-smoke (uv tool install from wheel)
    needs: build-wheel
    # End-to-end install gate: unlike the in-build `Fresh-install smoke` step
    # (which `uv run --with`s the wheel into an ephemeral venv), this job does a
    # real `uv tool install` from the built wheel into an isolated tool env,
    # then exercises the operator's first-run path — `eawf --help` plus a full
    # `eawf init` in a scratch dir. It catches console-script / entry-point /
    # data-bundle breakage that only surfaces under a true install, before
    # `publish-pypi` (which `needs:` this job) can ship the artifact. Runs on
    # both tag-push and `workflow_dispatch` dry-runs so a broken install reds
    # the pipeline early.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: uv tool install from the built wheel
        run: |
          set -euo pipefail
          wheel="$(ls "${GITHUB_WORKSPACE}"/dist/*.whl)"
          echo "installing ${wheel}"
          uv tool install --python 3.14 "${wheel}"
          # Put the installed `eawf` console script on PATH for later steps.
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: eawf --help (console script resolves)
        run: |
          set -euo pipefail
          eawf --help >/dev/null
          eawf --version
          echo "eawf --help OK"

      - name: eawf init in a scratch dir (first-run path)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "${tmp}"
          git init -q .
          eawf --no-input init --project-code DEMO --target "${tmp}"
          test -f "${tmp}/.ea/state.json"
          echo "eawf init produced .ea/state.json OK in ${tmp}"

  inventory-and-reproducibility:
    name: Dependency inventory + reproducible-build receipt
    # Produces the three facts the readiness sweep cannot compute for
    # itself: the lock-derived dependency inventory with each package's
    # license, the pip-audit report over the exported lock, and a
    # double-build receipt proving the tagged commit rebuilds to the same
    # wheel and sdist digests. The sweep reads all three back from these
    # artifacts, so `dependency_inventory`, `security_review` and
    # `artifact_reproducibility` report `unavailable` when this job did
    # not run -- and `publish-pypi` needs it, so it always does.
    #
    # Runs on both tag-push and `workflow_dispatch` dry-runs: the dry-run
    # is how the receipts are inspected before a tag exists.
    runs-on: ubuntu-24.04
    # Two clean `uv build` runs plus a network advisory query.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: SOURCE_DATE_EPOCH is the tagged commit's own
          # committer timestamp, which a shallow checkout cannot read.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        # Frozen, because the inventory describes `uv.lock`: a sync that
        # re-resolved would inventory a resolution nobody locked.
        run: uv sync --frozen

      - name: Produce the inventory, the audit and the build receipt
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run python -m eawf.workflow.release.produce --source-sha "${SHA}"

      - name: Upload dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: dependency-manifest
          path: dist/release-receipts/dependency-manifest.json

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: dist/release-receipts/vulnerability-report.json

      - name: Upload reproducible-build receipt
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-build-receipt
          path: dist/release-receipts/reproducible-build-receipt.json

  publish-pypi:
    name: Publish to PyPI
    needs:
      [
        build-wheel,
        require-green-ci,
        release-preflight,
        install-smoke,
        inventory-and-reproducibility,
      ]
    # Live publish, gated behind an explicit condition: only a real
    # ``v0.*`` tag push publishes. ``workflow_dispatch`` dry-runs build +
    # validate but never reach this job. Requires the ``pypi-publish``
    # trusted-publisher environment to be configured in the repo settings.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi-publish
    permissions:
      id-token: write # PyPI trusted-publisher OIDC; no API token in repo secrets
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Write the PyPI publication receipt
        # The publisher is this pipeline, not the daemon: the runner is
        # gone by the time anyone asks what happened, so the leg writes
        # its own word down before it exits. ``release.reconcile`` maps
        # ``job_conclusion`` onto reported_success / reported_failure /
        # unknown -- never an observed state, which takes an independent
        # read-back. Written on failure too, because the failing case is
        # the one the ledger needs help with.
        if: always()
        env:
          TARGET_ID: pypi
          RECEIPT_VERSION: ${{ github.ref_name }}
          JOB_CONCLUSION: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target_id = os.environ["TARGET_ID"]
          # Only what PyPI serves: the publish action writes a
          # ``.publish.attestation`` beside each dist, and a receipt that
          # digests those names files no frozen manifest carries.
          digests = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in sorted(Path("dist").glob("*"))
              if path.is_file() and path.name.endswith((".whl", ".tar.gz"))
          }
          receipt = {
              "target_id": target_id,
              # The tag is ``v0.7.0.dev1``; the checkpoint is what
              # follows the ``v``, which is the spelling PyPI carries.
              "version": os.environ["RECEIPT_VERSION"].removeprefix("v"),
              "artifact_digests": digests,
              "job_conclusion": os.environ["JOB_CONCLUSION"],
              "run_id": os.environ["RUN_ID"],
          }
          out = Path(f"publication-receipt-{target_id}.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload the PyPI publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt-pypi
          path: publication-receipt-pypi.json
