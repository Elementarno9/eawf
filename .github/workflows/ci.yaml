name: CI

on:
  push:
    branches: [main, release, "release/**"]
  pull_request:
  # The nightly and hand-started runs carry the twice-green proof between
  # pushes. GitHub fires a schedule on the default branch only.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # The event name keeps a nightly or dispatched run on main out of the push
  # group, so a merge to main and the nightly run never cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes since the last green tree
    # A push that only edits .secrets.baseline leaves the code tree exactly
    # as it was when CI last went green, and re-running the matrix and
    # twice-green on it costs about half an hour proving nothing new. This
    # job compares the checkout with the last green ci.yaml run on the same
    # ref and exposes code=false only for that one bookkeeping path; every
    # other path, including .ea/state.json and the .ea/store/ ledgers,
    # writes code=true, because the .ea/ commit-policy census reads exactly
    # those paths and needs the suite that carries it to run whenever they
    # change. The green output names the green commit it compared against,
    # which the green-tree job records as the tree a skipped run inherits.
    # It must stay unconditional: every lookup failure fails open to
    # code=true inside the tool, and a scheduled or dispatched run, which
    # has no diff to classify, always reports code=true. The heavy jobs
    # below also fail open at the job level -- their conditions still run
    # them when this job itself did not conclude success -- so a classifier
    # crash cannot read as a passing required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # list this workflow's green runs
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      green: ${{ steps.classify.outputs.green }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        # The runner's system Python: the tool is stdlib-only, so the job
        # needs no uv install or dependency sync.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_changes.py

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    needs: changes
    # Skipped only when the changes job concluded successfully and proved
    # the code tree is the one the last green run tested; !cancelled() keeps
    # this condition evaluating (instead of the default auto-skip-on-
    # dependency-failure) when the changes job itself failed, so a
    # classifier crash runs the full matrix rather than reading as a
    # passing required check.
    if: >-
      !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install resvg (pinned, T5 SVG pixel-diff oracle)
        # Ubuntu-only: coverage + the T5 svg_pixel_diff pixel-diff leg run on
        # the ubuntu leg alone, so the pinned renderer is installed there. On
        # the macOS leg the ~8 resvg-oracle tests skip cleanly via their
        # ``shutil.which("resvg")`` guards (tests/snapshots/svg/*.py and
        # tests/integration/test_p30_i20_w17.py).
        if: startsWith(matrix.os, 'ubuntu-')
        # CI tool manifest pin for the svg_pixel_diff audit-DSL kind.
        # resvg renders bit-identically across hosts once fonts are
        # vendored + system fonts disabled, so the golden PNGs under
        # tests/snapshots/svg/golden/ are compared by exact bytes. A
        # version bump here is a GOLDEN-REFRESH event: regenerate the
        # committed goldens (eawf vfl approve) whenever this pin moves.
        run: cargo install resvg --version 0.45.1 --locked

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Deptry
        run: uv run deptry .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest (parallel)
        # Coverage is collected on the ubuntu leg only: the ${{ }} expression
        # appends the --cov flags on ubuntu and an empty string on macOS, so
        # the macOS leg runs the identical suite without coverage.
        run: uv run pytest -n auto --ignore=tests/snapshots/tui --ignore=tests/perf/surfaces/tui --ignore=tests/perf/surfaces/cli ${{ startsWith(matrix.os, 'ubuntu-') && '--cov=eawf --cov-report=xml --cov-fail-under=0' || '' }}
      - name: Pytest (TUI render snapshots)
        # Four workers, not serial: each test builds its own event loop and
        # offscreen driver inside app.run_test(), so there is no shared
        # terminal to contend over. Measured 231s serial vs 90s at -n 4 over
        # three consecutive green runs. Four rather than `auto` so a
        # small-core runner does not thrash.
        # Same ubuntu-only coverage gating; --cov-append extends the parallel
        # leg's data file on ubuntu, macOS runs the suite without --cov.
        # The console golden contract is ignored here and owned by
        # console-replay.yaml: it must replay 25 journeys then 261 frames in one
        # app instance, so sharding it over four workers would give each worker
        # its own reset and prove less than the dedicated single-process job.
        run: uv run pytest -n 4 tests/snapshots/tui --ignore=tests/snapshots/tui/console ${{ startsWith(matrix.os, 'ubuntu-') && '--cov=eawf --cov-append --cov-report=xml --cov-fail-under=0' || '' }}
      - name: Pytest (serial perf timing)
        # Stays serial on purpose: these assert p99 latency and a cold-import
        # wall-time ceiling, so a contended machine changes the number being
        # measured.
        run: uv run pytest -n0 tests/perf/surfaces/tui tests/perf/surfaces/cli ${{ startsWith(matrix.os, 'ubuntu-') && '--cov=eawf --cov-append --cov-report=xml --cov-fail-under=0' || '' }}

      - name: Telemetry sync (REL-009)
        # Telemetry ingestion is on by default, so CI must prove the sync
        # actually lands rows: an off-by-default projector produced empty
        # cohorts and made every duration distribution unusable. The
        # session_count and duration-p50 assertions live inside the named
        # test rather than as inline shell here, so a local run reproduces
        # the CI signal exactly.
        #
        # Sunset review: KEEP. A gate that never fires is retired at phase
        # close, and this one is the exception that earns its slot -- the
        # empty-cohort regression it guards is silent (green suite, unusable
        # numbers), so the only evidence it is still working is that it runs.
        # Its fire proof is tests/integration/test_metrics_cli.py, which reds
        # on an ingestion path that writes no rows. Reviewed and kept; the
        # companion review row is tests/lint/test_gate_sunset_review.py.
        run: uv run pytest -n0 tests/integration/test_metrics_cli.py

      - name: Coverage gate (per-package C09 §5.2 + TUI behavioural floor)
        # Ubuntu-only: coverage.xml is produced on the ubuntu leg alone. The
        # per-package line/branch ratchet + the TUI behavioural-count floor
        # live in tools/coverage_gate.py, driven by ``[tool.eawf.coverage]``;
        # the overall fail_under floor is enforced by the next step.
        if: startsWith(matrix.os, 'ubuntu-')
        run: uv run python tools/coverage_gate.py

      - name: Coverage floor (overall >=60)
        if: startsWith(matrix.os, 'ubuntu-')
        run: uv run coverage report

  tool-install-smoke:
    name: Fresh tool-install smoke (runtime deps only)
    # The `test` matrix above always syncs the dev dependency-group, so its
    # tests are structurally blind to a runtime module importing a dev-only
    # dependency. A published `uv tool install eawf` gets RUNTIME deps only,
    # so such an import crashes the installed CLI at startup while CI stays
    # green (this is exactly how v0.5.2 shipped a `hypothesis` import that
    # broke `uv tool install`). This job builds the wheel and exercises the
    # CLI in a runtime-only environment so that class of break reds the PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Smoke the wheel with runtime deps only
        # `--no-project` ignores this repo's dev dependency-group; `--with
        # <wheel>` installs the wheel plus its DECLARED runtime deps into an
        # ephemeral env — the same dependency closure `uv tool install` sees.
        # Importing the CLI app + the audit-DSL registry (which eagerly binds
        # every check-kind at startup) reds here if any runtime module reaches
        # for a dependency that is not in `[project.dependencies]`.
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          echo "smoke-testing wheel: ${wheel}"
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --version
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --help >/dev/null
          uv run --no-project --with "${wheel}" --python 3.14 -- python -c \
            "import eawf.surfaces.cli, eawf.workflow.audit_dsl.registry; print('runtime import closure OK')"

  snapshot-pairing:
    name: Snapshot pairing gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Snapshot pairing gate
        run: uv run python tools/snapshot_pairing_gate.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  requirement-trace:
    name: Requirement trace census (value-fresh)
    # Recomputes the per-id requirement trace from the committed catalog,
    # state and source, and fails when the stored census differs in value.
    # The proposal packet the ids come from is not committed, so this job
    # never re-extracts; the catalog is its input.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Requirement trace check
        run: uv run python tools/requirement_trace.py check

  skill-eval:
    name: Skill envelope evals
    # The eval marker is excluded from the default pytest run, so without
    # this job a skill whose envelope drifts from its golden stays green.
    # The cases compare envelope structure against committed goldens and
    # call no model, so the job is deterministic and cheap enough to run
    # on every push.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Skill envelope evals
        run: uv run pytest tests/eval/test_skill_eval.py -m eval -q

  linux-jail:
    name: Linux jail real-bwrap launch
    # The `test` matrix runs on hosts WITHOUT bubblewrap, so every real-jail
    # case skips there and the Linux backend is only ever checked by argv
    # shape. That is how a prefix that bwrap refuses to launch (a tmpfs mask
    # over an absent cred dir, a $TMPDIR pinned to a macOS-only path) stayed
    # green while the jail was dead on Linux. This job installs real
    # bubblewrap so the launch tests EXECUTE against the kernel.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install bubblewrap
        # bwrap needs an unprivileged user namespace; Ubuntu 24.04 restricts
        # those by default via AppArmor, so the sysctl is relaxed for the job
        # (best-effort: on a runner image that already permits it the write
        # fails harmlessly). The version echo makes the installed binary
        # visible in the log when a launch assertion fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Pytest (real-bwrap jail launch)
        # Serial (-n0) and coverage-free: this is the focused sandbox gate,
        # not a suite re-run. The whole sandbox set runs so the argv-shape,
        # env-scrub TMPDIR and sunset cases are checked on the same host that
        # executes the real launch.
        run: >
          uv run pytest -n0 --no-cov
          tests/integration/runtime/sandbox/test_jail.py
          tests/unit/runtime/sandbox/test_jail_expiry.py
          tests/unit/runtime/sandbox/test_env_scrub.py

  twice-green:
    name: Full suite green twice from a fresh checkout
    # The `test` matrix runs the suite ONCE, so a test that only fails when
    # it inherits state from an earlier run -- a leaked runtime dir, a
    # cached daemon socket, a lockfile another run left behind -- is
    # invisible there. This job runs `just test-all` twice back to back on
    # one fresh checkout and requires both to exit 0, which is what REL-026
    # means by reproducibly green. The two runs are separate steps on
    # purpose: GitHub fails the job on the first non-zero step, so each
    # run's exit code is asserted independently.
    # Cadence: the REL-026 proof runs on main and release pushes plus
    # nightly and manual runs, never on a pull request. On every pull
    # request push it bounded CI wall-clock while its second run never
    # caught a defect the first run missed, so a flake it finds now
    # surfaces after merge and holds the release gate until fixed. A push
    # still skips it when the changes job concluded successfully and proved
    # the code tree already went green; !cancelled() keeps this condition
    # evaluating when the changes job itself failed, so a classifier crash
    # runs the rerun rather than reading as a passing required check. A
    # scheduled or dispatched run has no diff to classify and exists to
    # re-prove the whole tree, so the changes gate does not apply to it and
    # it always runs.
    needs: changes
    if: >-
      !cancelled() && ((github.event_name == 'push' &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true'))
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install just
        # `rust-just` is the just binary republished on PyPI, so the runner
        # needs no cargo toolchain and no apt universe pin to get it.
        run: uv tool install rust-just

      - name: Pytest via just test-all (run 1 of 2)
        run: just test-all

      - name: Pytest via just test-all (run 2 of 2)
        run: just test-all

  prose-gate:
    name: Layer-2 prose gate (strict)
    # The fail-closed half of the validate_prose chokepoint (doc-clarity
    # Layer 2): runs `eawf hook validate-prose --strict` over the Markdown
    # changed on the PR. Locally the same chokepoint is fail-open (advisory);
    # here any EAWF013/014/017 finding reds the PR. Vale is installed + synced
    # so its prose leg participates, but the deterministic legs block even if
    # the Vale leg fails open. PR-only: the gate scans the PR's changed .md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install Vale + sync styles
        # The strict gate installs Vale so its prose leg participates. The
        # chokepoint still fails open on the Vale leg if this step is skipped
        # or sync fails (an unsynced StylesPath is an E100 fail-open), so the
        # deterministic EAWF013/014/017 legs remain the blocking floor.
        run: |
          uv tool install vale || pipx install vale || true
          vale sync || true

      - name: Validate prose (strict)
        # Diff base is the PR base SHA so the conditional scan sees exactly the
        # Markdown the PR adds/changes; --strict makes any composed finding
        # exit non-zero and block the PR.
        run: uv run eawf hook validate-prose --strict --base "${{ github.event.pull_request.base.sha }}"

  windows:
    name: Windows named-pipe transport (win32 test set)
    # The `test` matrix above runs only on POSIX, where every win32-marked
    # test SKIPS -- so the named-pipe transport (pywin32 CreateNamedPipe /
    # ReadFile MORE_DATA loop / CancelIoEx teardown / PeekNamedPipe idle
    # reap / cold-start budget) is never actually exercised there. This job
    # runs the win32 test set plus shared CLI smoke on a real Windows host so
    # a regression in the pipe transport or common CLI path reds PRs and
    # protected branch pushes.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen) + windows extra
        # `uv sync --frozen` brings the dev deps; `--extra windows` pulls
        # pywin32 so the import-guarded named-pipe transport modules
        # (windows_pipe / windows_security) actually import on this host.
        run: uv sync --frozen --extra windows

      - name: Smoke shared-code CLI on Windows
        # Exercises common CLI paths on a real Windows host, not only the
        # win32 transport modules: command startup/help, first-run init,
        # status resolution, and one daemonless portalocker mutation.
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          uv run eawf --help *> $null

          $initDir = Join-Path $env:RUNNER_TEMP "eawf-win-init-smoke"
          if (Test-Path $initDir) {
            Remove-Item -Recurse -Force $initDir
          }
          New-Item -ItemType Directory -Force -Path $initDir | Out-Null
          git -C $initDir init -q
          uv run eawf --no-input init --project-code WIN --project-title "Windows smoke" --target $initDir --no-acceptance-tests --no-acceptance-lint --no-acceptance-typecheck
          if (-not (Test-Path (Join-Path $initDir ".ea/state.json"))) {
            throw "eawf init did not create .ea/state.json"
          }
          uv run eawf --workspace $initDir status *> $null

          $daemonlessDir = Join-Path $env:RUNNER_TEMP "eawf-win-daemonless-smoke"
          if (Test-Path $daemonlessDir) {
            Remove-Item -Recurse -Force $daemonlessDir
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $daemonlessDir ".ea") | Out-Null
          $env:EA_STATE = Join-Path $daemonlessDir ".ea/state.json"
          $env:EAWF_DAEMONLESS = "1"
          uv run eawf project init WSMK --title "Windows daemonless smoke" --domains ci --default-branch main
          if (-not (Test-Path $env:EA_STATE)) {
            throw "daemonless project init did not create state"
          }
          uv run eawf status *> $null

      - name: Pytest (win32 transport set)
        # The win32-marked test set, run serially (-n0) so the per-user
        # singleton pipe is never contended by parallel workers. On Windows
        # these cases EXECUTE (instead of skipping on POSIX): the named-pipe
        # transport, security DACL/SID, atomic-write floor, and the W04
        # policy regressions. Listed explicitly (not the whole tests/ tree)
        # so the job is the focused Windows transport gate, not a full
        # cross-OS suite re-run.
        run: >
          uv run pytest -n0 --no-cov
          tests/unit/runtime/daemon/test_windows_pipe.py
          tests/unit/runtime/daemon/test_windows_pipe_design_only.py
          tests/unit/runtime/daemon/test_windows_pipe_poc_scenarios.py
          tests/unit/runtime/daemon/test_win_service.py
          tests/integration/test_windows_atomic_floor.py
          tests/integration/surfaces/cli/test_windows_w04_policy.py
          tests/integration/test_packaging.py

  green-tree:
    name: Record the green tree
    # The release gates accept a green push run on the tagged tree, not
    # only on the tagged commit, and this job is what makes a tree count as
    # green. It needs every other job, so it runs last and sees each
    # result. The not-cancelled guard keeps the skip of a pull-request-only
    # job from skipping it, and the result checks keep a failed or
    # cancelled job from recording anything. Push runs only: a pull
    # request run tests a merge of the head into the base, a tree nobody
    # tags. The tool writes the record when the heavy jobs passed, or when
    # the changes job skipped them against a green tree that is itself
    # recorded, and the record names that inherited tree. A run that may
    # not record stays green; the gates then accept only its own commit.
    needs:
      [
        changes,
        test,
        tool-install-smoke,
        snapshot-pairing,
        requirement-trace,
        skill-eval,
        linux-jail,
        twice-green,
        prose-gate,
        windows,
      ]
    if: >-
      !cancelled() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # find the green run that recorded an inherited tree
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: an inherited tree is read off the green baseline
          # commit, which a shallow clone does not carry.
          fetch-depth: 0

      - name: Decide on the tree record
        id: record
        # The runner's system Python, as in the changes job: the tool is
        # stdlib-only. NEEDS carries every needed job's result and the
        # changes job's outputs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_green_tree.py record "${RUNNER_TEMP}/ci-green-tree.json"

      - name: Upload the tree record
        if: steps.record.outputs.recorded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-tree-${{ steps.record.outputs.tree }}
          path: ${{ runner.temp }}/ci-green-tree.json
          if-no-files-found: error
