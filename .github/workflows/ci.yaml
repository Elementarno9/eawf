name: CI

on:
  push:
    branches: [main, release, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install resvg (pinned, T5 SVG pixel-diff oracle)
        # Ubuntu-only: coverage + the T5 svg_pixel_diff pixel-diff leg run on
        # the ubuntu leg alone, so the pinned renderer is installed there. On
        # the macOS leg the ~8 resvg-oracle tests skip cleanly via their
        # ``shutil.which("resvg")`` guards (tests/snapshots/svg/*.py and
        # tests/integration/test_p30_i20_w17.py).
        if: startsWith(matrix.os, 'ubuntu-')
        # CI tool manifest pin for the svg_pixel_diff audit-DSL kind.
        # resvg renders bit-identically across hosts once fonts are
        # vendored + system fonts disabled, so the golden PNGs under
        # tests/snapshots/svg/golden/ are compared by exact bytes. A
        # version bump here is a GOLDEN-REFRESH event: regenerate the
        # committed goldens (eawf vfl approve) whenever this pin moves.
        run: cargo install resvg --version 0.45.1 --locked

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Deptry
        run: uv run deptry .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest (parallel)
        # Coverage is collected on the ubuntu leg only: the ${{ }} expression
        # appends the --cov flags on ubuntu and an empty string on macOS, so
        # the macOS leg runs the identical suite without coverage.
        run: uv run pytest -n auto --ignore=tests/snapshots/tui --ignore=tests/perf/tui ${{ startsWith(matrix.os, 'ubuntu-') && '--cov=eawf --cov-report=xml --cov-fail-under=0' || '' }}
      - name: Pytest (serial TUI render/timing)
        # Same ubuntu-only coverage gating; --cov-append extends the parallel
        # leg's data file on ubuntu, macOS runs the suite without --cov.
        run: uv run pytest -n0 tests/snapshots/tui tests/perf/tui ${{ startsWith(matrix.os, 'ubuntu-') && '--cov=eawf --cov-append --cov-report=xml --cov-fail-under=0' || '' }}

      - name: Coverage gate (per-package C09 §5.2 + TUI behavioural floor)
        # Ubuntu-only: coverage.xml is produced on the ubuntu leg alone. The
        # per-package line/branch ratchet + the TUI behavioural-count floor
        # live in tools/coverage_gate.py, driven by ``[tool.eawf.coverage]``;
        # the overall fail_under floor is enforced by the next step.
        if: startsWith(matrix.os, 'ubuntu-')
        run: uv run python tools/coverage_gate.py

      - name: Coverage floor (overall >=60)
        if: startsWith(matrix.os, 'ubuntu-')
        run: uv run coverage report

  tool-install-smoke:
    name: Fresh tool-install smoke (runtime deps only)
    # The `test` matrix above always syncs the dev dependency-group, so its
    # tests are structurally blind to a runtime module importing a dev-only
    # dependency. A published `uv tool install eawf` gets RUNTIME deps only,
    # so such an import crashes the installed CLI at startup while CI stays
    # green (this is exactly how v0.5.2 shipped a `hypothesis` import that
    # broke `uv tool install`). This job builds the wheel and exercises the
    # CLI in a runtime-only environment so that class of break reds the PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Smoke the wheel with runtime deps only
        # `--no-project` ignores this repo's dev dependency-group; `--with
        # <wheel>` installs the wheel plus its DECLARED runtime deps into an
        # ephemeral env — the same dependency closure `uv tool install` sees.
        # Importing the CLI app + the audit-DSL registry (which eagerly binds
        # every check-kind at startup) reds here if any runtime module reaches
        # for a dependency that is not in `[project.dependencies]`.
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          echo "smoke-testing wheel: ${wheel}"
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --version
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --help >/dev/null
          uv run --no-project --with "${wheel}" --python 3.14 -- python -c \
            "import eawf.surfaces.cli, eawf.workflow.audit_dsl.registry; print('runtime import closure OK')"

  release-readiness:
    name: Release readiness / ${{ matrix.check }}
    # ci.yaml release-readiness matrix job: pins the release automation
    # contracts that phase close and post-merge tagging depend on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [commit-lint, phase-close-preflight, version-coupling, release-notes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Commit lint release annotation
        if: matrix.check == 'commit-lint'
        run: uv run pytest -q tests/unit/test_commit_prefix_lint.py

      - name: Phase close release preflight
        if: matrix.check == 'phase-close-preflight'
        run: uv run pytest -q tests/unit/test_lifecycle_phase_prepare_close.py

      - name: Version coupling
        if: matrix.check == 'version-coupling'
        run: uv run pytest -q tests/unit/test_version_coupling.py

      - name: Release notes
        if: matrix.check == 'release-notes'
        run: uv run pytest -q tests/unit/test_render_release_notes.py

  snapshot-pairing:
    name: Snapshot pairing gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Snapshot pairing gate
        run: uv run python tools/snapshot_pairing_gate.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  prose-gate:
    name: Layer-2 prose gate (strict)
    # The fail-closed half of the validate_prose chokepoint (doc-clarity
    # Layer 2): runs `eawf hook validate-prose --strict` over the Markdown
    # changed on the PR. Locally the same chokepoint is fail-open (advisory);
    # here any EAWF013/014/017 finding reds the PR. Vale is installed + synced
    # so its prose leg participates, but the deterministic legs block even if
    # the Vale leg fails open. PR-only: the gate scans the PR's changed .md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install Vale + sync styles
        # The strict gate installs Vale so its prose leg participates. The
        # chokepoint still fails open on the Vale leg if this step is skipped
        # or sync fails (an unsynced StylesPath is an E100 fail-open), so the
        # deterministic EAWF013/014/017 legs remain the blocking floor.
        run: |
          uv tool install vale || pipx install vale || true
          vale sync || true

      - name: Validate prose (strict)
        # Diff base is the PR base SHA so the conditional scan sees exactly the
        # Markdown the PR adds/changes; --strict makes any composed finding
        # exit non-zero and block the PR.
        run: uv run eawf hook validate-prose --strict --base "${{ github.event.pull_request.base.sha }}"

  mutation-core:
    name: Mutation testing (core, publish-not-block)
    # Publish-not-block per success criterion: the campaign runs on PRs,
    # prints a mutation score, and never reds the build below the >=70%
    # target. ``continue-on-error`` makes the job non-blocking even if the
    # campaign step exits non-zero (e.g. a surviving mutant). PR-only
    # because a mutation run is far slower than the unit suite and the
    # score is review signal, not a merge gate.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build the mutation venv (non-editable eawf + dev deps + mutmut)
        # mutmut rewrites source into a ``mutants/`` sandbox and runs the
        # suite from there. An *editable* install breaks in that sandbox
        # because ``from eawf import __version__`` re-triggers the dynamic
        # hatch-version build hook (whose ``tools/`` is not copied), so the
        # campaign env installs eawf as a built wheel (non-editable) plus
        # the dev test deps the suite needs (hypothesis, ...) plus mutmut.
        # mutmut is added with ``uv pip install`` into a throwaway venv, so
        # the committed ``uv.lock`` is never touched — it stays a campaign
        # tool, not a wheel/lock dependency. The dev-dep set is exported
        # from the frozen lock so versions match the gating ``test`` job.
        run: |
          uv export --frozen --only-dev --no-emit-project -o /tmp/dev-reqs.txt
          uv venv /tmp/mutenv
          VIRTUAL_ENV=/tmp/mutenv uv pip install . -r /tmp/dev-reqs.txt mutmut==3.5.0

      - name: Run mutmut on core (state/lifecycle/daemon/validate)
        # mutmut config (paths_to_mutate, also_copy, do_not_mutate,
        # covered-lines scoping) lives in ``[tool.mutmut]`` of
        # pyproject.toml. Run via the campaign venv's own interpreter (no
        # ``uv run`` wrapper) so changing cwd into ``mutants/`` never
        # re-resolves the project. ``|| true`` keeps the step green even on
        # surviving mutants / partial collection; the score is published
        # in the next step. NOTE: mutmut's source-rewriting sandbox can
        # still trip pydantic-core's compiled validators on some modules;
        # because this job is publish-not-block, a partial run only narrows
        # the published denominator and never reds CI. See
        # ``docs/reference/mutation-testing.md`` (sandbox caveats).
        run: /tmp/mutenv/bin/python -m mutmut run || true

      - name: Publish mutation score (target >=70%)
        # Reads the killed/survived/total counts mutmut writes to
        # ``mutants/mutmut-cicd-stats.json`` and prints the score to the
        # job log + step summary. Documented target is 70% killed of
        # killed+survived; this step reports against it without failing.
        run: |
          /tmp/mutenv/bin/python -m mutmut export-cicd-stats || true
          /tmp/mutenv/bin/python <<'PY'
          import json
          import os
          import pathlib

          stats_path = pathlib.Path("mutants/mutmut-cicd-stats.json")
          if not stats_path.exists():
              print("no mutmut-cicd-stats.json produced; skipping score report")
              raise SystemExit(0)

          stats = json.loads(stats_path.read_text())
          killed = stats.get("killed", 0)
          survived = stats.get("survived", 0)
          tested = killed + survived
          score = (killed / tested * 100) if tested else 0.0
          target = 70.0

          lines = [
              "## Mutation testing (core)",
              "",
              f"- killed: {killed}",
              f"- survived: {survived}",
              f"- score (killed / killed+survived): {score:.1f}%",
              f"- target: >= {target:.0f}% (publish-not-block)",
              f"- status: {'meets target' if score >= target else 'BELOW target (not blocking)'}",
          ]
          report = "\n".join(lines)
          print(report)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              pathlib.Path(summary).write_text(report + "\n")
          PY

  windows:
    name: Windows named-pipe transport (win32 test set)
    # The `test` matrix above runs only on POSIX, where every win32-marked
    # test SKIPS -- so the named-pipe transport (pywin32 CreateNamedPipe /
    # ReadFile MORE_DATA loop / CancelIoEx teardown / PeekNamedPipe idle
    # reap / cold-start budget) is never actually exercised there. This job
    # runs the win32 test set plus shared CLI smoke on a real Windows host so
    # a regression in the pipe transport or common CLI path reds PRs and
    # protected branch pushes.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen) + windows extra
        # `uv sync --frozen` brings the dev deps; `--extra windows` pulls
        # pywin32 so the import-guarded named-pipe transport modules
        # (windows_pipe / windows_security) actually import on this host.
        run: uv sync --frozen --extra windows

      - name: Smoke shared-code CLI on Windows
        # Exercises common CLI paths on a real Windows host, not only the
        # win32 transport modules: command startup/help, first-run init,
        # status resolution, and one daemonless portalocker mutation.
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          uv run eawf --help *> $null

          $initDir = Join-Path $env:RUNNER_TEMP "eawf-win-init-smoke"
          if (Test-Path $initDir) {
            Remove-Item -Recurse -Force $initDir
          }
          New-Item -ItemType Directory -Force -Path $initDir | Out-Null
          git -C $initDir init -q
          uv run eawf --no-input init --project-code WIN --project-title "Windows smoke" --target $initDir --no-acceptance-tests --no-acceptance-lint --no-acceptance-typecheck
          if (-not (Test-Path (Join-Path $initDir ".ea/state.json"))) {
            throw "eawf init did not create .ea/state.json"
          }
          uv run eawf --workspace $initDir status *> $null

          $daemonlessDir = Join-Path $env:RUNNER_TEMP "eawf-win-daemonless-smoke"
          if (Test-Path $daemonlessDir) {
            Remove-Item -Recurse -Force $daemonlessDir
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $daemonlessDir ".ea") | Out-Null
          $env:EA_STATE = Join-Path $daemonlessDir ".ea/state.json"
          $env:EAWF_DAEMONLESS = "1"
          uv run eawf project init WSMK --title "Windows daemonless smoke" --domains ci --default-branch main
          if (-not (Test-Path $env:EA_STATE)) {
            throw "daemonless project init did not create state"
          }
          uv run eawf status *> $null

      - name: Pytest (win32 transport set)
        # The win32-marked test set, run serially (-n0) so the per-user
        # singleton pipe is never contended by parallel workers. On Windows
        # these cases EXECUTE (instead of skipping on POSIX): the named-pipe
        # transport, security DACL/SID, atomic-write floor, and the W04
        # policy regressions. Listed explicitly (not the whole tests/ tree)
        # so the job is the focused Windows transport gate, not a full
        # cross-OS suite re-run.
        run: >
          uv run pytest -n0 --no-cov
          tests/daemon/test_windows_pipe.py
          tests/daemon/test_windows_pipe_design_only.py
          tests/daemon/test_windows_pipe_poc_scenarios.py
          tests/daemon/test_win_service.py
          tests/integration/test_windows_atomic_floor.py
          tests/cli/test_windows_w04_policy.py
          tests/integration/test_packaging.py
