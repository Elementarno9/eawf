name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, ubuntu-24.04, ubuntu-22.04]
        python: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest (parallel)
        run: uv run pytest -n auto --ignore=tests/snapshots/tui --ignore=tests/perf/tui --cov=eawf --cov-report=xml --cov-fail-under=0
      - name: Pytest (serial TUI render/timing)
        run: uv run pytest -n0 tests/snapshots/tui tests/perf/tui --cov=eawf --cov-append --cov-report=xml --cov-fail-under=0

      - name: Coverage gate (per-package C09 §5.2 + overall floor)
        # pytest-cov has no native per-package threshold. The overall
        # floor is enforced by ``[tool.coverage.report] fail_under`` via
        # the next step; this step parses the combined ``coverage.xml``
        # (both pytest runs, --cov-append) and asserts each gated package
        # clears its line/branch ratchet from ``[tool.eawf.coverage]``.
        run: |
          uv run python <<'PY'
          import fnmatch
          import re
          import sys
          import tomllib
          import xml.etree.ElementTree as ET

          cond = re.compile(r"\((\d+)/(\d+)\)")

          def aggregate(classes):
              tot = cov = btot = bcov = 0
              for cls in classes:
                  for line in cls.iter("line"):
                      tot += 1
                      if int(line.get("hits", "0")) > 0:
                          cov += 1
                      if line.get("branch") == "true":
                          match = cond.search(line.get("condition-coverage", ""))
                          if match:
                              bcov += int(match.group(1))
                              btot += int(match.group(2))
              line_pct = cov / tot * 100 if tot else 100.0
              branch_pct = bcov / btot * 100 if btot else 100.0
              return line_pct, branch_pct

          with open("pyproject.toml", "rb") as handle:
              gates = tomllib.load(handle)["tool"]["eawf"]["coverage"]["gates"]
          classes = ET.parse("coverage.xml").getroot().findall(".//class")

          failures = []
          print("per-package coverage gates (C09 §5.2)")
          header = f"{'package':16s} {'line%':>8s} {'gate':>6s}  {'branch%':>8s} {'gate':>6s}  status"
          print(header)
          for name, spec in sorted(gates.items()):
              if "glob" in spec:
                  picked = [c for c in classes if fnmatch.fnmatch(c.get("filename", ""), spec["glob"])]
              else:
                  picked = [c for c in classes if c.get("filename", "").startswith(spec["path"])]
              if not picked:
                  failures.append(f"{name}: no source files matched")
                  continue
              line_pct, branch_pct = aggregate(picked)
              line_ok = spec.get("waive_line", False) or line_pct >= spec.get("line", 0)
              branch_ok = spec.get("waive_branch", False) or branch_pct >= spec.get("branch", 0)
              line_gate = "waived" if spec.get("waive_line") else str(spec.get("line", 0))
              branch_gate = "waived" if spec.get("waive_branch") else str(spec.get("branch", 0))
              status = "ok" if (line_ok and branch_ok) else "FAIL"
              print(
                  f"{name:16s} {line_pct:8.2f} {line_gate:>6s}  "
                  f"{branch_pct:8.2f} {branch_gate:>6s}  {status}"
              )
              if not line_ok:
                  failures.append(f"{name}: line {line_pct:.2f}% < gate {spec.get('line')}%")
              if not branch_ok:
                  failures.append(f"{name}: branch {branch_pct:.2f}% < gate {spec.get('branch')}%")

          if failures:
              print("\ncoverage gate FAILED:")
              for entry in failures:
                  print(f"  - {entry}")
              sys.exit(1)
          print("\nall per-package coverage gates passed")
          PY

      - name: Coverage floor (overall >=60)
        run: uv run coverage report

  snapshot-pairing:
    name: Snapshot pairing gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Snapshot pairing gate
        run: uv run python tools/snapshot_pairing_gate.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  mutation-core:
    name: Mutation testing (core, publish-not-block)
    # Publish-not-block per success criterion: the campaign runs on PRs,
    # prints a mutation score, and never reds the build below the >=70%
    # target. ``continue-on-error`` makes the job non-blocking even if the
    # campaign step exits non-zero (e.g. a surviving mutant). PR-only
    # because a mutation run is far slower than the unit suite and the
    # score is review signal, not a merge gate.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build the mutation venv (non-editable eawf + dev deps + mutmut)
        # mutmut rewrites source into a ``mutants/`` sandbox and runs the
        # suite from there. An *editable* install breaks in that sandbox
        # because ``from eawf import __version__`` re-triggers the dynamic
        # hatch-version build hook (whose ``tools/`` is not copied), so the
        # campaign env installs eawf as a built wheel (non-editable) plus
        # the dev test deps the suite needs (hypothesis, ...) plus mutmut.
        # mutmut is added with ``uv pip install`` into a throwaway venv, so
        # the committed ``uv.lock`` is never touched — it stays a campaign
        # tool, not a wheel/lock dependency. The dev-dep set is exported
        # from the frozen lock so versions match the gating ``test`` job.
        run: |
          uv export --frozen --only-dev --no-emit-project -o /tmp/dev-reqs.txt
          uv venv /tmp/mutenv
          VIRTUAL_ENV=/tmp/mutenv uv pip install . -r /tmp/dev-reqs.txt mutmut==3.5.0

      - name: Run mutmut on core (state/lifecycle/daemon/validate)
        # mutmut config (paths_to_mutate, also_copy, do_not_mutate,
        # covered-lines scoping) lives in ``[tool.mutmut]`` of
        # pyproject.toml. Run via the campaign venv's own interpreter (no
        # ``uv run`` wrapper) so changing cwd into ``mutants/`` never
        # re-resolves the project. ``|| true`` keeps the step green even on
        # surviving mutants / partial collection; the score is published
        # in the next step. NOTE: mutmut's source-rewriting sandbox can
        # still trip pydantic-core's compiled validators on some modules;
        # because this job is publish-not-block, a partial run only narrows
        # the published denominator and never reds CI. See
        # ``docs/reference/mutation-testing.md`` (sandbox caveats).
        run: /tmp/mutenv/bin/python -m mutmut run || true

      - name: Publish mutation score (target >=70%)
        # Reads the killed/survived/total counts mutmut writes to
        # ``mutants/mutmut-cicd-stats.json`` and prints the score to the
        # job log + step summary. Documented target is 70% killed of
        # killed+survived; this step reports against it without failing.
        run: |
          /tmp/mutenv/bin/python -m mutmut export-cicd-stats || true
          /tmp/mutenv/bin/python <<'PY'
          import json
          import os
          import pathlib

          stats_path = pathlib.Path("mutants/mutmut-cicd-stats.json")
          if not stats_path.exists():
              print("no mutmut-cicd-stats.json produced; skipping score report")
              raise SystemExit(0)

          stats = json.loads(stats_path.read_text())
          killed = stats.get("killed", 0)
          survived = stats.get("survived", 0)
          tested = killed + survived
          score = (killed / tested * 100) if tested else 0.0
          target = 70.0

          lines = [
              "## Mutation testing (core)",
              "",
              f"- killed: {killed}",
              f"- survived: {survived}",
              f"- score (killed / killed+survived): {score:.1f}%",
              f"- target: >= {target:.0f}% (publish-not-block)",
              f"- status: {'meets target' if score >= target else 'BELOW target (not blocking)'}",
          ]
          report = "\n".join(lines)
          print(report)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              pathlib.Path(summary).write_text(report + "\n")
          PY
