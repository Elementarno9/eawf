name: CI

on:
  # The full matrix, macOS and the coverage gate run on these pushes: dev is
  # the integration branch every pull request lands on, main takes stable
  # releases, and the release train carries the twice-green proof.
  push:
    branches: [main, dev, release, "release/**"]
  # A draft pull request runs the fast lane: four ubuntu shards, the serial
  # lane, the small gates and one macOS job over the affected tests. A
  # pull request ready for review runs the full configuration a push runs,
  # coverage and the whole-suite macOS shards included, plus the console
  # replay. It carries no path filter: a filtered-out workflow never
  # reports, which leaves a required check pending and blocks the merge,
  # so every pull request runs it and the ci-ok job carries the verdict.
  # The listed types add ready_for_review, so a draft marked ready runs
  # the full configuration.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The nightly and hand-started runs carry the twice-green proof between
  # pushes. GitHub fires a schedule on the default branch only.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # One group per pull request, so a push that supersedes a running head
  # cancels its run. A run without a pull request groups by event and ref,
  # so a merge to main and the nightly run never cancel each other.
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes since the last green tree
    # A push that only edits project state under .ea/ leaves the code tree
    # exactly as it was when CI last went green, and re-running the matrix
    # and twice-green on it costs about half an hour proving nothing new.
    # This job compares the checkout with the newest green ci.yaml run that
    # may anchor it, and exposes code=false only when every changed path is
    # bookkeeping: anything under .ea/. A run owing the full configuration (a push, a pull request
    # off draft) inherits only from a run that executed it, proven by a
    # successful coverage job; a release push only from its own ref's last
    # green push. So dev fast-forwarded to a ready pull request head
    # inherits that head's green run. The .ea/
    # commit-policy census runs before push, not in these test jobs. Every
    # other path writes code=true. The green output names the green commit
    # it compared against, which the green-tree job records as the tree a
    # skipped run inherits.
    # It must stay unconditional: every lookup failure fails open to
    # code=true inside the tool, and a scheduled or dispatched run, which
    # has no diff to classify, always reports code=true. The heavy jobs
    # below also fail open at the job level -- their conditions still run
    # them when this job itself did not conclude success -- so a classifier
    # crash cannot read as a passing required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # list this workflow's green runs
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      green: ${{ steps.classify.outputs.green }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        # The runner's system Python: the tool is stdlib-only, so the job
        # needs no uv install or dependency sync.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_changes.py

  gates:
    name: Small gates (lint, wheel smoke, trace, evals, pull-request checks)
    # The cheap gates share one runner and one dependency sync instead of
    # paying a checkout and sync each. Every gate step runs once the sync
    # succeeded, even after an earlier gate failed, so one red run reports
    # every finding. The hooks and the type check read the tree, not the
    # host, so one ubuntu run proves them. It does not need the changes job:
    # the hooks also scan the .ea/ paths that job lets the matrix skip. The
    # snapshot-pairing, commit-grammar and prose steps read the pull
    # request's range and run on pull requests only.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        id: sync
        run: uv sync --frozen

      - name: Pre-commit
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Deptry
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run deptry .

      - name: Mypy
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy src/

      - name: Build wheel
        id: wheel
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv build --wheel --out-dir dist

      - name: Smoke the wheel with runtime deps only
        # The test jobs always sync the dev dependency-group, so their tests
        # are structurally blind to a runtime module importing a dev-only
        # dependency. A published `uv tool install eawf` gets runtime deps
        # only, so such an import crashes the installed CLI at startup while
        # CI stays green (this is how v0.5.2 shipped a `hypothesis` import
        # that broke `uv tool install`). `--no-project` ignores this repo's
        # dev dependency-group; `--with <wheel>` installs the wheel plus its
        # declared runtime deps into an ephemeral env, the same dependency
        # closure `uv tool install` sees. Importing the CLI app and the
        # audit-DSL registry (which eagerly binds every check-kind at
        # startup) reds here if any runtime module reaches for a dependency
        # that is not in `[project.dependencies]`.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          echo "smoke-testing wheel: ${wheel}"
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --version
          uv run --no-project --with "${wheel}" --python 3.14 -- eawf --help >/dev/null
          uv run --no-project --with "${wheel}" --python 3.14 -- python -c \
            "import eawf.surfaces.cli, eawf.workflow.audit_dsl.registry; print('runtime import closure OK')"

      - name: Requirement trace check
        # Recomputes the per-id requirement trace from the committed catalog,
        # state and source, and fails when the stored census differs in value
        # or when any id is neither owned, deferred nor satisfied. A
        # satisfied disposition cites the commit that built its ids, so the
        # checkout carries full history.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python tools/requirement_trace.py check --require-owned

      - name: Skill envelope evals
        # The eval marker is excluded from the default pytest run, so without
        # this step a skill whose envelope drifts from its golden stays green.
        # The cases compare envelope structure against committed goldens and
        # call no model, so the step is deterministic and cheap.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/eval/test_skill_eval.py -m "eval and not repo_state" -q

      - name: Snapshot pairing gate
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.event_name == 'pull_request' }}
        run: uv run python tools/snapshot_pairing_gate.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Commit grammar
        # The commit-msg hook runs only where it is installed, so this lints
        # the subject and Task-trailer grammar of every commit the pull
        # request adds. History is read, never state: a commit predating the
        # epoch-2 switch may carry any epoch-1 bracket form it was written in.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.event_name == 'pull_request' }}
        run: uv run --no-project python tools/commit_prefix_lint.py --check-history "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Ledger history
        # Committed ledger lines stay append-only and the commits they bind
        # must stay reachable once the branch lands; a finding fails the job.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.event_name == 'pull_request' }}
        run: uv run eawf hook ledger-history --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Citation scope (EAWF027) over the tree and the PR body
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" > "${RUNNER_TEMP}/pr-body.md"
          uv run eawf hook eawf027-citation-scope --pr-body "${RUNNER_TEMP}/pr-body.md"

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / shard ${{ matrix.shard }}
    needs: changes
    # Skipped only when the changes job concluded successfully and proved
    # the code tree is the one the last green run tested; !cancelled() keeps
    # this condition evaluating (instead of the default auto-skip-on-
    # dependency-failure) when the changes job itself failed, so a
    # classifier crash runs the full matrix rather than reading as a
    # passing required check.
    if: >-
      !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # CI tool manifest pin for the svg_pixel_diff audit-DSL kind. resvg
      # renders bit-identically across hosts once fonts are vendored and
      # system fonts disabled, so the golden PNGs under
      # tests/snapshots/svg/golden/ are compared by exact bytes. A version
      # bump here is a GOLDEN-REFRESH event: regenerate the committed
      # goldens (eawf vfl approve) whenever this pin moves. The pin also
      # keys the resvg build cache, so a bump rebuilds once.
      RESVG_VERSION: "0.45.1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.14"]
        # Four pytest-split shards balanced by the committed durations keep
        # the pull-request wall short; the serial tiers run in their own job.
        shard: ["1", "2", "3", "4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Restore resvg (cached by pinned version)
        # Building resvg from source costs minutes per shard; the binary is
        # restored by its pinned version and runner, and saved after the job
        # on a miss.
        id: resvg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/resvg
          key: resvg-${{ env.RESVG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install resvg (pinned, T5 SVG pixel-diff oracle)
        # Only the ubuntu shards install the pinned renderer; on macOS the
        # resvg-oracle tests skip cleanly via their ``shutil.which("resvg")``
        # guards (tests/snapshots/svg/*.py).
        if: steps.resvg-cache.outputs.cache-hit != 'true'
        run: cargo install resvg --version "$RESVG_VERSION" --locked

      - name: Shard durations
        # pytest-split weighs tests by node id, while the committed baseline
        # is keyed the way the JUnit report names tests; this re-keys it.
        run: uv run python tools/duration_budget_gate.py split tests/duration-baseline.json split-durations.json

      - name: Pytest (parallel)
        # Coverage is collected off draft pull requests only: the ${{ }}
        # expression appends the --cov flags on a push, nightly or manual
        # run and on a pull request ready for review, and an empty string on
        # a draft, which has no coverage job to feed. The test selection is
        # the same on every event. The end-to-end suite and the perf lane
        # run in the serial job to avoid worker contention.
        run: uv run pytest -m "not eval and not repo_state" -n auto --ignore=tests/snapshots/tui --ignore=tests/e2e --ignore=tests/perf/surfaces/tui --ignore=tests/perf/surfaces/cli --ignore=tests/perf/runtime --ignore=tests/perf/kernel --ignore=tests/perf/observability --junitxml=pytest-junit.xml --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration --durations-path split-durations.json ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && '--cov=eawf --cov-report= --cov-fail-under=0' || '' }}

      - name: Duration budget (advisory)
        # Diffs every test's wall time in the parallel leg against the
        # committed baseline: a test past twice its baseline, or a fast-tier
        # test past its tier ceiling, is reported. Advisory for its first
        # checkpoint, so a finding reports and does not fail the job.
        continue-on-error: true
        run: uv run python tools/duration_budget_gate.py check pytest-junit.xml tests/duration-baseline.json

      - name: Upload JUnit report
        # Every shard keeps its report, so the duration baseline can be
        # refreshed from a real CI run and a slow shard can be read back.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: pytest-junit.xml
          if-no-files-found: error

      - name: Upload coverage data
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-shard-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: Serial lane (e2e, perf structure, telemetry sync)
    needs: changes
    # The tiers that must not share the host with pytest workers run here,
    # beside the shards instead of after shard 1, so no shard carries them
    # on the critical path. Gated like the shards.
    if: >-
      !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Pytest (serial e2e timing)
        # Console latency must be measured without competing pytest workers.
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/e2e ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && '--cov=eawf --cov-report= --cov-fail-under=0' || '' }}

      - name: Pytest (serial perf structure)
        # The perf lane's import-graph and harness checks block on every
        # event; EAWF_SKIP_PERF skips its wall-clock budgets, which a loaded
        # runner can red with nothing broken.
        env:
          EAWF_SKIP_PERF: "1"
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/perf/surfaces/tui tests/perf/surfaces/cli tests/perf/runtime tests/perf/kernel tests/perf/observability ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && '--cov=eawf --cov-append --cov-report= --cov-fail-under=0' || '' }}

      - name: Perf lane (nightly, reports, never blocks)
        # The same lane with its wall-clock budgets, serial and on the
        # nightly or hand-started run only. A breach shows as a failed step
        # on an otherwise green job, so it reports without blocking.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/perf/surfaces/tui tests/perf/surfaces/cli tests/perf/runtime tests/perf/kernel tests/perf/observability

      - name: Telemetry sync (REL-009)
        # Telemetry ingestion is on by default, so CI must prove the sync
        # actually lands rows: an off-by-default projector produced empty
        # cohorts and made every duration distribution unusable. The
        # session_count and duration-p50 assertions live inside the named
        # test rather than as inline shell here, so a local run reproduces
        # the CI signal exactly.
        #
        # Sunset review: KEEP. A gate that never fires is retired at phase
        # close, and this one is the exception that earns its slot -- the
        # empty-cohort regression it guards is silent (green suite, unusable
        # numbers), so the only evidence it is still working is that it runs.
        # Its fire proof is tests/integration/test_metrics_cli.py, which reds
        # on an ingestion path that writes no rows. Reviewed and kept; the
        # companion review row is tests/lint/test_gate_sunset_review.py.
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/integration/test_metrics_cli.py

      - name: Upload coverage data
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-serial
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  test-macos:
    name: ${{ matrix.os }} / py${{ matrix.python }} / shard ${{ matrix.shard }}
    needs: changes
    # The whole suite on macOS runs on pushes, nightly and manual runs and
    # on a pull request ready for review; a draft runs the affected tests
    # only, in macos-affected. Gated on the changes job like the ubuntu
    # shards.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        python: ["3.14"]
        # Steps that must run once per leg, not once per shard, key on
        # shard 1.
        shard: ["1", "2", "3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Shard durations
        run: uv run python tools/duration_budget_gate.py split tests/duration-baseline.json split-durations.json

      - name: Pytest (parallel)
        # The ubuntu shards' selection without coverage.
        run: uv run pytest -m "not eval and not repo_state" -n auto --ignore=tests/snapshots/tui --ignore=tests/e2e --ignore=tests/perf/surfaces/tui --ignore=tests/perf/surfaces/cli --ignore=tests/perf/runtime --ignore=tests/perf/kernel --ignore=tests/perf/observability --junitxml=pytest-junit.xml --splits 3 --group ${{ matrix.shard }} --splitting-algorithm least_duration --durations-path split-durations.json

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: pytest-junit.xml
          if-no-files-found: error

      - name: Pytest (serial e2e timing)
        if: matrix.shard == '1'
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/e2e

      - name: Pytest (serial perf structure)
        if: matrix.shard == '1'
        env:
          EAWF_SKIP_PERF: "1"
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/perf/surfaces/tui tests/perf/surfaces/cli tests/perf/runtime tests/perf/kernel tests/perf/observability

      - name: Perf lane (nightly, reports, never blocks)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.shard == '1'
        continue-on-error: true
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/perf/surfaces/tui tests/perf/surfaces/cli tests/perf/runtime tests/perf/kernel tests/perf/observability

      - name: Telemetry sync (REL-009)
        if: matrix.shard == '1'
        run: uv run pytest -m "not eval and not repo_state" -n0 tests/integration/test_metrics_cli.py

  macos-affected:
    name: macos-26 / affected tests
    needs: changes
    # The one macOS job of a draft pull request: the tests
    # tools/changed_scope.py maps the pull request's diff to, in parallel
    # with the ubuntu shards' ignores and the perf budgets skipped. It
    # catches a macOS-only failure in what the draft touched without the
    # whole-suite macOS wall; marking the pull request ready runs the whole
    # suite there.
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Select the affected tests
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scope="$(uv run python tools/changed_scope.py --base "${BASE_SHA}" --existing-only)"
          echo "affected: ${scope:-none}"
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"

      - name: Pytest (affected, parallel)
        # pytest exits 5 when the ignores leave nothing to collect, which
        # means the pull request touched only serial-tier tests.
        if: steps.scope.outputs.scope != ''
        env:
          EAWF_SKIP_PERF: "1"
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set +e
          # shellcheck disable=SC2086 # the scope is a space-separated path list
          uv run pytest -m "not eval and not repo_state" -n auto --ignore=tests/snapshots/tui --ignore=tests/e2e --ignore=tests/perf/surfaces/tui --ignore=tests/perf/surfaces/cli --ignore=tests/perf/runtime --ignore=tests/perf/kernel --ignore=tests/perf/observability $SCOPE
          status=$?
          if [ "${status}" -eq 5 ]; then
            echo "no affected test outside the serial tiers"
            exit 0
          fi
          exit "${status}"

  coverage:
    name: Coverage gate over the combined shards
    # Each ubuntu shard and the serial lane measure a part of the suite, so
    # none alone can judge a floor. A draft pull request collects no
    # coverage; every push, nightly and manual run and every pull request
    # ready for review merges the parts once every one of them passed (the
    # default needs condition) and judges once.
    needs: [test, e2e]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data

      - name: Combine shard coverage
        # The parts ran on the same runner image and checkout path, so their
        # measured file paths agree and combine without remapping.
        run: |
          uv run coverage combine coverage-data/*/.coverage
          uv run coverage xml

      - name: Coverage gate (per-package C09 §5.2 + TUI behavioural floor)
        # The per-package line/branch ratchet + the TUI behavioural-count
        # floor live in tools/coverage_gate.py, driven by
        # ``[tool.eawf.coverage]``; the overall fail_under floor is enforced
        # by the next step.
        run: uv run python tools/coverage_gate.py

      - name: Coverage floor (overall >=60)
        run: uv run coverage report

  linux-jail:
    name: Linux jail real-bwrap launch
    # The test jobs run on hosts WITHOUT bubblewrap, so every real-jail
    # case skips there and the Linux backend is only ever checked by argv
    # shape. That is how a prefix that bwrap refuses to launch (a tmpfs mask
    # over an absent cred dir, a $TMPDIR pinned to a macOS-only path) stayed
    # green while the jail was dead on Linux. This job installs real
    # bubblewrap so the launch tests EXECUTE against the kernel. Gated on
    # the changes job like the shards: a bookkeeping-only tree is one a
    # green run already launched the jail on.
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install bubblewrap
        # bwrap needs an unprivileged user namespace; Ubuntu 24.04 restricts
        # those by default via AppArmor, so the sysctl is relaxed for the job
        # (best-effort: on a runner image that already permits it the write
        # fails harmlessly). The version echo makes the installed binary
        # visible in the log when a launch assertion fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Pytest (real-bwrap jail launch)
        # Serial (-n0) and coverage-free: this is the focused sandbox gate,
        # not a suite re-run. The whole sandbox set runs so the argv-shape,
        # env-scrub TMPDIR and sunset cases are checked on the same host that
        # executes the real launch. The containment cases skip without bwrap,
        # so this is the only host where they run at all.
        run: >
          uv run pytest -m "not eval and not repo_state" -n0 --no-cov
          tests/integration/runtime/sandbox/test_jail.py
          tests/integration/runtime/sandbox/test_bwrap_containment.py
          tests/unit/runtime/sandbox/test_jail_expiry.py
          tests/unit/runtime/sandbox/test_env_scrub.py

  twice-green:
    name: Full suite green a second time from a fresh checkout
    # The test jobs run the suite once on every event this job runs on, so
    # this job supplies the second green run REL-026 means by reproducibly
    # green: `just test-all` once more, on its own fresh checkout, unsharded
    # and with the console goldens and the serial tiers in it. A third run,
    # back to back on this checkout, never caught a defect the first two
    # missed; the state one run leaves for the next -- a leaked runtime dir,
    # a live daemon socket -- is named by the suite's daemon leak witness at
    # session end instead.
    # Cadence: the REL-026 proof runs on release pushes plus nightly and
    # manual runs, never on a pull request or a main or dev push. Its half
    # hour on every push bounded CI wall-clock while its second run never
    # caught a defect the first run missed, so a flake it finds now
    # surfaces in the next nightly run and holds the release gate until
    # fixed. A release push still skips it when the changes job concluded
    # successfully and proved the code tree already went green; !cancelled()
    # keeps this condition evaluating when the changes job itself failed,
    # so a classifier crash runs the rerun rather than reading as a passing
    # required check. A scheduled or dispatched run has no diff to classify
    # and exists to re-prove the whole tree, so the changes gate does not
    # apply to it and it always runs.
    needs: changes
    if: >-
      !cancelled() && ((github.event_name == 'push'
      && (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/'))
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true'))
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install just
        # `rust-just` is the just binary republished on PyPI, so the runner
        # needs no cargo toolchain and no apt universe pin to get it.
        run: uv tool install rust-just

      - name: Pytest via just test-all
        # The recipe's pytest calls carry no -m of their own, so the
        # deselection the other jobs spell inline reaches them through the env.
        env:
          PYTEST_ADDOPTS: -m "not eval and not repo_state"
        run: just test-all

  windows:
    name: Windows named-pipe transport (win32 test set)
    # The test jobs run only on POSIX, where every win32-marked test SKIPS
    # -- so the named-pipe transport (pywin32 CreateNamedPipe / ReadFile
    # MORE_DATA loop / CancelIoEx teardown / PeekNamedPipe idle reap /
    # cold-start budget) is never actually exercised there. This job runs
    # the win32 test set plus shared CLI smoke on a real Windows host so a
    # regression in the pipe transport or common CLI path reds pull
    # requests and protected branch pushes. Gated on the changes job like
    # the shards, so a bookkeeping-only tree runs no test job.
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen) + windows extra
        # `uv sync --frozen` brings the dev deps; `--extra windows` pulls
        # pywin32 so the import-guarded named-pipe transport modules
        # (windows_pipe / windows_security) actually import on this host.
        run: uv sync --frozen --extra windows

      - name: Smoke shared-code CLI on Windows
        # Exercises common CLI paths on a real Windows host, not only the
        # win32 transport modules: command startup/help, first-run init,
        # status resolution, and one daemonless portalocker mutation.
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          uv run eawf --help *> $null

          $initDir = Join-Path $env:RUNNER_TEMP "eawf-win-init-smoke"
          if (Test-Path $initDir) {
            Remove-Item -Recurse -Force $initDir
          }
          New-Item -ItemType Directory -Force -Path $initDir | Out-Null
          git -C $initDir init -q
          uv run eawf --no-input init --project-code WIN --project-title "Windows smoke" --target $initDir
          if (-not (Test-Path (Join-Path $initDir ".ea/generations/EPOCH2_ACTIVE.json"))) {
            throw "eawf init did not bear an epoch-2 tree"
          }
          uv run eawf --workspace $initDir status *> $null

          $daemonlessDir = Join-Path $env:RUNNER_TEMP "eawf-win-daemonless-smoke"
          if (Test-Path $daemonlessDir) {
            Remove-Item -Recurse -Force $daemonlessDir
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $daemonlessDir ".ea") | Out-Null
          $env:EAWF_DAEMONLESS = "1"
          uv run eawf --no-input init --project-code WSMK --project-title "Windows daemonless smoke" --target $daemonlessDir
          if (-not (Test-Path (Join-Path $daemonlessDir ".ea/generations/EPOCH2_ACTIVE.json"))) {
            throw "daemonless eawf init did not bear an epoch-2 tree"
          }
          uv run eawf --workspace $daemonlessDir status *> $null

      - name: Pytest (win32 transport set)
        # The win32-marked test set, run serially (-n0) so the per-user
        # singleton pipe is never contended by parallel workers. On Windows
        # these cases EXECUTE (instead of skipping on POSIX): the named-pipe
        # transport, security DACL/SID, atomic-write floor, and the W04
        # policy regressions. Listed explicitly (not the whole tests/ tree)
        # so the job is the focused Windows transport gate, not a full
        # cross-OS suite re-run.
        run: >
          uv run pytest -m "not eval and not repo_state" -n0 --no-cov
          tests/unit/runtime/daemon/test_windows_pipe.py
          tests/unit/runtime/daemon/test_windows_pipe_design_only.py
          tests/unit/runtime/daemon/test_windows_pipe_poc_scenarios.py
          tests/unit/runtime/daemon/test_win_service.py
          tests/integration/test_windows_atomic_floor.py
          tests/integration/surfaces/cli/test_windows_w04_policy.py
          tests/integration/test_packaging.py

  console-replay:
    name: Console replay
    # The console golden contract replays on every pull request ready for
    # review, whatever paths it touches, so a change that moves the
    # chassis, the fixture or the normalisation map learns it broke the
    # contract before it lands, and ci-ok carries the result. A draft and a
    # push skip it: the ready pull request that carried the change already
    # replayed it, and the nightly twice-green run replays the whole TUI
    # snapshot tier. Gated on the changes job like the shards: a
    # bookkeeping-only change replays a tree the baseline run, itself a
    # ready pull request run, already replayed.
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    uses: ./.github/workflows/console-replay.yaml

  ci-ok:
    name: ci-ok
    # The one check a ruleset requires. The test jobs skip by event and by
    # the changes verdict, and a skipped required check never reports, so
    # this job always runs and stands for all of them: it passes when every
    # needed job succeeded or skipped, and fails on any failure or
    # cancellation. A change set the changes job marks code=false thus
    # passes here with no test job run.
    needs:
      [
        changes,
        gates,
        test,
        e2e,
        test-macos,
        macos-affected,
        coverage,
        linux-jail,
        twice-green,
        windows,
        console-replay,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "a needed job concluded ${result}: ${RESULTS}"
                exit 1
                ;;
            esac
          done
          echo "every needed job succeeded or skipped: ${RESULTS}"

  green-tree:
    name: Record the green tree
    # The release gates accept a green push run on the tagged tree, not
    # only on the tagged commit, and this job is what makes a tree count as
    # green. It needs every other job, so it runs last and sees each
    # result. The not-cancelled guard keeps the skip of a pull-request-only
    # job from skipping it, and the result checks keep a failed or
    # cancelled job from recording anything. Push runs only, on main and
    # dev alike: a pull request run tests a merge of the head into the
    # base, a tree nobody tags. The tool writes the record when the heavy
    # jobs passed, or when the changes job skipped them against a green
    # tree that is itself recorded, and the record names that inherited
    # tree. A run that may not record stays green; the gates then accept
    # only its own commit.
    needs:
      [
        changes,
        gates,
        test,
        e2e,
        test-macos,
        macos-affected,
        coverage,
        linux-jail,
        twice-green,
        windows,
        console-replay,
        ci-ok,
      ]
    if: >-
      !cancelled() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # find the green run that recorded an inherited tree
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: an inherited tree is read off the green baseline
          # commit, which a shallow clone does not carry.
          fetch-depth: 0

      - name: Decide on the tree record
        id: record
        # The runner's system Python, as in the changes job: the tool is
        # stdlib-only. NEEDS carries every needed job's result and the
        # changes job's outputs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_green_tree.py record "${RUNNER_TEMP}/ci-green-tree.json"

      - name: Upload the tree record
        if: steps.record.outputs.recorded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-tree-${{ steps.record.outputs.tree }}
          path: ${{ runner.temp }}/ci-green-tree.json
          if-no-files-found: error
