name: Plugin Release

# Plugin Release pipeline. Fires on a ``v*`` version-tag push (mirrors the
# trigger style of release.yaml / phase-release.yaml) and publishes the
# rendered runtime plugin trees to their self-hosted marketplace sources:
#
#   * Claude — the rendered ``.claude-plugin/`` tree is published to npm as
#     the ``@elementarno/eawf`` package (the ``.claude-plugin/marketplace.json``
#     pointer references ``{"source": "npm", "package": "@elementarno/eawf"}``)
#     under a version-derived dist-tag, so a prerelease never becomes the
#     default install.
#   * Codex  — the rendered ``plugins/eawf/`` sub-tree is appended to a
#     dedicated ``plugins-dist`` branch (the ref the Codex ``git-subdir``
#     pointer references at ``path: ./plugins/eawf``, ``ref: plugins-dist``),
#     both at the pointer path and under a retained per-version path.
#   * Source host — the tag's release object carries the three artifact
#     kinds the ``github`` publication target declares (release notes, a
#     ``SHA256SUMS`` file over every dist and plugin artifact, and the
#     plugin bundle), flagged ``prerelease`` on a dev or rc channel so a
#     checkpoint is never advertised as the latest release.
#
# Each publish job leaves a ``publication-receipt-<target>.json`` behind
# whatever its conclusion: the runner is gone by the time the release
# ledger asks what happened, so ``release.reconcile`` reads the receipt
# rather than interrogating the leg.
#
# The render step calls the packager library directly (``uv run python``)
# rather than ``eawf plugin package`` because the CLI does not expose the
# ``publish_source`` switch — only the library accepts ``PublishSource.NPM``
# / ``PublishSource.GIT_SUBDIR`` to emit the published-pointer marketplace
# shape. A blocking validate gate runs over both rendered trees before any
# publish. ``workflow_dispatch`` renders + validates as a dry-run but never
# publishes (the publish jobs gate on a real ``v*`` tag push).
#
# Secrets consumed (none inlined): ``GITHUB_TOKEN`` (built-in) for the
# plugins-dist branch push + release notes. The npm publish holds no
# secret -- it authenticates by OIDC through npm trusted publishing,
# which binds to this workflow's filename, so renaming this file revokes
# its ability to publish.

on:
  push:
    tags:
      - "v*" # v0.5.0, v0.5.0a1, v0.5.0rc1, ...
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + validate only; skip publish"
        required: false
        default: "true"

permissions:
  contents: read

# One publish per tag; never cancel an in-flight publish.
concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-validate:
    name: Package + validate both runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      npm_version: ${{ steps.version.outputs.npm_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Resolve plugin version, npm dist-tag and npm version
        id: version
        # Derive the published version from the package itself so the npm
        # artifact + plugin manifests match the source-of-truth
        # ``eawf.__version__`` (which W03 couples to the tag at release).
        # Everything else is derived from that one string by the library
        # helpers, so the four outputs cannot disagree about which
        # checkpoint is being published:
        #
        #   * ``dist_tag`` -- prereleases land on ``next``, stable
        #     releases on ``latest``, so a prerelease never becomes the
        #     default ``npm install``.
        #   * ``npm_version`` -- npm speaks SemVer and rejects
        #     ``0.7.0.dev1`` outright, so the package is published as
        #     ``0.7.0-dev.1``.
        #   * ``prerelease`` -- the source-host release flag, read off
        #     the dist-tag rather than re-derived, because "publishes to
        #     the opt-in npm channel" and "is not the latest release on
        #     the source host" are the same fact about the channel.
        #
        # An unclassifiable version raises in either helper and reds the
        # job rather than defaulting a prerelease onto ``latest``.
        run: |
          set -euo pipefail
          uv run python - >> "$GITHUB_OUTPUT" <<'PY'
          import eawf
          from eawf.platform.install.dist_tag import (
              DIST_TAG_NEXT,
              dist_tag_for_version,
              npm_version_for,
          )

          version = eawf.__version__
          dist_tag = dist_tag_for_version(version)
          print(f"version={version}")
          print(f"dist_tag={dist_tag}")
          print(f"npm_version={npm_version_for(version)}")
          print(f"prerelease={'true' if dist_tag == DIST_TAG_NEXT else 'false'}")
          PY

      - name: Render published plugin trees (claude=npm, codex=git-subdir)
        # The CLI ``eawf plugin package`` always emits the LOCAL source
        # shape; the published-pointer shape is library-only. Call the
        # packager directly with the published ``PublishSource`` so the
        # rendered marketplace manifests carry the npm / git-subdir
        # pointers the W05 self-hosted catalog references.
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          from eawf.runtime.runtimes.claude.plugin_package import (
              PublishSource as ClaudePublishSource,
              package_plugin as package_claude,
          )
          from eawf.runtime.runtimes.codex.plugin_package import (
              PublishSource as CodexPublishSource,
              package_plugin as package_codex,
          )

          claude_target = Path("build/eawf-plugin")
          codex_target = Path("build/eawf-codex-marketplace")

          claude_result = package_claude(
              claude_target,
              force=True,
              publish_source=ClaudePublishSource.NPM,
          )
          print(f"claude tree: {claude_result.target}")

          codex_result = package_codex(
              codex_target,
              force=True,
              publish_source=CodexPublishSource.GIT_SUBDIR,
          )
          print(f"codex tree: {codex_result.target}")
          PY

      - name: Validate gate (blocking) — claude + codex trees
        # Blocking pre-publish gate. For Claude we prefer the official
        # ``claude plugin validate`` when the binary is present in CI;
        # otherwise we fall back to a JSON parse + required-key check so a
        # malformed manifest still reds the job. For Codex (no validator
        # binary) we parse the marketplace + plugin manifest and assert the
        # git-subdir pointer + required keys are intact.
        run: |
          set -euo pipefail
          claude_tree="build/eawf-plugin"
          codex_market="build/eawf-codex-marketplace/.agents/plugins/marketplace.json"
          codex_manifest="build/eawf-codex-marketplace/plugins/eawf/.codex-plugin/plugin.json"

          if command -v claude >/dev/null 2>&1; then
            echo "claude binary present — running official validator"
            (cd "$claude_tree" && claude plugin validate .)
          else
            echo "claude binary absent — falling back to JSON-schema/parse check"
          fi

          uv run python - "$claude_tree" "$codex_market" "$codex_manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          claude_tree = Path(sys.argv[1])
          codex_market = Path(sys.argv[2])
          codex_manifest = Path(sys.argv[3])

          failures: list[str] = []

          def load(path: Path) -> dict | None:
              if not path.is_file():
                  failures.append(f"missing: {path}")
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  failures.append(f"invalid JSON {path}: {exc}")
                  return None

          # Claude plugin manifest + marketplace pointer (npm source).
          claude_plugin = load(claude_tree / ".claude-plugin" / "plugin.json")
          if claude_plugin is not None:
              for key in ("name", "version"):
                  if key not in claude_plugin:
                      failures.append(f"claude plugin.json missing {key!r}")
              if claude_plugin.get("name") != "eawf":
                  failures.append(f"claude plugin name {claude_plugin.get('name')!r} != 'eawf'")

          claude_market = load(claude_tree / ".claude-plugin" / "marketplace.json")
          if claude_market is not None:
              plugins = claude_market.get("plugins", [])
              entry = next((p for p in plugins if p.get("name") == "eawf"), None)
              if entry is None:
                  failures.append("claude marketplace has no 'eawf' plugin entry")
              else:
                  source = entry.get("source")
                  if not (isinstance(source, dict) and source.get("source") == "npm"):
                      failures.append(f"claude marketplace source not npm pointer: {source!r}")

          # Codex marketplace + manifest (git-subdir pointer).
          market = load(codex_market)
          if market is not None:
              plugins = market.get("plugins", [])
              entry = next((p for p in plugins if p.get("name") == "eawf"), None)
              if entry is None:
                  failures.append("codex marketplace has no 'eawf' plugin entry")
              else:
                  source = entry.get("source")
                  if not (isinstance(source, dict) and source.get("source") == "git-subdir"):
                      failures.append(f"codex marketplace source not git-subdir: {source!r}")
                  elif source.get("ref") != "plugins-dist":
                      failures.append(f"codex git-subdir ref {source.get('ref')!r} != 'plugins-dist'")

          codex_plugin = load(codex_manifest)
          if codex_plugin is not None and "name" not in codex_plugin:
              failures.append("codex plugin.json missing 'name'")

          if failures:
              print("plugin validate gate FAILED:")
              for entry in failures:
                  print(f"  - {entry}")
              sys.exit(1)
          print("plugin validate gate passed (both runtimes)")
          PY

      - name: Upload rendered trees
        uses: actions/upload-artifact@v4
        with:
          name: plugin-trees
          path: build/
          retention-days: 7
          # The rendered trees ARE dotdirs (.claude/, .agents/, .codex-plugin/);
          # upload-artifact@v4 excludes hidden files by default, which would
          # strip the entire plugin payload (the publish jobs then download empty
          # trees -> codex cp fails, npm publishes an incomplete package).
          include-hidden-files: true

  require-green-ci:
    name: Require green CI on the tagged commit
    # Closes the gap that let v0.5.2 publish while its CI run was red: the
    # publish jobs below `needs:` this gate, which refuses to proceed unless
    # the CI workflow concluded `success` for this exact commit. The release
    # commit lands on `main` (where ci.yaml runs) before the tag is pushed,
    # so a CI run for the SHA already exists or is in flight — this gate waits
    # for it, then asserts success. A `workflow_dispatch` dry-run skips it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Above the 30-min (SECONDS + 1800) in-flight-CI wait loop below, so the
    # job's own timeout never fires before its internal deadline.
    timeout-minutes: 35
    permissions:
      actions: read # read the CI workflow's run conclusion for this SHA
    steps:
      - name: Assert ci.yaml concluded success for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1800 )) # wait up to 30 min for an in-flight run
          while :; do
            read -r status conclusion < <(
              gh api "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${SHA}&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status // "missing") \(.conclusion // "none")"'
            )
            echo "ci.yaml for ${SHA:0:10}: status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              [ "${conclusion}" = "success" ] && { echo "CI green — release may proceed"; exit 0; }
              echo "refusing to publish: CI concluded '${conclusion}', not 'success'" >&2
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "refusing to publish: timed out waiting for CI to complete on ${SHA}" >&2
              exit 1
            fi
            sleep 30
          done

  publish-claude-npm:
    name: Publish Claude plugin to npm
    needs: [package-validate, require-green-ci]
    # Live publish, gated on a real ``v*`` tag push. ``workflow_dispatch``
    # renders + validates in package-validate but never reaches publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a
      # short-lived credential at publish time. Without it npm falls back
      # to looking for a token, and the registry answers a scoped package
      # it cannot authenticate for with 404 rather than 401 -- an error
      # that names the wrong problem entirely.
      id-token: write
    steps:
      - name: Download rendered trees
        uses: actions/download-artifact@v4
        with:
          name: plugin-trees
          path: build/

      - name: Set up Node + npm registry
        # Trusted publishing requires npm >= 11.5.1 on Node >= 22.14.0.
        # The npm bundled with a Node release lags, so the floor is
        # asserted explicitly rather than inferred from node-version.
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Assert the npm floor trusted publishing needs
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          node --version

      - name: Synthesize npm package manifest
        # The rendered Claude tree carries ``.claude-plugin/plugin.json``
        # (the Claude marketplace manifest) but no ``package.json``; npm
        # needs one. Synthesize a minimal manifest naming the package
        # ``@elementarno/eawf`` (matching the npm-source pointer
        # ``package: "@elementarno/eawf"`` — scoped because the registry
        # rejects the bare ``eawf`` name as too similar to an existing one)
        # at the npm spelling of the resolved version. npm's grammar is
        # SemVer, which has no PEP 440 ``.devN`` segment: publishing
        # ``0.7.0.dev1`` is rejected by the registry, so the manifest
        # carries the ``0.7.0-dev.1`` form the library derives.
        env:
          PLUGIN_VERSION: ${{ needs.package-validate.outputs.npm_version }}
        run: |
          set -euo pipefail
          cd build/eawf-plugin
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["PLUGIN_VERSION"]
          manifest = {
              "name": "@elementarno/eawf",
              "version": version,
              "description": (
                  "Eä Workflow — state-first, agent-driven development framework "
                  "(Claude Code plugin)."
              ),
              "license": "MIT",
              "repository": {
                  "type": "git",
                  "url": "git+https://github.com/Elementarno9/eawf.git",
              },
              "files": [
                  ".claude-plugin/",
                  "skills/",
                  "agents/",
                  "hooks.json",
                  "hooks/",
                  "README.md",
              ],
          }
          Path("package.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(f"wrote package.json name=@elementarno/eawf version={version}")
          PY

      - name: Publish to npm
        # ``npm publish`` with no ``--tag`` writes ``latest``, which would
        # make a prerelease the default install for every new user. Pass
        # the dist-tag derived from the version in package-validate so a
        # prerelease is reachable only via an explicit ``@next``.
        #
        # The tarball is packed first and published by path rather than
        # from the working directory, so the bytes the receipt below
        # digests are the exact bytes the registry received. Digesting a
        # tree and publishing a repack of it proves nothing.
        id: npm
        # No NODE_AUTH_TOKEN: authentication is the OIDC exchange above.
        # A token present here takes precedence over trusted publishing,
        # so leaving a stale one would keep failing while looking
        # configured.
        env:
          DIST_TAG: ${{ needs.package-validate.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_TAG}" ]; then
            echo "refusing to publish: dist-tag not resolved by package-validate" >&2
            exit 1
          fi
          cd build/eawf-plugin
          tarball="$(npm pack --silent)"
          echo "tarball=build/eawf-plugin/${tarball}" >> "$GITHUB_OUTPUT"
          npm publish "${tarball}" --access public --tag "${DIST_TAG}"

      - name: Write the npm publication receipt
        # Written whether the publish succeeded or not, and whatever the
        # runner concluded: the ledger's job is to learn what happened,
        # and a receipt that only exists on success teaches it nothing
        # about the case it needs help with. ``release.reconcile`` maps
        # ``job_conclusion`` onto reported_success / reported_failure /
        # unknown -- never an observed state, which takes a read-back.
        if: always()
        env:
          TARGET_ID: npm
          RECEIPT_VERSION: ${{ needs.package-validate.outputs.npm_version }}
          JOB_CONCLUSION: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_PATHS: ${{ steps.npm.outputs.tarball }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target_id = os.environ["TARGET_ID"]
          paths = [Path(p) for p in os.environ["ARTIFACT_PATHS"].split() if p]
          digests = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in paths
              if path.is_file()
          }
          receipt = {
              "target_id": target_id,
              "version": os.environ["RECEIPT_VERSION"],
              "artifact_digests": digests,
              "job_conclusion": os.environ["JOB_CONCLUSION"],
              "run_id": os.environ["RUN_ID"],
          }
          out = Path(f"publication-receipt-{target_id}.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload the npm publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt-npm
          path: publication-receipt-npm.json

  publish-codex-branch:
    name: Publish Codex tree to plugins-dist branch
    needs: [package-validate, require-green-ci]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # append the rendered tree to plugins-dist
    steps:
      - name: Download rendered trees
        uses: actions/download-artifact@v4
        with:
          name: plugin-trees
          path: build/

      - name: Append rendered Codex tree to plugins-dist branch
        # The Codex git-subdir pointer references ``path: ./plugins/eawf``,
        # ``ref: plugins-dist``, so the rendered sub-tree is laid at the
        # branch root for the moving "newest release" pointer AND copied to
        # a retained ``versions/<version>/plugins/eawf`` path.
        #
        # The publish commits ON TOP of the existing branch and pushes
        # without ``--force``: the previous orphan + force-push shape erased
        # every prior version on each release, so an operator who needed to
        # pin or roll back to the last-known-good Codex plugin had no ref
        # left to point at. Keeping the history (and the per-version paths)
        # makes every published version addressable, and a non-force push
        # also refuses to clobber a concurrent publish. Uses the built-in
        # ``GITHUB_TOKEN``.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_VERSION: ${{ needs.package-validate.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src="$(pwd)/build/eawf-codex-marketplace/plugins/eawf"
          market="$(pwd)/build/eawf-codex-marketplace/.agents/plugins/marketplace.json"
          if [ ! -d "$src" ]; then
            echo "rendered codex sub-tree missing: $src" >&2
            exit 1
          fi

          work="$(mktemp -d)"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          # Build on the published history when the branch exists; the very
          # first publish starts it.
          if git fetch -q origin plugins-dist; then
            git checkout -q -B plugins-dist FETCH_HEAD
          else
            git checkout -q -b plugins-dist
          fi

          version_path="versions/${PLUGIN_VERSION}"
          if [ -e "$version_path" ]; then
            echo "refusing to republish: ${version_path} already on plugins-dist" >&2
            exit 1
          fi

          # Retained per-version snapshot (the rollback target).
          mkdir -p "$version_path/plugins/eawf" "$version_path/.agents/plugins"
          cp -R "$src/." "$version_path/plugins/eawf/"
          cp "$market" "$version_path/.agents/plugins/marketplace.json"

          # Moving pointer paths the git-subdir source resolves against.
          rm -rf plugins/eawf
          mkdir -p plugins/eawf .agents/plugins
          cp -R "$src/." plugins/eawf/
          cp "$market" .agents/plugins/marketplace.json

          # ``-f``: the branch is a rendered-artifact mirror, so nothing in it
          # is ever legitimately ignored — an ambient excludes file that hides
          # ``.agents/`` would otherwise publish a silently incomplete tree.
          git add -A -f
          git commit -q -m "Publish Codex plugin tree for ${TAG} (version ${PLUGIN_VERSION})"
          git push -q origin plugins-dist

  publish-source-host:
    name: Publish source-host release assets
    needs: [package-validate, publish-claude-npm, publish-codex-branch]
    # The third publication leg. The ``github`` target of the checkpoint
    # configuration declares three artifact kinds -- ``release_notes``,
    # ``checksums`` and ``plugin_bundle`` -- and the source-host
    # observation adapter reads the published release object back
    # asset-by-asset against the frozen manifest. So this job is not
    # "notes, plus some files": it is the leg whose absence leaves the
    # release record unable to reach VERIFYING.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # gh release create / edit / upload
      actions: read # read the Release workflow's dist artifact for this SHA
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rendered trees
        uses: actions/download-artifact@v4
        with:
          name: plugin-trees
          path: build/

      - name: Download the dist artifact from the Release run
        # The checksums file covers every artifact the tag publishes, and
        # the wheel + sdist are built by release.yaml, in a different
        # workflow run. Same head SHA, so the run is found the way
        # ``require-green-ci`` finds the CI run; the wait loop exists
        # because the two workflows start together and release.yaml's
        # build job may still be uploading.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 900 ))
          while :; do
            run_id="$(
              gh api "repos/${REPO}/actions/workflows/release.yaml/runs?head_sha=${SHA}&per_page=1" \
                --jq '.workflow_runs[0].id // empty'
            )"
            if [ -n "${run_id}" ] && gh run download "${run_id}" --repo "${REPO}" \
                 --name dist --dir dist 2>/dev/null; then
              echo "downloaded dist from release.yaml run ${run_id}"
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "refusing to publish: no dist artifact for ${SHA} after 15 min" >&2
              exit 1
            fi
            echo "waiting for release.yaml to upload dist for ${SHA:0:10}"
            sleep 30
          done
          ls -l dist/

      - name: Assemble release notes, checksums and the plugin bundle
        # The three asset filenames come from
        # ``eawf.workflow.release.source_host_assets``, which is also
        # what the observation adapter compares against -- one home for
        # the strings, so a rename cannot land on only one side.
        #
        # The bundle is a tarball rather than a zip because the rendered
        # plugin tree carries executable hooks and dotdirs, and tar keeps
        # both modes and names intact.
        env:
          PLUGIN_VERSION: ${{ needs.package-validate.outputs.version }}
          NPM_VERSION: ${{ needs.package-validate.outputs.npm_version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="eawf-plugin-${PLUGIN_VERSION}.tar.gz"
          tar -czf "${bundle}" -C build/eawf-plugin .
          {
            echo "## Plugin distribution"
            echo
            echo "- Claude: \`npm install @elementarno/eawf@${NPM_VERSION}\` (or \`/plugin install eawf@eawf\` after \`marketplace add\`)."
            echo "- Codex: rendered tree on the \`plugins-dist\` branch (\`git-subdir\` pointer at \`./plugins/eawf\`)."
            echo "- Codex (pin / rollback): the same tree is retained at \`versions/${PLUGIN_VERSION}/plugins/eawf\` on \`plugins-dist\`."
            echo
            echo "## Verifying the artifacts"
            echo
            echo "\`SHA256SUMS\` covers every wheel, sdist and plugin bundle attached to ${TAG}."
            echo "Download it beside the artifacts and run \`sha256sum -c SHA256SUMS\`."
          } > RELEASE_NOTES.md
          sha256sum dist/* "${bundle}" | sed 's| .*/| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Create or edit the tag release with every declared asset
        # ``gh release create`` fails when the release already exists and
        # ``edit`` fails when it does not, and either can be true here:
        # phase-release.yaml creates the release for a phase-close merge,
        # while a hand-pushed tag has none. Hence create-or-edit.
        #
        # ``--prerelease`` is the source-host half of REL-016: a host
        # advertises the newest non-prerelease release as *the* release,
        # so a dev or rc checkpoint published without the flag lands on
        # the stable default channel exactly as an npm ``latest`` would.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PLUGIN_VERSION: ${{ needs.package-validate.outputs.version }}
          PRERELEASE: ${{ needs.package-validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          bundle="eawf-plugin-${PLUGIN_VERSION}.tar.gz"
          if [ "${PRERELEASE}" = "true" ]; then
            flag="--prerelease"
          else
            flag="--latest"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file RELEASE_NOTES.md "${flag}"
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file RELEASE_NOTES.md "${flag}"
          fi
          gh release upload "${TAG}" \
            RELEASE_NOTES.md \
            SHA256SUMS \
            "${bundle}" \
            --clobber

      - name: Write the source-host publication receipt
        # Written whether the publish succeeded or not, and whatever the
        # runner concluded: the ledger's job is to learn what happened,
        # and a receipt that only exists on success teaches it nothing
        # about the case it needs help with. ``release.reconcile`` maps
        # ``job_conclusion`` onto reported_success / reported_failure /
        # unknown -- never an observed state, which takes a read-back.
        if: always()
        env:
          TARGET_ID: github
          RECEIPT_VERSION: ${{ needs.package-validate.outputs.version }}
          JOB_CONCLUSION: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          PLUGIN_VERSION: ${{ needs.package-validate.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target_id = os.environ["TARGET_ID"]
          version = os.environ["PLUGIN_VERSION"]
          paths = [
              Path("RELEASE_NOTES.md"),
              Path("SHA256SUMS"),
              Path(f"eawf-plugin-{version}.tar.gz"),
          ]
          digests = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in paths
              if path.is_file()
          }
          receipt = {
              "target_id": target_id,
              "version": os.environ["RECEIPT_VERSION"],
              "artifact_digests": digests,
              "job_conclusion": os.environ["JOB_CONCLUSION"],
              "run_id": os.environ["RUN_ID"],
          }
          out = Path(f"publication-receipt-{target_id}.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload the source-host publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt-github
          path: publication-receipt-github.json
