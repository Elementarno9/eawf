acceptance:
  commands:
    build: null
    lint: null
    tests: just test
    typecheck: null
  required_before_ship:
  - state
audit:
  fix_safe: true
flow:
  auto_accept:
    audit: true
    polish: true
    research: true
mcp:
  enabled: []
planning:
  max_parallel_waves: 10
polish:
  auto_apply_safe: true
profiles:
  enabled:
  - core
  - python
  - research
  - agent_driven
  - quality
research:
  agent_count: 10
  default_depth: deep
runtime:
  adapters:
  - claude-code
  preference:
  - claude-code
schema_version: '1.0'
verify:
  juror_wall_clock_seconds: 1800.0
  odr_blocking: true
