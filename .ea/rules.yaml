rules:
  - rule_id: repo.cli-dispatch
    obligation_id: architecture.cli-dispatch
    revision: 1
    title: Keep the CLI a dispatch layer over the library
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Keep CLI handlers to argument parsing, dispatch and output formatting, put every piece of domain logic in the library, and pass handlers typed config and state objects, never raw dicts.
    rationale: >-
      Logic in the library is reachable from the daemon, the TUI and tests alike; logic in a handler is reachable only through a subprocess.
    verification:
      method: review
  - rule_id: repo.strict-config-validation
    obligation_id: config.strict-validation
    revision: 2
    title: Validate every YAML and JSON input with a closed model
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Parse every YAML or JSON input through a Pydantic v2 model configured with extra="forbid" inside its loader.
    rationale: >-
      An open model lets a misspelt key pass silently and the setting it meant to change never takes effect.
    verification:
      method: review
  - rule_id: repo.naming-conventions
    obligation_id: naming.canonical-names
    revision: 2
    title: Use one canonical name per cross-cutting concept
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Give each cross-cutting concept one canonical field, parameter and log-key name (agent_role, effort_bucket, evidence_kind, scope_id, output_dir), and rename an outlier to the dominant form before merging instead of adding an adapter.
    rationale: >-
      Parallel names for one concept drift across state models, envelopes and logs until a search for one misses the others.
    verification:
      method: review
    procedure_ref: docs/rules/naming-conventions.md
  - rule_id: repo.milestone-equals-release
    obligation_id: release.milestone-cadence
    revision: 3
    title: Ship every accepted Milestone as at least a minor release
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Ship every accepted Milestone as at least a minor release: the commit recording its acceptance bumps src/eawf/_version.py (pyproject.toml stays dynamically versioned), and the release cut from its merged pull request tags it.
    rationale: >-
      A Milestone is this repository's unit of shipped value, so a tag per Milestone keeps the published version honest about what landed.
    verification:
      method: review
    procedure_ref: docs/rules/agent-driven-milestone-equals-release.md
  - rule_id: repo.large-milestone-pr
    obligation_id: delivery.milestone-pr-size
    revision: 8
    title: Keep one pull request per Milestone regardless of size
    zone: steering
    force: should
    effectiveness: behavioral
    instruction: >-
      Never split a Milestone's pull request to chase a line count; keep every Batch commit buildable so bisect stays sharp, and fast-forward main to the reviewed commit so each survives.
    rationale: >-
      The review bottleneck here is coherent deliveries rather than line count, and per-Batch commits already give per-change history inside the pull request.
    verification:
      method: review
    procedure_ref: docs/rules/agent-driven-large-milestone-pr.md
  - rule_id: repo.cadence-decisions
    obligation_id: delivery.cadence-provenance
    revision: 8
    title: Cite the ratifying decision when the cadence is questioned
    zone: steering
    force: should
    effectiveness: behavioral
    instruction: >-
      When a review questions the one-pull-request-per-Milestone cadence or the commit-history regime, cite decision D92 in the decision ledger, which superseded D87; reverse it only by superseding D92 with a new one.
    rationale: >-
      The cadence departs from small-change practice on purpose; without the decision trail it reads as an oversight and gets reverted.
    verification:
      method: review
    procedure_ref: docs/rules/agent-driven-cadence-adr-pointer.md
  - rule_id: repo.research-evidence-chain
    obligation_id: research.evidence-chain
    revision: 3
    title: Back every research claim with a digest-cited artifact
    zone: constitution
    force: must
    effectiveness: behavioral
    instruction: >-
      Record the artifact behind every behaviour, performance or correctness claim under `.ea/local/` and cite it by sha256 digest in the state row; link each audit to its hypothesis, claim and artifact, and have each decision cite its justifying audit.
    rationale: >-
      Artifacts stay local unless promoted, so the digest in state is what proves which notebook, log or dataset backed a decision.
    verification:
      method: review

