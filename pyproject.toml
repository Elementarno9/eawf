[project]
name = "eawf"
version = "0.1.0"
description = "Eä Workflow — agent-driven development framework"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Elementarno9", email = "edwardpro9@gmail.com" },
]
dependencies = [
    "jinja2>=3.1.0",
    "jsonschema>=4.26.0",
    "orjson>=3.11.9",
    "platformdirs>=4.9.6",
    "portalocker>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
eawf = "eawf.cli.app:main"
ea = "eawf.cli.app:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "ruff>=0.6.9",
    "mypy>=1.13",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
    "types-PyYAML>=6.0.12.20240917",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not eval'"
markers = [
    "unit: fast in-process unit tests",
    "integration: integration tests crossing module boundaries",
    "property: Hypothesis-driven property tests",
    "golden: golden-output regression tests",
    "slow: long-running tests (excluded from default run)",
    "acceptance: phase-gate end-to-end acceptance scenarios",
    "eval: skill-dispatch golden-envelope regression suite (opt-in)",
    "golden_scenarios: end-to-end lifecycle golden-tree scenarios",
]

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["eawf"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.coverage.run]
source = ["src/eawf"]
branch = true

[tool.coverage.report]
fail_under = 0

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eawf"]
