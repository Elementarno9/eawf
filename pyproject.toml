[tool.eawf.coverage.tui_behavioural]
# The TUI quality number is NOT line-cov (waived above): Textual widgets
# render asynchronously and line/branch coverage misreports them. The
# behavioural surface is enforced by counting the screen-level golden
# snapshots + the operator-journey ``tui_flow`` specs the suite exercises,
# a counts-based ratchet that fires the moment a screen snapshot or a flow
# is deleted without replacement. Floors sit just below the counts measured
# on 2026-06-10 (69 goldens, 7 G1-G7 flows) so the gate is GREEN today and
# ratchets up as screens / flows are added. ``affordance_parity`` coverage
# (every advertised footer key resolves across MODES) is enforced by the
# affordance-matrix snapshot test, not a count here.
golden_glob = "tests/snapshots/tui/golden/*.txt"
min_goldens = 67
flow_glob = "tests/snapshots/tui/test_tui_flow.py"
min_flows = 7

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-source version: Hatchling reads ``__version__`` from
# ``src/eawf/_version.py`` at build time, so the package version, the
# ``eawf --version`` banner, and ``importlib.metadata.version("eawf")``
# all derive from one literal. ``tools/version_bump.py`` is the rewrite
# path; the release pipeline never edits this file's version.
[tool.hatch.version]
path = "src/eawf/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eawf"]
# ``_data/`` is populated at wheel-build time by the custom build hook
# below (it does not exist in the source tree). Force-include keeps it
# in the wheel even though it is gitignored / generated.
force-include = { "src/eawf/_data" = "eawf/_data" }

[tool.hatch.build.targets.wheel.hooks.custom]
# Custom build hook that populates ``src/eawf/_data/`` from the
# repo-root template + asset directories before the wheel is assembled.
# Wheel-only: the daemon reads service templates from the repo-root
# ``templates/`` dir in dev; the bundled ``_data/`` copy is the
# installed-from-PyPI read path.
path = "tools/bundle_data.py"

[tool.eawf.bundle]
# Source directories the ``bundle_data`` hook copies into the wheel's
# ``eawf/_data/`` tree. Paths are repo-relative. ``service_templates``
# is the only mandatory bundle in v0.3 (per-OS daemon unit files);
# the plugin trees / init templates / docs subset from the C10 design
# are bundled in a later release phase when the canonical trees land.
service_templates_dir = "templates"
service_templates = [
    "eawfd.service.j2",
    "dev.eawf.eawfd.plist.j2",
]
# Wheel-size ceiling enforced by the packaging gate (bytes). The C10
# design targeted 1 MB against a ~350 KB source-only wheel; the tree grew
# through P22-P27 so the literal 1 MB target is unreachable. After the
# P27-I05 layered regroup + dead-code trim the bundled wheel measured
# ~1.47 MB and the ceiling was set at 1.6 MiB (~14 % headroom). The P28-I03
# verify-spine + IntentBrief-consumer surface (W57 / W60) added flag help
# text and dispatch wiring that pushed the wheel to ~1.61 MB. Recalibrate
# 2026-05-28 to 2 MiB (2097152) so headroom returns to ~19 % while still
# catching a large regression (e.g. accidentally bundling all three plugin
# trees or the rendered docs subset). Recalibrate down once the plugin
# trees move behind install extras. P29 (v0.5) added the EAWF016-019 lint
# suite, the math doc-type, the plugin skill bodies, and the 1.5 schema —
# all pure src code (verified: no .vale / golden / plugin-tree bundling) —
# pushing the wheel to ~2.06 MiB; recalibrate to 2.5 MiB (~21 % headroom).
wheel_max_bytes = 2621440
