[project]
name = "eawf"
version = "0.2.0"
description = "Eä Workflow — agent-driven development framework"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Elementarno9", email = "edwardpro9@gmail.com" },
]
dependencies = [
    "jinja2>=3.1.0",
    "jsonschema>=4.26.0",
    "orjson>=3.11.9",
    "platformdirs>=4.9.6",
    "portalocker>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "textual>=8.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
# Windows-only: pywin32 backs the named-pipe transport in
# ``eawf.daemon.windows_pipe`` + ``windows_security`` and the
# pywin32 ServiceFramework wiring landing in P24-W04. The package
# is not installable from PyPI on POSIX; bundle it in this extras
# group so ``pip install eawf[windows]`` is the operator path.
windows = ["pywin32>=306"]

[project.scripts]
eawf = "eawf.cli.app:main"
ea = "eawf.cli.app:main"
eawfd = "eawf.daemon.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "ruff>=0.6.9",
    "mypy>=1.13",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
    "types-PyYAML>=6.0.12.20240917",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not eval'"
markers = [
    "unit: fast in-process unit tests",
    "integration: integration tests crossing module boundaries",
    "property: Hypothesis-driven property tests",
    "golden: golden-output regression tests",
    "slow: long-running tests (excluded from default run)",
    "acceptance: phase-gate end-to-end acceptance scenarios",
    "eval: skill-dispatch golden-envelope regression suite (opt-in)",
    "golden_scenarios: end-to-end lifecycle golden-tree scenarios",
]

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["eawf"]

[[tool.mypy.overrides]]
# Windows-only transport: pywin32 stubs are not installable on the
# POSIX dev/CI hosts where mypy runs. The modules are import-guarded
# (``raise ImportError`` on non-win32) so non-Windows builds never
# resolve these symbols; lifting the stub requirement keeps the
# rest of the tree under strict checking.
module = [
    "eawf.daemon.windows_pipe",
    "eawf.daemon.windows_security",
    "eawf.daemon.win_service",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.eawf.lint]
# Registration for the project's custom static-analysis rules under
# ``src/eawf/lint/`` (EAWF001 log-format, EAWF002 log-key naming,
# EAWF003 logger acquisition, EAWF010 module-length cap). Ruff carries
# no ``EAWF`` plugin, so these checks read their config from this table
# rather than ``[tool.ruff.lint]``. ``enabled`` is the rule allow-list a
# pre-commit dispatcher iterates; per-rule knobs live in the sub-tables.
enabled = ["EAWF001", "EAWF002", "EAWF003", "EAWF010"]

[tool.eawf.lint.eawf010]
# Module-length rollup cap (physical lines). Modules over ``max-loc``
# must either be split or carry a ``# noqa: EAWF010 <rationale>`` waiver.
max-loc = 700
# Pre-existing oversized modules predate the cap. They are excluded here
# (rather than waived inline) so the rule can be wired without redding
# the current tree and without this wave editing source it does not own.
# P27-W06/W07 split the two largest (lifecycle.py + evidence.py); drop
# those rows as the splits land. New modules get no exclusion — they
# must respect the cap or carry an inline waiver.
exclude = [
    "src/eawf/config/registry.py",
    "src/eawf/cli/commands/plugin.py",
    "src/eawf/cli/commands/repo.py",
    "src/eawf/tui_v2/screens/overlays/config_modal.py",
    "src/eawf/cli/commands/memory.py",
    "src/eawf/skills/flow.py",
    "src/eawf/cli/commands/config.py",
    "src/eawf/render/skills.py",
    "src/eawf/render/plan_view.py",
    "src/eawf/tui_v2/palette/verbs.py",
    "src/eawf/cli/commands/roadmap.py",
    "src/eawf/validate/invariants.py",
    "src/eawf/cli/commands/estimation.py",
    "src/eawf/cli/commands/mcp.py",
    "src/eawf/daemon/methods/state.py",
    "src/eawf/cli/commands/skill.py",
    "src/eawf/daemon/methods/config.py",
    "src/eawf/install/wizard.py",
    "src/eawf/daemon/methods/spec.py",
    "src/eawf/cli/commands/worktree.py",
    # P27-W04 grew this CLI-dispatch module past the cap with the four
    # diff-scoped lint subcommands; a split is a future-hygiene candidate.
    "src/eawf/cli/commands/hook.py",
]

[tool.coverage.run]
source = ["src/eawf"]
branch = true

[tool.coverage.report]
# Overall floor. Measured total sits well above this (line ~87%, branch
# ~78% on 2026-05-22); the floor stays low because the TUI line-cov gate
# is waived (asynchronous Textual render misreports line hits, dropping
# the achievable overall by ~15 points). The real regression-catching is
# the per-package ratchet in ``[tool.eawf.coverage]``; this floor only
# catches large-scale dead-code accumulation.
fail_under = 60

[tool.eawf.coverage]
# Per-package coverage gates (C09 §5.2 nine-layer grouping). pytest-cov
# has no native per-package threshold, so the CI ``coverage gate`` step
# parses ``coverage.xml`` and asserts each gated package's measured
# line/branch rate clears its threshold here. Thresholds are a ratchet:
# each is set just below the coverage measured on 2026-05-22 (a ~1-point
# safety margin absorbs cross-OS / test-selection variance) so the gate
# catches regressions without redding CI on the current tree. See
# ``docs/reference/coverage-gates.md`` for measured headroom + rationale.
#
# Each row maps a gate key to ``[line_threshold, branch_threshold]``.
# ``path`` is the filename prefix (relative to ``src/eawf``) the checker
# aggregates; ``glob`` rows match by suffix instead. ``waive_line`` /
# ``waive_branch`` opt a layer out of that dimension.

[tool.eawf.coverage.gates.daemon]
path = "daemon/"
line = 77
branch = 64

[tool.eawf.coverage.gates.telemetry]
path = "telemetry/"
line = 93
branch = 86

[tool.eawf.coverage.gates.skills]
path = "skills/"
line = 93
branch = 81

[tool.eawf.coverage.gates.cli]
path = "cli/"
line = 75
branch = 65

[tool.eawf.coverage.gates.tui_v2]
# Line + branch waived: Textual widgets render asynchronously and
# line-cov misreports. Screen coverage is enforced by the snapshot
# pairing gate (C09 §5.2), not by this line/branch ratchet.
path = "tui_v2/"
waive_line = true
waive_branch = true

[tool.eawf.coverage.gates.render]
path = "render/"
line = 89
branch = 74

[tool.eawf.coverage.gates.store]
path = "store/"
line = 97
branch = 84

[tool.eawf.coverage.gates.state]
path = "state/"
line = 98
branch = 95

[tool.eawf.coverage.gates.lock]
path = "lock/"
line = 86
branch = 80

[tool.eawf.coverage.gates.plugin_install]
# Crash-relevant install surface across all three runtimes.
glob = "runtimes/*/plugin_install.py"
line = 95
branch = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eawf"]
