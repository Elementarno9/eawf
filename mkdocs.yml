site_name: Eä Workflow
site_description: Agent-driven development framework — Eä manifest at runtime.
repo_url: https://github.com/Elementarno9/eawf
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Tutorial:
      - Quickstart: tutorial/quickstart.md
      - Profile picker: tutorial/profile-picker.md
      - Research campaigns: tutorial/research-campaigns.md
      - TUI tour: tutorial/tui-tour.md
      - Troubleshooting: tutorial/troubleshooting.md
  - Concepts: concepts.md
  - Architecture:
      - Overview: architecture/overview.md
      - State model: architecture/state-model.md
      - CLI surface: architecture/cli-surface.md
      - Workflow: architecture/workflow.md
      - Profiles: architecture/profiles.md
      - Plugins: architecture/plugins.md
      - Memory: architecture/memory.md
      - Envelope: architecture/envelope.md
      - Statusline: architecture/statusline.md
      - Installation: architecture/installation.md
  - Reference:
      - Overview: reference/index.md
      - Doctor: reference/doctor.md
      - Enums: reference/enums.md
      - Exit codes: reference/exit-codes.md
      - Error codes: reference/error-codes.md
      - Hook events: reference/hook-events.md
      - Lockfile semantics: reference/lockfile-semantics.md
      - URN namespace: reference/urn-namespace.md
      - Coverage gates: reference/coverage-gates.md
      - Snapshot-pairing gate: reference/snapshot-gate.md
      - Mutation testing: reference/mutation-testing.md
      - Auto-generated:
          - Index: reference/autogen/index.md
          - CLI: reference/autogen/cli.md
          - Skills: reference/autogen/skills.md
          - JSON Schema: reference/autogen/schema.md
          - Enums: reference/autogen/enums.md
          - Error codes: reference/autogen/error-codes.md
          - Exit codes: reference/autogen/exit-codes.md
  - Policy:
      - AGENTS.md / CLAUDE.md: policy/agents-claude-md.md
      - No PLAN.md: policy/no-plan-md.md
      - Fixed decisions: policy/fixed-decisions.md
  # Generated rule expansions. Every page here is written by `eawf sync` from a
  # profile render block that declares `placement: reference`; the always-on
  # AGENTS.md keeps a one-line pointer to each. Adding a reference-placed block
  # means adding its page here too -- tests/unit/test_mkdocs_nav.py fails when
  # the two drift.
  - Rules:
      - Artifact chassis and citations: rules/artifact-chassis.md
      - Doc-clarity contract: rules/clarity-contract.md
      - Commit prefix: rules/commit-prefix.md
      - Entity-title naming: rules/entity-title-naming.md
      - Naming conventions: rules/naming-conventions.md
      - Memory hygiene: rules/memory-hygiene.md
      - Planned-scope revisability: rules/planned-scope-revisability.md
      - Release process: rules/release-process.md
      - Ship process: rules/ship-process.md
      - Spike workflow: rules/spike-workflow.md
      - Workflow lifecycle: rules/workflow-lifecycle.md
      - Engineering principles: rules/engineering-principles.md
      - Other engineering practice: rules/engineering-practice.md
      - Code craft - don't repeat yourself: rules/code-craft-dry.md
      - Code craft - fail fast: rules/code-craft-fail-fast.md
      - Code craft - single responsibility: rules/code-craft-single-responsibility.md
      - Code craft - explicit over implicit: rules/code-craft-explicit-over-implicit.md
      - Phase equals release: rules/agent-driven-phase-equals-release.md
      - One PR per phase: rules/agent-driven-large-phase-pr.md
      - Cadence decision pointer: rules/agent-driven-cadence-adr-pointer.md
      - Lean wave verification: rules/lean-wave-verification.md
